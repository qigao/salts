name: Restore compiled native inputs
description: Restore one immutable native build for CTest and benchmark consumers.
inputs:
  artifact:
    description: Artifact produced by the native build matrix.
    required: true
  build-dir:
    description: Build directory recorded by the selected profile.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: compiled
    - name: Restore matching build and source timestamps
      shell: bash
      env:
        EXPECTED_ARTIFACT: ${{ inputs.artifact }}
        EXPECTED_BUILD_DIRECTORY: ${{ inputs.build-dir }}
      run: |
        set -euo pipefail
        if [ "$(tar -xOf compiled/native-build.tar native-build-commit.txt)" != "$(git rev-parse HEAD)" ]; then
          echo 'Build artifact commit does not match the consumer checkout' >&2
          exit 1
        fi
        if [ "$(tar -xOf compiled/native-build.tar native-build-workspace.txt)" != "$(pwd -P)" ]; then
          echo 'Build artifact requires the original workspace path' >&2
          exit 1
        fi
        build_platform="$(tar -xOf compiled/native-build.tar native-build-platform.txt)"
        current_platform="$RUNNER_OS/$RUNNER_ARCH/$ImageOS"
        if [ "$build_platform" != "$current_platform" ]; then
          printf 'Build artifact platform mismatch: built=%s current=%s\n' "$build_platform" "$current_platform" >&2
          exit 1
        fi
        build_profile="$(tar -xOf compiled/native-build.tar native-build-profile.txt)"
        expected_profile="$(printf '%s\n%s' "$EXPECTED_ARTIFACT" "$EXPECTED_BUILD_DIRECTORY")"
        if [ "$build_profile" != "$expected_profile" ]; then
          printf 'Build artifact profile mismatch: built=[%s] expected=[%s]\n' "$build_profile" "$expected_profile" >&2
          exit 1
        fi
        # Hosted jobs can receive different revisions of the same runner image.
        # ImageVersion is provenance, not a compiler or runtime ABI contract.
        # CTest must still fail on loader errors and incompatible dependencies.
        build_image="$(tar -xOf compiled/native-build.tar native-build-image.txt)"
        printf 'Build image: %s; consumer image: %s/%s\n' "$build_image" "$ImageOS" "$ImageVersion"
        tar -xf compiled/native-build.tar
        test -f "$EXPECTED_BUILD_DIRECTORY/CMakeCache.txt"
    - name: Restore Windows runtime selection
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        BUILD_DIR: ${{ inputs.build-dir }}
      run: |
        $ErrorActionPreference = "Stop"
        $cache = Get-Content (Join-Path $env:BUILD_DIR "CMakeCache.txt")
        $entry = @($cache | Where-Object { $_ -match '^VCPKG_TARGET_TRIPLET:[^=]+=' })
        if ($entry.Count -ne 1) { throw "Compiled artifact has no unique target triplet" }
        $triplet = ($entry[0] -split '=', 2)[1]
        $runtime = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed/$triplet/bin"
        if (-not (Test-Path -LiteralPath $runtime -PathType Container)) {
          throw "Compiled artifact runtime is missing"
        }
        "VCPKG_WINDOWS_TRIPLET=$triplet" >> $env:GITHUB_ENV
        $runtime >> $env:GITHUB_PATH
