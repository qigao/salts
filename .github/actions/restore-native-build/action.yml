name: Restore compiled native inputs
description: Restore one immutable native build for CTest and benchmark consumers.
inputs:
  artifact:
    description: Artifact produced by the native build matrix.
    required: true
  build-dir:
    description: Build directory recorded by the selected profile.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: compiled
    - name: Restore matching build and source timestamps
      shell: bash
      run: |
        set -euo pipefail
        if [ "$(tar -xOf compiled/native-build.tar native-build-commit.txt)" != "$(git rev-parse HEAD)" ]; then
          echo 'Build artifact commit does not match the consumer checkout' >&2
          exit 1
        fi
        if [ "$(tar -xOf compiled/native-build.tar native-build-workspace.txt)" != "$(pwd -P)" ]; then
          echo 'Build artifact requires the original workspace path' >&2
          exit 1
        fi
        if [ "$(tar -xOf compiled/native-build.tar native-build-image.txt)" != "$ImageOS/$ImageVersion" ]; then
          echo 'Build artifact requires the same runner image and compiler installation' >&2
          exit 1
        fi
        tar -xf compiled/native-build.tar
    - name: Restore Windows runtime selection
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        BUILD_DIR: ${{ inputs.build-dir }}
      run: |
        $ErrorActionPreference = "Stop"
        $cache = Get-Content (Join-Path $env:BUILD_DIR "CMakeCache.txt")
        $entry = @($cache | Where-Object { $_ -match '^VCPKG_TARGET_TRIPLET:[^=]+=' })
        if ($entry.Count -ne 1) { throw "Compiled artifact has no unique target triplet" }
        $triplet = ($entry[0] -split '=', 2)[1]
        $runtime = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed/$triplet/bin"
        if (-not (Test-Path -LiteralPath $runtime -PathType Container)) {
          throw "Compiled artifact runtime is missing"
        }
        "VCPKG_WINDOWS_TRIPLET=$triplet" >> $env:GITHUB_ENV
        $runtime >> $env:GITHUB_PATH
