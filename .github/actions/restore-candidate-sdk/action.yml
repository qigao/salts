name: Restore Salts candidate SDK
description: Select an unpublished SDK artifact from a successful Salts CI run
inputs:
  run-id:
    description: Salts CI workflow_dispatch run ID
    required: true
  commit:
    description: Full source commit of the candidate SDK
    required: true
  rid:
    description: SDK runtime identifier
    required: true
  token:
    description: Token with read access to Salts Actions artifacts
    required: true
runs:
  using: composite
  steps:
    - shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.token }}
        SALTS_CANDIDATE_RUN_ID: ${{ inputs.run-id }}
        SALTS_CANDIDATE_COMMIT: ${{ inputs.commit }}
        SALTS_CANDIDATE_RID: ${{ inputs.rid }}
        SALTS_CANDIDATE_ACTION_PATH: ${{ github.action_path }}
      run: '& "$env:SALTS_CANDIDATE_ACTION_PATH/restore.ps1"'
