name: Prepare Salts build host
description: Install platform build prerequisites and map the shared Windows triplet to the Salts preset environment.

runs:
  using: composite
  steps:
    - name: Prepare Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ninja-build pkg-config nasm libudev-dev autoconf-archive

    - name: Prepare Windows build dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        choco install nasm ninja -y --no-progress
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }
        Get-Command ninja -ErrorAction Stop | Out-Null
        # Preserve the local preset variable while consuming the upstream CI triplet.
        if ([string]::IsNullOrWhiteSpace($env:QIGAO_VCPKG_WINDOWS_TRIPLET)) {
          throw "shared vcpkg Windows target triplet is unavailable"
        }
        "VCPKG_WINDOWS_TRIPLET=$env:QIGAO_VCPKG_WINDOWS_TRIPLET" >> $env:GITHUB_ENV

    - name: Prepare macOS build dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        brew install ninja nasm autoconf automake autoconf-archive libtool
