name: Set up native compiler cache
description: Restore content-addressed C/C++ ccache results for one native profile.

inputs:
  profile:
    description: Native matrix profile; isolates target architecture, compiler and configuration.
    required: true

runs:
  using: composite
  steps:
    - name: Install ccache on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get install -y --no-install-recommends ccache

    - name: Install ccache on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        brew install ccache

    - name: Install ccache on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        choco install ccache -y --no-progress
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Configure ccache compiler launcher
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $compilerCache = (Get-Command ccache -ErrorAction Stop).Source
        & $compilerCache --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $cacheDir = Join-Path $env:RUNNER_TEMP 'salts-ccache'
        "CCACHE_DIR=$cacheDir" >> $env:GITHUB_ENV
        "CCACHE_MAXSIZE=512M" >> $env:GITHUB_ENV
        "CCACHE_COMPILERCHECK=content" >> $env:GITHUB_ENV
        "CCACHE_BASEDIR=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
        # Conservatively hash preprocessed input, including generated/new headers.
        "CCACHE_NODIRECT=true" >> $env:GITHUB_ENV
        "CMAKE_C_COMPILER_LAUNCHER=$compilerCache" >> $env:GITHUB_ENV
        "CMAKE_CXX_COMPILER_LAUNCHER=$compilerCache" >> $env:GITHUB_ENV

    - name: Restore ccache compiler objects
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/salts-ccache
        # ccache verifies the compiler, flags and preprocessed inputs itself.
        # Run-unique writer key with reusable compiler/profile-specific prefix.
        key: salts-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ env.VCPKG_CACHE_CONTRACT_VERSION }}-${{ env.VCPKG_CACHE_REVISION }}-${{ hashFiles('CMakeUserPresets.json', 'presets/*.json', 'CMakeOptions.cmake', 'cmake/Sanitizers.cmake', 'vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          salts-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ env.VCPKG_CACHE_CONTRACT_VERSION }}-${{ env.VCPKG_CACHE_REVISION }}-${{ hashFiles('CMakeUserPresets.json', 'presets/*.json', 'CMakeOptions.cmake', 'cmake/Sanitizers.cmake', 'vcpkg.json', 'vcpkg-configuration.json') }}-
