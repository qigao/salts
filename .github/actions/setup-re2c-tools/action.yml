name: Set up shared build dependencies
description: Prepare host build tools, restore the versioned re2c binary, and configure the canonical shared vcpkg cache.

inputs:
  version:
    description: Qigao.Re2c.Binary package version
    required: false
    default: "4.6.3"

outputs:
  contract_version:
    description: Shared vcpkg cache contract version.
    value: ${{ steps.vcpkg_cache.outputs.contract_version }}
  cache_revision:
    description: Exact shared vcpkg cache contract revision.
    value: ${{ steps.vcpkg_cache.outputs.cache_revision }}
  tool_revision:
    description: Canonical vcpkg executable identity.
    value: ${{ steps.vcpkg_cache.outputs.tool_revision }}
  scripts_revision:
    description: Canonical vcpkg scripts identity.
    value: ${{ steps.vcpkg_cache.outputs.scripts_revision }}

runs:
  using: composite
  steps:
    - name: Prepare Linux vcpkg host dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ninja-build pkg-config nasm libudev-dev

    - name: Prepare Windows vcpkg host dependencies
      if: runner.os == 'Windows'
      shell: pwsh
      run: choco install nasm ninja -y --no-progress

    - name: Prepare macOS vcpkg host dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        brew install ninja nasm autoconf automake autoconf-archive libtool

    - name: Restore centralized re2c binary
      uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master
      with:
        version: ${{ inputs.version }}

    - name: Configure shared vcpkg binary cache
      id: vcpkg_cache
      uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
      with:
        mode: read

    - name: Verify shared vcpkg cache identity
      shell: pwsh
      env:
        CONTRACT_VERSION: ${{ steps.vcpkg_cache.outputs.contract_version }}
        CACHE_REVISION: ${{ steps.vcpkg_cache.outputs.cache_revision }}
      run: |
        $ErrorActionPreference = "Stop"
        if ([string]::IsNullOrWhiteSpace($env:CONTRACT_VERSION)) {
          throw "shared vcpkg cache contract output is empty"
        }
        if ([string]::IsNullOrWhiteSpace($env:CACHE_REVISION)) {
          throw "shared vcpkg cache revision output is empty"
        }
        if ($env:CONTRACT_VERSION -ne $env:VCPKG_CACHE_CONTRACT_VERSION) {
          throw "shared vcpkg cache contract output/env mismatch"
        }
        if ($env:CACHE_REVISION -ne $env:VCPKG_CACHE_REVISION) {
          throw "shared vcpkg cache revision output/env mismatch"
        }
        if ([string]::IsNullOrWhiteSpace($env:VCPKG_ROOT)) {
          throw "canonical VCPKG_ROOT is unavailable"
        }
        "QIGAO_VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
