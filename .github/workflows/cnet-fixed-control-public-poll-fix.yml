name: CNet fixed-control public-poll fix

on:
  push:
    branches:
      - perf/cnet-fixed-control-attribution-270
    paths:
      - .github/workflows/cnet-fixed-control-public-poll-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/cnet-fixed-control-attribution-270
      - name: Apply public-poll accounting fix
        run: |
          python3 .github/scripts/cnet_fixed_control_public_poll_fix.py
          git diff --check
          git diff -- cnet/benchmarks/cnet_io_benchmark.c
      - name: Commit public-poll accounting fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnet/benchmarks/cnet_io_benchmark.c
          git commit -m 'fix(cnet): close budget on full public poll'
          git push origin HEAD:perf/cnet-fixed-control-attribution-270
