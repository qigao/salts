name: NativeIO and CNet release benchmarks

on:
  pull_request:
    paths:
      - "native-io/**"
      - "coroutine/**"
      - "cnet/**"
      - "vcpkg.json"
      - ".github/workflows/native-io-release-benchmarks.yml"
  push:
    branches: [master]
    paths:
      - "native-io/**"
      - "coroutine/**"
      - "cnet/**"
      - "vcpkg.json"
      - ".github/workflows/native-io-release-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-io-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: epoll / Ubuntu 24.04 GCC
            runner: ubuntu-24.04
            family: linux
            configure_preset: linux-release-user
            build_preset: linux-release-user
            build_dir: build/linux-gcc-release
          - host: IOCP / Windows 2022 MSVC
            runner: windows-2022
            family: windows
            configure_preset: win-release-user
            build_preset: win-release-user
            build_dir: build/Msvc-Release
          - host: kqueue / macOS 15 AppleClang
            runner: macos-15
            family: mac
            configure_preset: release-mac-ninja
            build_preset: build-default-mac
            build_dir: build/mac-clang-release

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select affected benchmark layers
        id: scope
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $runAdapted = $true
          } else {
            $base = "${{ github.event.pull_request.base.sha || github.event.before }}"
            if ([string]::IsNullOrWhiteSpace($base) -or
                $base -match '^0+$') {
              $runAdapted = $true
            } else {
              $changed = @(git diff --name-only $base $env:GITHUB_SHA)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $workflowChanged = @($changed | Where-Object {
                  $_ -eq '.github/workflows/native-io-release-benchmarks.yml'
                }).Count -gt 0
              $nativeChanged = @($changed | Where-Object {
                  $_ -like 'native-io/*'
                }).Count -gt 0
              $cnetChanged = @($changed | Where-Object {
                  $_ -like 'cnet/*'
                }).Count -gt 0
              $coroutineChanged = @($changed | Where-Object {
                  $_ -like 'coroutine/*'
                }).Count -gt 0
              $dependencyChanged = @($changed | Where-Object {
                  $_ -eq 'vcpkg.json'
                }).Count -gt 0
              $runAdapted = $nativeChanged -or $cnetChanged -or
                $coroutineChanged -or $dependencyChanged -or $workflowChanged
            }
          }
          "adapted=$($runAdapted.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Setup Linux dependencies
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ninja-build re2c
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            VCPKG_BIN="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$VCPKG_BIN")" >> "$GITHUB_ENV"
          fi

      - name: Setup Windows dependencies
        if: matrix.family == 'windows'
        shell: powershell
        run: choco install re2c -y --no-progress

      - name: Setup Windows build environment
        if: matrix.family == 'windows'
        id: windows-env
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:VCPKG_INSTALLATION_ROOT)) {
            throw "VCPKG_INSTALLATION_ROOT is unavailable"
          }
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $vcpkgToolchain = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"
          if (-not (Test-Path -LiteralPath $vcpkgToolchain -PathType Leaf)) {
            throw "vcpkg toolchain is unavailable: $vcpkgToolchain"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere is unavailable: $vswhere"
          }
          $vsInstall = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0) {
            throw "vswhere failed with exit code $LASTEXITCODE"
          }
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio with the x64 C++ toolchain was not found"
          }
          $vsDevCmd = Join-Path $vsInstall "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) {
            throw "VsDevCmd.bat is unavailable: $vsDevCmd"
          }
          if ([string]::IsNullOrWhiteSpace($env:ImageOS) -or
              [string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            throw "GitHub runner image identity is unavailable"
          }

          $binaryCache = Join-Path $env:GITHUB_WORKSPACE "build\vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          "PROJECT_ROOT=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
          "VCPKG_BINARY_CACHE=$binaryCache" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$binaryCache,readwrite" >> $env:GITHUB_ENV
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore Windows vcpkg binary cache
        if: matrix.family == 'windows'
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-${{ steps.windows-env.outputs.image }}-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-${{ steps.windows-env.outputs.image }}-x64-windows-
            vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup macOS dependencies
        if: matrix.family == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          brew install re2c
          if [ -n "${VCPKG_ROOT:-}" ] &&
             [ -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            true
          elif [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] &&
               [ -f "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          elif [ -f "$(brew --prefix)/share/vcpkg/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "VCPKG_ROOT=$(brew --prefix)/share/vcpkg" >> "$GITHUB_ENV"
          else
            echo "A valid VCPKG_ROOT is unavailable" >&2
            exit 1
          fi

      - name: Configure and build Linux Release
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset "${{ matrix.configure_preset }}" \
            -DBUILD_BENCHMARKS=ON -DBUILD_TESTS=ON
          cmake --build --preset "${{ matrix.build_preset }}" \
            --target native_io_test native_io_header_cpp_test cnet_io_benchmark \
              cnet_session_test cnet_command_test cnet_uri_test \
              cnet_transport_test cnet_owner_test cnet_event_test \
              cnet_resolver_test cnet_shards_test cnet_dispatcher_test \
              cnet_api_test cnet_header_cpp_test cnet_tls_test cnet_benchmark_stats_test \
              concurrency_deadline_queue_test

      - name: Configure Windows Release
        if: matrix.family == 'windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --preset "${{ matrix.configure_preset }}" -DBUILD_BENCHMARKS=ON -DBUILD_TESTS=ON

      - name: Build Windows Release
        if: matrix.family == 'windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --build --preset "${{ matrix.build_preset }}" --target native_io_test native_io_header_cpp_test cnet_io_benchmark cnet_session_test cnet_command_test cnet_uri_test cnet_transport_test cnet_owner_test cnet_event_test cnet_resolver_test cnet_shards_test cnet_dispatcher_test cnet_api_test cnet_header_cpp_test cnet_tls_test cnet_benchmark_stats_test concurrency_deadline_queue_test

      - name: Configure and build macOS Release
        if: matrix.family == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset "${{ matrix.configure_preset }}" \
            -DBUILD_BENCHMARKS=ON -DBUILD_TESTS=ON
          cmake --build --preset "${{ matrix.build_preset }}" \
            --target native_io_test native_io_header_cpp_test cnet_io_benchmark \
              cnet_session_test cnet_command_test cnet_uri_test \
              cnet_transport_test cnet_owner_test cnet_event_test \
              cnet_resolver_test cnet_shards_test cnet_dispatcher_test \
              cnet_api_test cnet_header_cpp_test cnet_tls_test cnet_benchmark_stats_test \
              concurrency_deadline_queue_test

      - name: Run NativeIO contract tests
        shell: pwsh
        run: |
          ctest --test-dir "${{ matrix.build_dir }}" -R '^native_io_(test|header_cpp_test)$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run CNet contract tests
        shell: pwsh
        run: |
          ctest --test-dir "${{ matrix.build_dir }}" -R '^(cnet_.*_test|concurrency_deadline_queue_test)$' --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run libuv versus NativeIO direct/coroutine versus CNet benchmark
        if: steps.scope.outputs.adapted == 'true'
        shell: pwsh
        env:
          IO_BENCHMARK_EXECUTABLE: ${{ matrix.build_dir }}/bin/cnet_io_benchmark
          BENCHMARK_HOST: ${{ matrix.host }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:IO_BENCHMARK_EXECUTABLE
          if ($env:RUNNER_OS -eq "Windows") { $benchmark += ".exe" }
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "I/O benchmark executable not found: $benchmark"
          }
          $output = & $benchmark 2>&1 | Tee-Object -FilePath (Join-Path $resultDir "libuv-native-io-cnet-benchmark.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @(
            "host=$env:BENCHMARK_HOST"
            "commit=$env:GITHUB_SHA"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
          ) | Set-Content -LiteralPath (Join-Path $resultDir "metadata.txt")
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## libuv versus NativeIO direct/coroutine versus CNet: $env:BENCHMARK_HOST"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          $output | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload I/O benchmark evidence
        if: always() && steps.scope.outputs.adapted == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: io-benchmark-${{ matrix.family }}
          path: native-io-results
          if-no-files-found: error
          retention-days: 30
