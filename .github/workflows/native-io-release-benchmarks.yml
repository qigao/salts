name: NativeIO and CNet release benchmarks

on:
  pull_request:
    paths:
      - "native-io/**"
      - "cnet/**"
  push:
    branches: [master]
    paths:
      - "native-io/**"
      - "cnet/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: native-io-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: epoll / Ubuntu 24.04 GCC
            runner: ubuntu-24.04
            family: linux
            backend: epoll
            artifact: linux-epoll
            configure_preset: linux-release-user
            build_preset: linux-release-user
            build_dir: build/linux-gcc-release
          - host: io_uring / Ubuntu 24.04 GCC
            runner: ubuntu-24.04
            family: linux
            backend: io_uring
            artifact: linux-io-uring
            configure_preset: linux-release-user
            build_preset: linux-release-user
            build_dir: build/linux-gcc-release
          - host: IOCP / Windows 2022 MSVC
            runner: windows-2022
            family: windows
            backend: iocp
            artifact: windows-iocp
            configure_preset: win-release-user
            build_preset: win-release-user
            build_dir: build/Msvc-Release
          - host: kqueue / macOS 15 AppleClang
            runner: macos-15
            family: mac
            backend: kqueue
            artifact: macos-kqueue
            configure_preset: release-mac-ninja
            build_preset: build-default-mac
            build_dir: build/mac-clang-release

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up shared build dependencies (host tools, re2c, vcpkg cache)
        id: shared_deps
        uses: ./.github/actions/setup-re2c-tools

      - name: Select affected benchmark layers
        id: scope
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $runAdapted = $true
          } else {
            $base = "${{ github.event.pull_request.base.sha || github.event.before }}"
            if ([string]::IsNullOrWhiteSpace($base) -or
                $base -match '^0+$') {
              $runAdapted = $true
            } else {
              $head = (git rev-parse HEAD).Trim()
              $changed = @(git diff --name-only $base $head)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $workflowChanged = @($changed | Where-Object {
                  $_ -eq '.github/workflows/native-io-release-benchmarks.yml' -or
                  $_ -like '.github/actions/setup-re2c-tools/*'
                }).Count -gt 0
              $nativeChanged = @($changed | Where-Object {
                  $_ -like 'native-io/*'
                }).Count -gt 0
              $cnetChanged = @($changed | Where-Object {
                  $_ -like 'cnet/*'
                }).Count -gt 0
              $coroutineChanged = @($changed | Where-Object {
                  $_ -like 'coroutine/*'
                }).Count -gt 0
              $concurrencyChanged = @($changed | Where-Object {
                  $_ -like 'concurrency/*'
                }).Count -gt 0
              $platformChanged = @($changed | Where-Object {
                  $_ -like 'platform/*'
                }).Count -gt 0
              $buildChanged = @($changed | Where-Object {
                  $_ -like 'cmake/*' -or $_ -eq 'CMakeLists.txt' -or
                  $_ -eq 'CMakePresets.json'
                }).Count -gt 0
              $dependencyChanged = @($changed | Where-Object {
                  $_ -eq 'vcpkg.json' -or $_ -eq 'vcpkg-configuration.json'
                }).Count -gt 0
              $runAdapted = $nativeChanged -or $cnetChanged -or
                $coroutineChanged -or $concurrencyChanged -or $platformChanged -or
                $buildChanged -or $dependencyChanged -or $workflowChanged
            }
          }
          "adapted=$($runAdapted.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Setup Linux dependencies
        if: matrix.family == 'linux'
        id: linux-env
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes nasm ninja-build strace
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          test -n "${VCPKG_ROOT:-}"
          test -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          binary_cache="$GITHUB_WORKSPACE/build/vcpkg-binary-cache"
          mkdir -p "$binary_cache"
          echo "VCPKG_BINARY_CACHE=$binary_cache" >> "$GITHUB_ENV"
          echo "image=${ImageOS:-linux}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "triplet=x64-linux" >> "$GITHUB_OUTPUT"

      - name: Restore Linux vcpkg binary cache
        if: matrix.family == 'linux'
        id: linux-vcpkg-cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.linux-env.outputs.image }}-${{ steps.linux-env.outputs.triplet }}-${{ steps.shared_deps.outputs.contract_version }}-${{ steps.shared_deps.outputs.cache_revision }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.linux-env.outputs.image }}-${{ steps.linux-env.outputs.triplet }}-${{ steps.shared_deps.outputs.contract_version }}-${{ steps.shared_deps.outputs.cache_revision }}-

      - name: Report Linux vcpkg cache state
        if: matrix.family == 'linux'
        shell: bash
        run: echo "vcpkg cache hit=${{ steps.linux-vcpkg-cache.outputs.cache-hit }} contract=${{ steps.shared_deps.outputs.contract_version }} revision=${{ steps.shared_deps.outputs.cache_revision }}"

      - name: Setup Windows build environment
        if: matrix.family == 'windows'
        id: windows-env
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgRoot = $env:VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            throw "VCPKG_ROOT is unavailable"
          }
          $vcpkgToolchain = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"
          if (-not (Test-Path -LiteralPath $vcpkgToolchain -PathType Leaf)) {
            throw "vcpkg toolchain is unavailable: $vcpkgToolchain"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere is unavailable: $vswhere"
          }
          $vsInstall = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0) {
            throw "vswhere failed with exit code $LASTEXITCODE"
          }
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio with the x64 C++ toolchain was not found"
          }
          $vsDevCmd = Join-Path $vsInstall "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) {
            throw "VsDevCmd.bat is unavailable: $vsDevCmd"
          }
          if ([string]::IsNullOrWhiteSpace($env:ImageOS) -or
              [string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            throw "GitHub runner image identity is unavailable"
          }

          $binaryCache = Join-Path $env:GITHUB_WORKSPACE "build\vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          "PROJECT_ROOT=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
          "VCPKG_BINARY_CACHE=$binaryCache" >> $env:GITHUB_ENV
          (Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\x64-windows\bin") >> $env:GITHUB_PATH
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "triplet=x64-windows" >> $env:GITHUB_OUTPUT

      - name: Restore Windows vcpkg binary cache
        if: matrix.family == 'windows'
        id: windows-vcpkg-cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.windows-env.outputs.image }}-${{ steps.windows-env.outputs.triplet }}-${{ steps.shared_deps.outputs.contract_version }}-${{ steps.shared_deps.outputs.cache_revision }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.windows-env.outputs.image }}-${{ steps.windows-env.outputs.triplet }}-${{ steps.shared_deps.outputs.contract_version }}-${{ steps.shared_deps.outputs.cache_revision }}-

      - name: Report Windows vcpkg cache state
        if: matrix.family == 'windows'
        shell: pwsh
        run: Write-Host "vcpkg cache hit=${{ steps.windows-vcpkg-cache.outputs.cache-hit }} contract=${{ steps.shared_deps.outputs.contract_version }} revision=${{ steps.shared_deps.outputs.cache_revision }}"

      - name: Setup macOS dependencies
        if: matrix.family == 'mac'
        id: macos-env
        shell: bash
        run: |
          set -euo pipefail
          brew install nasm
          test -n "${VCPKG_ROOT:-}"
          test -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          binary_cache="$GITHUB_WORKSPACE/build/vcpkg-binary-cache"
          mkdir -p "$binary_cache"
          echo "VCPKG_BINARY_CACHE=$binary_cache" >> "$GITHUB_ENV"
          echo "image=${ImageOS:-macos}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "triplet=default-osx-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore macOS vcpkg binary cache
        if: matrix.family == 'mac'
        id: macos-vcpkg-cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.macos-env.outputs.image }}-${{ steps.macos-env.outputs.triplet }}-${{ steps.shared_deps.outputs.contract_version }}-${{ steps.shared_deps.outputs.cache_revision }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.macos-env.outputs.image }}-${{ steps.macos-env.outputs.triplet }}-${{ steps.shared_deps.outputs.contract_version }}-${{ steps.shared_deps.outputs.cache_revision }}-

      - name: Report macOS vcpkg cache state
        if: matrix.family == 'mac'
        shell: bash
        run: echo "vcpkg cache hit=${{ steps.macos-vcpkg-cache.outputs.cache-hit }} contract=${{ steps.shared_deps.outputs.contract_version }} revision=${{ steps.shared_deps.outputs.cache_revision }}"

      - name: Configure and build Linux Release
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset "${{ matrix.configure_preset }}" \
            -DBUILD_BENCHMARKS=ON -DBUILD_TESTS=ON
          cmake --build --preset "${{ matrix.build_preset }}" \
            --target native_io_test native_io_sharded_test native_io_header_cpp_test \
              native_ipc_test native_ipc_header_cpp_test cnet_io_benchmark \
              cnet_websocket_parser_test cnet_websocket_test \
              cnet_session_test cnet_command_test cnet_uri_test \
              cnet_transport_test cnet_owner_test cnet_owner_profile_test \
              cnet_event_test \
              cnet_resolver_test cnet_shards_test cnet_dispatcher_test \
              cnet_api_test cnet_api_profile_test cnet_header_cpp_test cnet_tls_test \
              cnet_datagram_test cnet_kcp_test cnet_secure_kcp_test \
              cnet_packet_endpoint_test cnet_stop_contract_test \
              cnet_vsock_integration_test \
              cnet_benchmark_stats_test cnet_io_benchmark_config_test \
              concurrency_deadline_queue_test native_io_queue_depth_benchmark \
              native_io_idle_observe_benchmark native_io_sharded_routing_benchmark native_io_pipe_styles_benchmark \
              native_io_stream_styles_benchmark cnet_scaling_benchmark

      - name: Configure Windows Release
        if: matrix.family == 'windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          cmake --preset "${{ matrix.configure_preset }}" -DBUILD_BENCHMARKS=ON -DBUILD_TESTS=ON

      - name: Build Windows Release
        if: matrix.family == 'windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          cmake --build --preset "${{ matrix.build_preset }}" --target native_io_test native_io_sharded_test native_io_header_cpp_test native_ipc_test native_ipc_header_cpp_test cnet_io_benchmark cnet_websocket_parser_test cnet_websocket_test cnet_session_test cnet_command_test cnet_uri_test cnet_transport_test cnet_owner_test cnet_owner_profile_test cnet_event_test cnet_resolver_test cnet_shards_test cnet_dispatcher_test cnet_api_test cnet_api_profile_test cnet_header_cpp_test cnet_tls_test cnet_datagram_test cnet_kcp_test cnet_secure_kcp_test cnet_packet_endpoint_test cnet_stop_contract_test cnet_benchmark_stats_test cnet_io_benchmark_config_test concurrency_deadline_queue_test native_io_sharded_routing_benchmark native_io_pipe_styles_benchmark native_io_stream_styles_benchmark

      - name: Configure and build macOS Release
        if: matrix.family == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset "${{ matrix.configure_preset }}" \
            -DBUILD_BENCHMARKS=ON -DBUILD_TESTS=ON
          cmake --build --preset "${{ matrix.build_preset }}" \
            --target native_io_test native_io_sharded_test native_io_header_cpp_test \
              native_ipc_test native_ipc_header_cpp_test cnet_io_benchmark \
              cnet_websocket_parser_test cnet_websocket_test \
              cnet_session_test cnet_command_test cnet_uri_test \
              cnet_transport_test cnet_owner_test cnet_owner_profile_test \
              cnet_event_test \
              cnet_resolver_test cnet_shards_test cnet_dispatcher_test \
              cnet_api_test cnet_api_profile_test cnet_header_cpp_test cnet_tls_test \
              cnet_datagram_test cnet_kcp_test cnet_secure_kcp_test \
              cnet_packet_endpoint_test cnet_stop_contract_test \
              cnet_benchmark_stats_test \
              cnet_io_benchmark_config_test \
              concurrency_deadline_queue_test native_io_sharded_routing_benchmark native_io_pipe_styles_benchmark native_io_stream_styles_benchmark

      - name: Run NativeIO and NativeIPC contract tests
        shell: pwsh
        run: |
          ctest --test-dir "${{ matrix.build_dir }}" -R '^(native_(io|ipc)_(test|header_cpp_test)|native_io_sharded_test|native_io_uring_batch_test|native_io_architecture_contract_test)$' --timeout 30 --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run CNet contract tests
        shell: pwsh
        run: |
          ctest --test-dir "${{ matrix.build_dir }}" -R '^(cnet_.*_test|concurrency_deadline_queue_test)$' --timeout 60 --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./cnet/tests/cnet_io_trace_test.ps1

      - name: Build PR-base CNet comparison DSO
        if: matrix.family == 'windows' && steps.scope.outputs.adapted == 'true' && github.event_name == 'pull_request'
        shell: cmd
        env:
          CNET_COMPARE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set "BASELINE_SOURCE=%RUNNER_TEMP%\salts-cnet-baseline"
          if exist "%BASELINE_SOURCE%" rmdir /s /q "%BASELINE_SOURCE%"
          git worktree add --detach "%BASELINE_SOURCE%" "%CNET_COMPARE_BASE_SHA%"
          if errorlevel 1 exit /b 1
          cd /d "%BASELINE_SOURCE%"
          set "PROJECT_ROOT=%BASELINE_SOURCE%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          cmake --preset win-release-user -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF
          if errorlevel 1 exit /b 1
          cmake --build --preset win-release-user --target cnet
          if errorlevel 1 exit /b 1
          if not exist "build\Msvc-Release\bin\cnet.dll" exit /b 1
          echo CNET_COMPARE_BASELINE_DSO=%BASELINE_SOURCE%\build\Msvc-Release\bin\cnet.dll>>"%GITHUB_ENV%"
          echo CNET_COMPARE_CANDIDATE_DSO=%GITHUB_WORKSPACE%\${{ matrix.build_dir }}\bin\cnet.dll>>"%GITHUB_ENV%"
          echo CNET_COMPARE_EXECUTABLE=%GITHUB_WORKSPACE%\${{ matrix.build_dir }}\bin\cnet_owner_lifecycle_compare.exe>>"%GITHUB_ENV%"

      - name: Compare PR-base and candidate CNet owner
        if: matrix.family == 'windows' && steps.scope.outputs.adapted == 'true' && github.event_name == 'pull_request'
        shell: pwsh
        env:
          CNET_IO_BENCHMARK_BACKEND: iocp
          CNET_COMPARE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CNET_COMPARE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          foreach ($path in @($env:CNET_COMPARE_BASELINE_DSO,
                              $env:CNET_COMPARE_CANDIDATE_DSO,
                              $env:CNET_COMPARE_EXECUTABLE)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "CNet owner comparison input not found: $path"
            }
          }
          $report = Join-Path $resultDir "cnet-owner-base-vs-direct.md"
          & $env:CNET_COMPARE_EXECUTABLE `
            $env:CNET_COMPARE_BASELINE_DSO `
            $env:CNET_COMPARE_CANDIDATE_DSO `
            $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @(
            "base_sha=$env:CNET_COMPARE_BASE_SHA"
            "candidate_sha=$env:CNET_COMPARE_HEAD_SHA"
            "baseline_dso=$env:CNET_COMPARE_BASELINE_DSO"
            "candidate_dso=$env:CNET_COMPARE_CANDIDATE_DSO"
          ) | Set-Content -LiteralPath (Join-Path $resultDir "cnet-owner-compare-metadata.txt")
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## CNet owner PR-base versus candidate: IOCP"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Get-Content -LiteralPath $report | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Run NativeIO Sharded same-owner versus cross-owner routing benchmark
        if: steps.scope.outputs.adapted == 'true'
        shell: pwsh
        env:
          NATIVE_IO_SHARDED_BENCH_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_sharded_routing_benchmark
          NATIVE_IO_SHARDED_BENCH_BACKEND: ${{ matrix.backend }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:NATIVE_IO_SHARDED_BENCH_EXECUTABLE
          if ($env:RUNNER_OS -eq "Windows") { $benchmark += ".exe" }
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "NativeIO Sharded routing benchmark executable not found: $benchmark"
          }
          $env:NATIVE_IO_SHARDED_BENCH_OUTPUT = Join-Path $resultDir "native-io-sharded-routing"
          $output = & $benchmark 2>&1 |
            Tee-Object -FilePath (Join-Path $resultDir "native-io-sharded-routing.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./native-io/benchmarks/verify_sharded_routing_benchmark.ps1 `
            -Path "$env:NATIVE_IO_SHARDED_BENCH_OUTPUT.csv" `
            -Backend $env:NATIVE_IO_SHARDED_BENCH_BACKEND
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## NativeIO Sharded routing: $env:NATIVE_IO_SHARDED_BENCH_BACKEND"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          $output | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Run NativeIO PIPE execution-style benchmark
        if: steps.scope.outputs.adapted == 'true'
        shell: pwsh
        env:
          NATIVE_IO_PIPE_STYLE_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_pipe_styles_benchmark
          NATIVE_IO_PIPE_STYLE_BACKEND: ${{ matrix.backend }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:NATIVE_IO_PIPE_STYLE_EXECUTABLE
          if ($env:RUNNER_OS -eq "Windows") { $benchmark += ".exe" }
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "NativeIO PIPE style benchmark executable not found: $benchmark"
          }
          $env:NATIVE_IO_PIPE_STYLE_OUTPUT = Join-Path $resultDir "native-io-pipe-styles"
          $output = & $benchmark 2>&1 |
            Tee-Object -FilePath (Join-Path $resultDir "native-io-pipe-styles.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./native-io/benchmarks/verify_pipe_styles_benchmark.ps1 `
            -Path "$env:NATIVE_IO_PIPE_STYLE_OUTPUT.csv" `
            -Backend $env:NATIVE_IO_PIPE_STYLE_BACKEND
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## NativeIO PIPE execution styles: $env:NATIVE_IO_PIPE_STYLE_BACKEND"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          $output | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Run NativeIO TCP STREAM execution-style benchmark
        if: steps.scope.outputs.adapted == 'true'
        shell: pwsh
        env:
          NATIVE_IO_STREAM_STYLE_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_stream_styles_benchmark
          NATIVE_IO_STREAM_STYLE_BACKEND: ${{ matrix.backend }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:NATIVE_IO_STREAM_STYLE_EXECUTABLE
          if ($env:RUNNER_OS -eq "Windows") { $benchmark += ".exe" }
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "NativeIO TCP STREAM style benchmark executable not found: $benchmark"
          }
          $env:NATIVE_IO_STREAM_STYLE_OUTPUT = Join-Path $resultDir "native-io-stream-styles"
          $output = & $benchmark 2>&1 |
            Tee-Object -FilePath (Join-Path $resultDir "native-io-stream-styles.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./native-io/benchmarks/verify_stream_styles_benchmark.ps1 `
            -Path "$env:NATIVE_IO_STREAM_STYLE_OUTPUT.csv" `
            -Backend $env:NATIVE_IO_STREAM_STYLE_BACKEND
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## NativeIO TCP STREAM execution styles: $env:NATIVE_IO_STREAM_STYLE_BACKEND"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          $output | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Run libuv versus NativeIO direct/coroutine versus CNet retained benchmark
        if: steps.scope.outputs.adapted == 'true'
        shell: pwsh
        env:
          IO_BENCHMARK_EXECUTABLE: ${{ matrix.build_dir }}/bin/cnet_io_benchmark
          CNET_IO_BENCHMARK_BACKEND: ${{ matrix.backend }}
          BENCHMARK_HOST: ${{ matrix.host }}
          BENCHMARK_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:IO_BENCHMARK_EXECUTABLE
          if ($env:RUNNER_OS -eq "Windows") { $benchmark += ".exe" }
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "I/O benchmark executable not found: $benchmark"
          }
          $env:CNET_IO_BENCHMARK_OUTPUT = Join-Path $resultDir "io"
          $output = & $benchmark 2>&1 | Tee-Object -FilePath (Join-Path $resultDir "libuv-native-io-cnet-benchmark.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./cnet/benchmarks/verify_io_benchmark.ps1 -Prefix $env:CNET_IO_BENCHMARK_OUTPUT
          @(
            "report_schema=2"
            "host=$env:BENCHMARK_HOST"
            "commit=$env:BENCHMARK_COMMIT"
            "workflow_sha=$env:GITHUB_SHA"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "native_io_backend=$env:CNET_IO_BENCHMARK_BACKEND"
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
          ) | Set-Content -LiteralPath (Join-Path $resultDir "metadata.txt")
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## libuv versus NativeIO direct/coroutine versus CNet retained: $env:BENCHMARK_HOST"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          $output | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Run NativeIO direct versus CNet retained scaling benchmark
        if: matrix.family == 'linux' && steps.scope.outputs.adapted == 'true'
        shell: pwsh
        env:
          CNET_SCALING_EXECUTABLE: ${{ matrix.build_dir }}/bin/cnet_scaling_benchmark
          CNET_IO_BENCHMARK_BACKEND: ${{ matrix.backend }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:CNET_SCALING_EXECUTABLE
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "CNet scaling benchmark executable not found: $benchmark"
          }
          $env:CNET_SCALING_BENCHMARK_OUTPUT = Join-Path $resultDir "cnet-scaling"
          $output = & $benchmark 2>&1 | Tee-Object -FilePath (Join-Path $resultDir "nativeio-cnet-scaling.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./cnet/benchmarks/verify_scaling_benchmark.ps1 -Path "$env:CNET_SCALING_BENCHMARK_OUTPUT.csv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## NativeIO direct versus CNet retained scaling: $env:CNET_IO_BENCHMARK_BACKEND"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          $output | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Run NativeIO io_uring idle observe benchmark
        if: matrix.family == 'linux' && matrix.backend == 'io_uring' && steps.scope.outputs.adapted == 'true'
        shell: pwsh
        env:
          NATIVE_IO_IDLE_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_idle_observe_benchmark
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:NATIVE_IO_IDLE_EXECUTABLE
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "idle observe benchmark executable not found: $benchmark"
          }
          $env:NATIVE_IO_IDLE_OBSERVE_OUTPUT = Join-Path $resultDir "native-io-idle-observe"
          $output = & $benchmark 2>&1 | Tee-Object -FilePath (Join-Path $resultDir "native-io-idle-observe.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./native-io/benchmarks/verify_idle_observe_benchmark.ps1 -Path "$env:NATIVE_IO_IDLE_OBSERVE_OUTPUT.csv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## NativeIO io_uring idle observe(0)"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          $output | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Run NativeIO io_uring queue-depth benchmark
        if: matrix.family == 'linux' && matrix.backend == 'io_uring' && steps.scope.outputs.adapted == 'true'
        shell: pwsh
        env:
          NATIVE_IO_QD_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_queue_depth_benchmark
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:NATIVE_IO_QD_EXECUTABLE
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "queue-depth benchmark executable not found: $benchmark"
          }
          $env:NATIVE_IO_QD_BENCHMARK_OUTPUT = Join-Path $resultDir "native-io-queue-depth"
          $output = & $benchmark 2>&1 | Tee-Object -FilePath (Join-Path $resultDir "native-io-queue-depth.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./native-io/benchmarks/verify_queue_depth_benchmark.ps1 -Path "$env:NATIVE_IO_QD_BENCHMARK_OUTPUT.csv"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## NativeIO io_uring queue-depth benchmark"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          $output | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Trace NativeIO io_uring queue-depth control path
        if: matrix.family == 'linux' && matrix.backend == 'io_uring' && steps.scope.outputs.adapted == 'true'
        shell: bash
        env:
          NATIVE_IO_QD_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_queue_depth_benchmark
        run: |
          set -euo pipefail
          trace_dir="native-io-results/queue-depth-syscalls"
          mkdir -p "$trace_dir"
          benchmark="$GITHUB_WORKSPACE/$NATIVE_IO_QD_EXECUTABLE"
          for qd in 1 8 32 64; do
            export NATIVE_IO_QD_TRACE="$qd:32768"
            label="qd-$qd-payload-32768"
            strace -ff -ttt -T -s 128 \
              -e trace=io_uring_enter,poll,ppoll,write \
              -o "$trace_dir/$label.trace" \
              "$benchmark" \
              > "$trace_dir/$label.log" 2>&1
          done
          unset NATIVE_IO_QD_TRACE

      - name: Summarize NativeIO queue-depth syscall evidence
        if: matrix.family == 'linux' && matrix.backend == 'io_uring' && steps.scope.outputs.adapted == 'true'
        shell: pwsh
        run: |
          ./native-io/benchmarks/summarize_queue_depth_trace.ps1 -Directory native-io-results/queue-depth-syscalls |
            Tee-Object -FilePath native-io-results/queue-depth-syscalls/summary.txt |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Collect isolated Linux syscall evidence
        if: matrix.family == 'linux' && steps.scope.outputs.adapted == 'true'
        shell: bash
        env:
          CNET_IO_BENCHMARK_BACKEND: ${{ matrix.backend }}
          IO_BENCHMARK_EXECUTABLE: ${{ matrix.build_dir }}/bin/cnet_io_benchmark
        run: |
          set -euo pipefail
          # Traced timings are never scores. Each file is one thread; stderr
          # markers delimit the 512 measured RTTs after setup and warmup.
          mkdir -p native-io-results/syscalls
          strace --version > native-io-results/syscalls/tool-version.txt
          for workload in tcp:1024 tcp:32768 tcp:65536 udp:8192; do
            for driver in libuv native coroutine cnet; do
              export CNET_IO_BENCHMARK_TRACE="$driver:$workload"
              label="${CNET_IO_BENCHMARK_TRACE//:/-}"
              strace -ff -ttt -T -s 128 \
                -e trace=%network,read,readv,write,writev,poll,ppoll,epoll_ctl,epoll_wait,epoll_pwait,epoll_pwait2,io_uring_setup,io_uring_register,io_uring_enter,futex \
                -o "native-io-results/syscalls/$label.trace" \
                "$IO_BENCHMARK_EXECUTABLE" --no-color \
                > "native-io-results/syscalls/$label.log" 2>&1
            done
          done
          printf '%s\n' \
            'Traces are independent reruns, not explanations of individual untraced outliers.' \
            'Only count the client thread between IO_BENCH_MEASURE_BEGIN/END markers.' \
            'Other thread files contain the echo peer; syscall elapsed includes scheduling.' \
            'io_uring_enter counts are NOT SQE counts. API call counts are NOT syscall counts.' \
            'poll/ppoll include io_uring ring/wake-fd waits; they are separate from epoll waits and io_uring_enter.' \
            'libuv can submit epoll control via io_uring; zero direct epoll_ctl calls do not mean zero registration work.' \
            'CPU stacks and runnable/blocked split are not collected by strace; use perf on a profiling host.' \
            > native-io-results/syscalls/README.txt

      - name: Summarize measured client syscall counts
        if: matrix.family == 'linux' && steps.scope.outputs.adapted == 'true'
        shell: pwsh
        run: |
          ./cnet/benchmarks/summarize_io_trace.ps1 -Directory native-io-results/syscalls |
            Tee-Object -FilePath native-io-results/syscalls/summary.txt |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload I/O benchmark evidence
        if: always() && steps.scope.outputs.adapted == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: io-benchmark-${{ matrix.artifact }}
          path: native-io-results
          if-no-files-found: error
          retention-days: 30
