name: Recover CBind canonical variant cleanup

on:
  push:
    branches:
      - refactor/cmeta-enum-domains
    paths:
      - .github/workflows/recover-cbind-variant-cmeta-cleanup.yml
      - tools/recover_cbind_variant_cmeta_cleanup.py

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cmeta-enum-domains
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact canonical cleanup migration
        run: python3 tools/recover_cbind_variant_cmeta_cleanup.py
      - name: Verify source migration
        run: |
          git diff --check
          grep -q 'cmeta_data_buffer_restore_zero(&cbind_variant_text_data' cbind/tests/cbind_variant_decode_test.c
          ! grep -q 'salts_tstr_cmeta_restore_zero' cbind/tests/cbind_variant_decode_test.c
      - name: Publish source and remove recovery scaffolding
        run: |
          git config user.name "qigao"
          git config user.email "qi.gao2012@gmail.com"
          git add cbind/tests/cbind_variant_decode_test.c
          git rm .github/workflows/recover-cbind-variant-cmeta-cleanup.yml \
                 tools/recover_cbind_variant_cmeta_cleanup.py
          git diff --cached --check
          git commit -m "test(cbind): use canonical CMeta buffer cleanup"
          git push origin HEAD:refactor/cmeta-enum-domains
