name: TurboSTL instance overlay

on:
  push:
    branches:
      - refactor/turbostl-natural-api

permissions:
  contents: write

jobs:
  overlay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/turbostl-natural-api
          fetch-depth: 0
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Import self-describing instance contract
        run: bash scripts/turbostl_instance_overlay.sh
      - name: Commit overlay
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A turbostl cmeta utils turbo_serial
          git commit -m "refactor(turbostl): canonicalize instance descriptors"
          git push origin HEAD:refactor/turbostl-natural-api
