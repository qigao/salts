name: CHTTP task2 GREEN

on:
  push:
    branches:
      - agent/chttp-h2-deferred-task2

permissions:
  contents: write

jobs:
  h2-deferred-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Apply Task 2 after observed behavioral RED
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/chttp_task2_apply.py
          python3 .github/scripts/chttp_task2_apply.py
          git diff --check
          git diff -- ch \( ':!chttp/src/chttp_h2_proto.c' \) >/dev/null
          test -z "$(git status --short -- chttp/src/chttp_h2_proto.c)"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/salts-vcpkg-binary-cache
          key: salts-vcpkg-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**') }}
          save-always: true

      - name: Setup dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes nasm ninja-build re2c
          mkdir -p "$RUNNER_TEMP/salts-vcpkg-binary-cache"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/salts-vcpkg-binary-cache" >> "$GITHUB_ENV"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            VCPKG_BIN="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$VCPKG_BIN")" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: cmake --preset release-linux-ninja

      - name: Build Task 2 regression
        run: >-
          cmake --build --preset build-default-linux --target
          chttp_h2_deferred_test chttp_h2_server_test chttp_server_test

      - name: Run Task 2 regression
        run: >-
          ctest --preset test-release-linux -R
          '^(chttp_h2_deferred_test|chttp_h2_server_test|chttp_server_test)$'
          --output-on-failure

      - name: Commit verified Task 2 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/chttp_task2_apply.py
          rm -f .github/workflows/chttp-task2-red.yml
          rm -f .github/workflows/chttp-task2-green.yml
          git config user.name "Qi Gao"
          git config user.email "qi.gao2012@gmail.com"
          git add -A .github/scripts/chttp_task2_apply.py \
                     .github/workflows/chttp-task2-red.yml \
                     .github/workflows/chttp-task2-green.yml \
                     chttp/tests/chttp_h2_deferred_test.c \
                     chttp/tests/CMakeLists.txt \
                     chttp/src/chttp_h2_server.h \
                     chttp/src/chttp_h2_server.c \
                     chttp/src/chttp_server.c
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep '^chttp/src/chttp_h2_proto.c$' || true)"
          git commit -m "feat(chttp): defer HTTP2 server responses"
          git push origin HEAD:agent/chttp-h2-deferred-task2
