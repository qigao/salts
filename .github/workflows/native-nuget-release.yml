name: Salts native NuGet release

on:
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "packaging/nuget/**"
      - "tinymock/**"
      - "cmeta/**"
      - "cmake/**"
      - ".github/workflows/native-nuget-release.yml"
      - ".github/actions/setup-re2c-tools/**"
  push:
    branches: [master]
    paths:
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "packaging/nuget/**"
      - "tinymock/**"
      - "cmeta/**"
      - "cmake/**"
      - ".github/workflows/native-nuget-release.yml"
      - ".github/actions/setup-re2c-tools/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Read project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}' CMakeLists.txt)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x64 SDK
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore versioned re2c tools
        uses: ./.github/actions/setup-re2c-tools
      - name: Setup build environment
        id: env
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm
          test -n "${VCPKG_ROOT:-}"
          test -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cache="$GITHUB_WORKSPACE/build/vcpkg-binary-cache"
          mkdir -p "$cache"
          echo "image=${ImageOS:-linux}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "triplet=x64-linux" >> "$GITHUB_OUTPUT"
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.env.outputs.image }}-${{ steps.env.outputs.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.env.outputs.image }}-${{ steps.env.outputs.triplet }}-
      - name: Configure minimal Release SDK
        run: cmake --preset linux-release-user -DENABLE_TESTS=OFF -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build --preset linux-release-user --parallel 2
      - name: Install SDK
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/linux-x64"
          cmake --install build/linux-gcc-release --prefix "$prefix" --strip
          test -f "$prefix/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$prefix/include/cmeta/function.h"
          grep -F "cmeta_function_abi_desc" "$prefix/include/cmeta/function.h"
          grep -F "FunctionAbi" "$prefix/include/cmeta/function.h"
          test -f "$prefix/include/tinymock_cmeta.h"
          test -f "$prefix/include/tinymock_function.h"
          test -f "$prefix/include/tinymock_history.h"
          test -f "$prefix/include/tinymock_actions.h"
          test -f "$prefix/include/tinymock_return.h"
          test -f "$prefix/lib/cmake/Salts/SaltsTinyMock.cmake"
          grep -F "Salts::TinyMock" "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          grep -F "salts_tinymock_override_functions" "$prefix/lib/cmake/Salts/SaltsTinyMock.cmake"
          cat > "$prefix/salts-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          os=linux
          arch=x64
          profile=release
          EOF
      - name: Verify installed TinyMock consumer
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/linux-x64"
          cmake -S tests/tinymock_installed_consumer \
            -B build/tinymock-installed-consumer \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build/tinymock-installed-consumer --parallel 2
          ./build/tinymock-installed-consumer/tinymock_installed_consumer
      - uses: actions/upload-artifact@v4
        with:
          name: salts-sdk-linux-x64
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  macos:
    name: macOS SDK
    needs: metadata
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Restore versioned re2c tools
        uses: ./.github/actions/setup-re2c-tools
      - name: Setup build environment
        id: env
        shell: bash
        run: |
          set -euo pipefail
          brew install nasm
          test -n "${VCPKG_ROOT:-}"
          test -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          cache="$GITHUB_WORKSPACE/build/vcpkg-binary-cache"
          mkdir -p "$cache"
          echo "image=${ImageOS:-macos}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "triplet=default-osx-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.env.outputs.image }}-${{ steps.env.outputs.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.env.outputs.image }}-${{ steps.env.outputs.triplet }}-
      - name: Configure minimal Release SDK
        run: cmake --preset release-mac-ninja -DENABLE_TESTS=OFF -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build --preset build-default-mac --parallel 2
      - name: Install SDK
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            X64) rid=macos-x64 ;;
            ARM64) rid=macos-arm64 ;;
            *) echo "unsupported RUNNER_ARCH=$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          prefix="$GITHUB_WORKSPACE/stage/sdk/$rid"
          cmake --install build/mac-clang-release --prefix "$prefix" --strip
          test -f "$prefix/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$prefix/include/cmeta/function.h"
          grep -F "cmeta_function_abi_desc" "$prefix/include/cmeta/function.h"
          grep -F "FunctionAbi" "$prefix/include/cmeta/function.h"
          test -f "$prefix/include/tinymock_cmeta.h"
          test -f "$prefix/include/tinymock_function.h"
          test -f "$prefix/include/tinymock_history.h"
          test -f "$prefix/include/tinymock_actions.h"
          test -f "$prefix/include/tinymock_return.h"
          test -f "$prefix/lib/cmake/Salts/SaltsTinyMock.cmake"
          grep -F "Salts::TinyMock" "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          grep -F "salts_tinymock_override_functions" "$prefix/lib/cmake/Salts/SaltsTinyMock.cmake"
          cat > "$prefix/salts-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          os=macos
          arch=$RUNNER_ARCH
          profile=release
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: salts-sdk-macos
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  windows:
    name: Windows x64 SDK
    needs: metadata
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore versioned re2c tools
        uses: ./.github/actions/setup-re2c-tools
      - name: Setup build environment
        id: env
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vcpkgRoot = $env:VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) { throw "VCPKG_ROOT is unavailable" }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) { throw "Visual Studio x64 C++ toolchain was not found" }
          $cache = Join-Path $env:GITHUB_WORKSPACE "build\vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "triplet=x64-windows" >> $env:GITHUB_OUTPUT
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.env.outputs.image }}-${{ steps.env.outputs.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.env.outputs.image }}-${{ steps.env.outputs.triplet }}-
      - name: Configure minimal Release SDK
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --preset win-release-user -DENABLE_TESTS=OFF -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
      - name: Build
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --build --preset win-release-user --parallel 2
      - name: Install SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prefix = Join-Path $env:GITHUB_WORKSPACE "stage\sdk\windows-x64"
          cmake --install build/Msvc-Release --prefix $prefix --config Release
          $config = Join-Path $prefix "lib\cmake\Salts\SaltsConfig.cmake"
          $targets = Join-Path $prefix "lib\cmake\Salts\SaltsTargets.cmake"
          $functionHeader = Join-Path $prefix "include\cmeta\function.h"
          $tinymockHeader = Join-Path $prefix "include\tinymock_cmeta.h"
          $tinymockFunctionHeader = Join-Path $prefix "include\tinymock_function.h"
          $tinymockHistoryHeader = Join-Path $prefix "include\tinymock_history.h"
          $tinymockActionsHeader = Join-Path $prefix "include\tinymock_actions.h"
          $tinymockReturnHeader = Join-Path $prefix "include\tinymock_return.h"
          $tinymockCMake = Join-Path $prefix "lib\cmake\Salts\SaltsTinyMock.cmake"
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) { throw "missing $config" }
          if (-not (Test-Path -LiteralPath $functionHeader -PathType Leaf)) { throw "missing $functionHeader" }
          if (-not (Select-String -LiteralPath $functionHeader -SimpleMatch "cmeta_function_abi_desc" -Quiet)) { throw "missing cmeta_function_abi_desc in $functionHeader" }
          if (-not (Select-String -LiteralPath $functionHeader -SimpleMatch "FunctionAbi" -Quiet)) { throw "missing FunctionAbi in $functionHeader" }
          if (-not (Test-Path -LiteralPath $tinymockHeader -PathType Leaf)) { throw "missing $tinymockHeader" }
          if (-not (Test-Path -LiteralPath $tinymockFunctionHeader -PathType Leaf)) { throw "missing $tinymockFunctionHeader" }
          if (-not (Test-Path -LiteralPath $tinymockHistoryHeader -PathType Leaf)) { throw "missing $tinymockHistoryHeader" }
          if (-not (Test-Path -LiteralPath $tinymockActionsHeader -PathType Leaf)) { throw "missing $tinymockActionsHeader" }
          if (-not (Test-Path -LiteralPath $tinymockReturnHeader -PathType Leaf)) { throw "missing $tinymockReturnHeader" }
          if (-not (Test-Path -LiteralPath $tinymockCMake -PathType Leaf)) { throw "missing $tinymockCMake" }
          if (-not (Select-String -LiteralPath $targets -SimpleMatch "Salts::TinyMock" -Quiet)) {
            throw "missing Salts::TinyMock export in $targets"
          }
          if (-not (Select-String -LiteralPath $tinymockCMake -SimpleMatch "salts_tinymock_override_functions" -Quiet)) {
            throw "missing TinyMock CMake helper in $tinymockCMake"
          }
          @(
            "version=${{ needs.metadata.outputs.version }}"
            "commit=$env:GITHUB_SHA"
            "os=windows"
            "arch=x64"
            "profile=release"
          ) | Set-Content -LiteralPath (Join-Path $prefix "salts-sdk-manifest.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: salts-sdk-windows-x64
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  android:
    name: Android arm64-v8a SDK
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore versioned re2c tools
        uses: ./.github/actions/setup-re2c-tools
      - name: Setup build environment
        id: env
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm ninja-build
          test -n "${VCPKG_ROOT:-}"
          test -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          test -n "${ANDROID_NDK_HOME:-}"
          cache="$GITHUB_WORKSPACE/build/vcpkg-binary-cache"
          mkdir -p "$cache"
          ndk_revision="$(awk -F'= ' '/Pkg.Revision/ {print $2}' "$ANDROID_NDK_HOME/source.properties")"
          echo "image=${ImageOS:-linux}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "triplet=arm64-android" >> "$GITHUB_OUTPUT"
          echo "ndk=$ndk_revision" >> "$GITHUB_OUTPUT"
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.env.outputs.image }}-${{ steps.env.outputs.triplet }}-ndk-${{ steps.env.outputs.ndk }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.env.outputs.image }}-${{ steps.env.outputs.triplet }}-ndk-${{ steps.env.outputs.ndk }}-
      - name: Configure minimal Android Release SDK
        run: cmake --preset android-arm64-v8a-release -DENABLE_TESTS=OFF -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build --preset build-android-arm64-v8a-release --parallel 2
      - name: Install SDK
        shell: bash
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/stage/sdk/android-arm64-v8a"
          cmake --install build/android-arm64-v8a-release --prefix "$prefix"
          test -f "$prefix/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$prefix/include/cmeta/function.h"
          grep -F "cmeta_function_abi_desc" "$prefix/include/cmeta/function.h"
          grep -F "FunctionAbi" "$prefix/include/cmeta/function.h"
          test -f "$prefix/include/tinymock_cmeta.h"
          test -f "$prefix/include/tinymock_function.h"
          test -f "$prefix/include/tinymock_history.h"
          test -f "$prefix/include/tinymock_actions.h"
          test -f "$prefix/include/tinymock_return.h"
          test -f "$prefix/lib/cmake/Salts/SaltsTinyMock.cmake"
          grep -F "Salts::TinyMock" "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          grep -F "salts_tinymock_override_functions" "$prefix/lib/cmake/Salts/SaltsTinyMock.cmake"
          cat > "$prefix/salts-sdk-manifest.txt" <<EOF
          version=${{ needs.metadata.outputs.version }}
          commit=$GITHUB_SHA
          os=android
          abi=arm64-v8a
          api=android-24
          profile=release
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: salts-sdk-android-arm64-v8a
          path: stage/sdk
          if-no-files-found: error
          compression-level: 9

  pack:
    name: Pack Salts.Native
    needs: [metadata, linux, macos, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: salts-sdk-*
          path: package/sdk
          merge-multiple: true
      - name: Verify package payload
        shell: bash
        run: |
          set -euo pipefail
          test -f package/sdk/linux-x64/lib/cmake/Salts/SaltsConfig.cmake
          test -f package/sdk/linux-x64/include/cmeta/function.h
          test -f package/sdk/windows-x64/lib/cmake/Salts/SaltsConfig.cmake
          test -f package/sdk/windows-x64/include/cmeta/function.h
          test -f package/sdk/android-arm64-v8a/lib/cmake/Salts/SaltsConfig.cmake
          test -f package/sdk/android-arm64-v8a/include/cmeta/function.h
          grep -F "cmeta_function_abi_desc" package/sdk/linux-x64/include/cmeta/function.h
          grep -F "cmeta_function_abi_desc" package/sdk/windows-x64/include/cmeta/function.h
          grep -F "cmeta_function_abi_desc" package/sdk/android-arm64-v8a/include/cmeta/function.h
          test "$(find package/sdk -maxdepth 2 -name salts-sdk-manifest.txt | wc -l)" -eq 4
          find package/sdk -maxdepth 2 -name salts-sdk-manifest.txt -print
          du -sh package/sdk
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Create NuGet package
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack packaging/nuget/Salts.Native.csproj --configuration Release --output dist -p:PackageVersion=${{ needs.metadata.outputs.version }} -p:PackageRoot="$GITHUB_WORKSPACE/package" -p:RepositoryCommit="$GITHUB_SHA"
          test -f "dist/Salts.Native.${{ needs.metadata.outputs.version }}.nupkg"
      - uses: actions/upload-artifact@v4
        with:
          name: salts-native-nuget
          path: dist/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish package and GitHub Release
    if: github.event_name != 'pull_request'
    needs: [metadata, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: salts-native-nuget
          path: dist
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Enforce immutable package version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          if existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish 2>/dev/null)"; then
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "release $TAG already points to $existing, not $GITHUB_SHA" >&2
              echo "bump the Salts project/package version before publishing a changed SDK" >&2
              exit 1
            fi
            echo "release $TAG already belongs to this commit; publish retry is idempotent"
          fi
      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet nuget add source --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --name github https://nuget.pkg.github.com/qigao/index.json
          dotnet nuget push "dist/Salts.Native.${{ needs.metadata.outputs.version }}.nupkg" --api-key "$GITHUB_TOKEN" --source github --skip-duplicate
      - name: Create tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; package publish was idempotent"
            exit 0
          fi
          gh release create "$TAG" dist/*.nupkg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Salts $VERSION" --generate-notes
