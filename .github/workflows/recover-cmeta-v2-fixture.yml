name: Recover CMeta v2 fixture

on:
  push:
    branches:
      - refactor/cmeta-enum-domains
    paths:
      - .github/workflows/recover-cmeta-v2-fixture.yml
      - tools/recover_cmeta_v2_fixture.py

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cmeta-enum-domains
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact fixture migration
        run: python3 tools/recover_cmeta_v2_fixture.py
      - name: Verify focused CMeta gate
        run: |
          cmake -S tests/cmeta_shared_owner -B build/recover-cmeta-v2 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/recover-cmeta-v2 --target cmeta_data_test -j2
          ctest --test-dir build/recover-cmeta-v2 --no-tests=error --output-on-failure -R '^cmeta_data_test$'
      - name: Publish recovered source and remove recovery scaffolding
        run: |
          git config user.name "qigao"
          git config user.email "qi.gao2012@gmail.com"
          git add cmeta/tests/cmeta_data_test.c
          git rm .github/workflows/recover-cmeta-v2-fixture.yml \
                 tools/recover_cmeta_v2_fixture.py \
                 cmeta/tests/cmeta_data_v2_fixture.patch \
                 cmeta/tests/cmeta_data_v2_fixture_patch.note
          git diff --cached --check
          git commit -m "test(cmeta): migrate buffer fixture to lifecycle v2"
          git push origin HEAD:refactor/cmeta-enum-domains
