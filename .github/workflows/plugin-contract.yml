name: Plugin contract

on:
  pull_request:
    paths:
      - "plugin/**"
      - "CMakeLists.txt"
      - "cmake/SaltsConfig.cmake.in"
      - "vcpkg.json"
      - ".github/workflows/plugin-contract.yml"
  push:
    paths:
      - "plugin/**"
      - "CMakeLists.txt"
      - "cmake/SaltsConfig.cmake.in"
      - "vcpkg.json"
      - ".github/workflows/plugin-contract.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  linux:
    name: Linux Plugin ABI / loader / lifecycle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools

      - name: Install native build prerequisite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset linux-release-user \
            -DENABLE_TESTS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF \
            '-DVCPKG_INSTALL_OPTIONS=--only-binarycaching'

      - name: Build Plugin contracts
        shell: bash
        run: |
          set -euo pipefail
          cmake --build --preset linux-release-user --parallel 2 --target \
            salts_plugin_contract_test \
            salts_plugin_header_cpp_test \
            salts_plugin_loader_test \
            salts_plugin_lifecycle_test

      - name: Run Plugin contracts
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/linux-gcc-release \
            --output-on-failure \
            -R '^salts_plugin_(contract|header_cpp|loader|lifecycle)_test$'

      - name: Qualify installed Plugin ownership
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/salts-plugin-sdk"
          cmake --build --preset linux-release-user --parallel 2
          cmake --install build/linux-gcc-release --prefix "$prefix"
          cmake -S plugin/tests/package_config/plugin_abi                 -B build/plugin-installed-linux -G Ninja                 -DCMAKE_BUILD_TYPE=Release                 -DCMAKE_PREFIX_PATH="$prefix"
          cmake --build build/plugin-installed-linux --parallel 2
          ./build/plugin-installed-linux/plugin_abi_installed_consumer

      - name: Source hygiene
        shell: bash
        run: git diff --check

  windows:
    name: Windows Plugin ABI / loader / lifecycle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools

      - name: Resolve MSVC environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vsInstall)) { throw "Visual Studio x64 C++ toolchain was not found" }
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV

      - name: Configure
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          cmake --preset win-release-user -DENABLE_TESTS=ON -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF

      - name: Build Plugin contracts
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          cmake --build --preset win-release-user --parallel 2 --target salts_plugin_contract_test salts_plugin_header_cpp_test salts_plugin_loader_test salts_plugin_lifecycle_test

      - name: Run Plugin contracts
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          ctest --test-dir build\Msvc-Release --output-on-failure -R "^salts_plugin_(contract|header_cpp|loader|lifecycle)_test$"

      - name: Qualify installed Plugin ownership
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "prefix=%RUNNER_TEMP%\salts-plugin-sdk"
          cmake --build --preset win-release-user --parallel 2
          if errorlevel 1 exit /b 1
          cmake --install build\Msvc-Release --prefix "%prefix%"
          cmake -S plugin\tests\package_config\plugin_abi -B build\plugin-installed-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%prefix%"
          cmake --build build\plugin-installed-windows --parallel 2
          build\plugin-installed-windows\plugin_abi_installed_consumer.exe
