name: dev apply cnet slice 292 task2 green
on:
  push:
    branches:
      - perf/cnet-zero-copy-slice-292
    paths:
      - .github/dev-task2-green.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/cnet-zero-copy-slice-292
          fetch-depth: 0
      - name: Apply fail-closed Task 2 GREEN edit
        shell: bash
        run: |
          set -euo pipefail
          python .github/dev-task2-green.py
          rm .github/dev-task2-green.py .github/workflows/dev-apply-292-task2-green.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cnet/include/cnet/cnet.h cnet/src/cnet_client.c cnet/src/cnet_shards.h cnet/src/cnet_shards.c .github/dev-task2-green.py .github/workflows/dev-apply-292-task2-green.yml
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:perf/cnet-zero-copy-slice-292
