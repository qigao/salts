name: CNet fixed-control report edit

on:
  push:
    branches:
      - perf/cnet-fixed-control-attribution-270
    paths:
      - .github/workflows/cnet-fixed-control-report-edit.yml

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/cnet-fixed-control-attribution-270
      - name: Apply fixed-control report patch
        run: |
          python3 .github/scripts/cnet_fixed_control_report_edit.py
          git diff --check
          git diff -- cnet/benchmarks/cnet_io_benchmark.c
      - name: Commit fixed-control report patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnet/benchmarks/cnet_io_benchmark.c
          git commit -m 'perf(cnet): report closed fixed-control budget'
          git push origin HEAD:perf/cnet-fixed-control-attribution-270
