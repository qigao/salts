name: Secure root-relative FS

on:
  pull_request:
    paths:
      - "utils/include/salts_fs.h"
      - "utils/src/salts_fs_root.c"
      - "utils/tests/test_salts_fs_root.c"
      - "utils/CMakeLists.txt"
      - "utils/tests/CMakeLists.txt"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/actions/setup-re2c-tools/**"
      - ".github/workflows/fs-root-capability.yml"
  push:
    branches: [master]
    paths:
      - "utils/include/salts_fs.h"
      - "utils/src/salts_fs_root.c"
      - "utils/tests/test_salts_fs_root.c"
      - "utils/CMakeLists.txt"
      - "utils/tests/CMakeLists.txt"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - ".github/actions/setup-re2c-tools/**"
      - ".github/workflows/fs-root-capability.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  qualify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            runner: ubuntu-24.04
            configure_preset: linux-release-user
            build_preset: linux-release-user
            build_dir: build/linux-gcc-release
          - name: Windows MSVC
            runner: windows-2022
            configure_preset: win-release-user
            build_preset: win-release-user
            build_dir: build/Msvc-Release
          - name: macOS AppleClang
            runner: macos-15
            configure_preset: release-mac-ninja
            build_preset: build-default-mac
            build_dir: build/mac-clang-release

    steps:
      - uses: actions/checkout@v6

      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools

      - name: Setup Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere is unavailable: $vswhere"
          }
          $vsInstall = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio x64 C++ toolchain was not found"
          }
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV

      - name: Configure focused FS build
        if: runner.os != 'Windows'
        shell: pwsh
        env:
          CONFIGURE_PRESET: ${{ matrix.configure_preset }}
        run: |
          $ErrorActionPreference = "Stop"
          cmake --preset $env:CONFIGURE_PRESET `
            -DENABLE_TESTS=ON `
            -DBUILD_TESTS=ON `
            -DBUILD_BENCHMARKS=OFF `
            -DBUILD_EXAMPLES=OFF `
            '-DVCPKG_INSTALL_OPTIONS=--only-binarycaching'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure focused FS build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          cmake --preset "${{ matrix.configure_preset }}" -DENABLE_TESTS=ON -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF "-DVCPKG_INSTALL_OPTIONS=--only-binarycaching"

      - name: Build root capability test
        if: runner.os != 'Windows'
        shell: pwsh
        env:
          BUILD_PRESET: ${{ matrix.build_preset }}
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build --preset $env:BUILD_PRESET --parallel 2 --target test_salts_fs_root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build root capability test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          cmake --build --preset "${{ matrix.build_preset }}" --parallel 2 --target test_salts_fs_root
      - name: Run root capability test
        shell: pwsh
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          $ErrorActionPreference = "Stop"
          ctest --test-dir $env:BUILD_DIR --output-on-failure -R '^test_salts_fs_root$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Source hygiene
        shell: bash
        run: git diff --check
