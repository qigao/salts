name: Apply bounded fmt view refactor

on:
  push:
    branches:
      - work/tstr-vstr-safe-mutation-v2-red-tests3
    paths:
      - .github/workflows/patch-fmt-vstr.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tstr-vstr-safe-mutation-v2-red-tests3
          fetch-depth: 0

      - name: Apply and commit view-native formatter core
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          old = "SALTS_C_API int fmt_print(char *buf, size_t size, const char *fmt, const fmt_arg_t *args,\n                        size_t arg_count);"
          new = "SALTS_C_API int fmt_print_v(char *buf, size_t size, vstr pattern, const fmt_arg_t *args,\n                          size_t arg_count);\nSALTS_C_API int fmt_print(char *buf, size_t size, const char *fmt, const fmt_arg_t *args,\n                        size_t arg_count);"
          replace_once("utils/include/fmt.h", old, new)

          old = "SALTS_C_API tstr fmt_print_tstr(tstr s, const char *fmt, const fmt_arg_t *args, size_t arg_count);"
          new = "SALTS_C_API tstr fmt_print_tstr_v(tstr s, vstr pattern, const fmt_arg_t *args,\n                                 size_t arg_count);\nSALTS_C_API tstr fmt_print_tstr(tstr s, const char *fmt, const fmt_arg_t *args, size_t arg_count);"
          replace_once("utils/include/fmt.h", old, new)

          old = "SALTS_C_API int fmt_print(char *buf, size_t size, const char *fmt, const fmt_arg_t *args,\n                        size_t arg_count) {\n  if (!buf || size == 0)\n    return 0;\n  buf[0] = '\\0';\n  if (!fmt || (!args && arg_count > 0))\n    return 0;\n\n  const char *cursor = fmt;\n  const char *format_end = fmt + strlen(fmt);"
          new = "SALTS_C_API int fmt_print_v(char *buf, size_t size, vstr pattern, const fmt_arg_t *args,\n                          size_t arg_count) {\n  if (!buf || size == 0)\n    return 0;\n  buf[0] = '\\0';\n  if ((!pattern.data && pattern.len > 0) || (!args && arg_count > 0))\n    return 0;\n\n  const char *cursor = pattern.data ? pattern.data : \"\";\n  const char *format_end = cursor + pattern.len;"
          replace_once("utils/src/fmt.c", old, new)

          old = "format_error:\n  buf[0] = '\\0';\n  return 0;\n}\n\nSALTS_C_API tstr fmt_print_tstr(tstr s, const char *fmt, const fmt_arg_t *args,\n                                size_t arg_count) {"
          new = "format_error:\n  buf[0] = '\\0';\n  return 0;\n}\n\nSALTS_C_API int fmt_print(char *buf, size_t size, const char *fmt, const fmt_arg_t *args,\n                        size_t arg_count) {\n  if (!fmt) {\n    if (buf && size > 0)\n      buf[0] = '\\0';\n    return 0;\n  }\n  return fmt_print_v(buf, size, vstr_from_cstr(fmt), args, arg_count);\n}\n\nSALTS_C_API tstr fmt_print_tstr_v(tstr s, vstr pattern, const fmt_arg_t *args,\n                                  size_t arg_count) {"
          replace_once("utils/src/fmt.c", old, new)

          old = "  if (!s)\n    s = tstr_new();\n  if (!fmt || (!args && arg_count > 0))\n    return s;\n\n  for (;;) {\n    int written = fmt_print(buf, cap, fmt, args, arg_count);"
          new = "  if (!s)\n    s = tstr_new();\n  if ((!pattern.data && pattern.len > 0) || (!args && arg_count > 0))\n    return s;\n\n  for (;;) {\n    int written = fmt_print_v(buf, cap, pattern, args, arg_count);"
          replace_once("utils/src/fmt.c", old, new)

          old = "  if (buf != stack)\n    free(buf);\n  return s;\n}\n\n#if defined(__clang__)"
          new = "  if (buf != stack)\n    free(buf);\n  return s;\n}\n\nSALTS_C_API tstr fmt_print_tstr(tstr s, const char *fmt, const fmt_arg_t *args,\n                                size_t arg_count) {\n  if (!fmt) {\n    if (!s)\n      s = tstr_new();\n    return s;\n  }\n  return fmt_print_tstr_v(s, vstr_from_cstr(fmt), args, arg_count);\n}\n\n#if defined(__clang__)"
          replace_once("utils/src/fmt.c", old, new)
          PY

          git checkout origin/master -- .github/workflows/ci.yml
          rm .github/workflows/patch-fmt-vstr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: accept bounded vstr format patterns"
          git push origin HEAD:work/tstr-vstr-safe-mutation-v2-red-tests3
