name: CHTTP JWT admission TDD

on:
  pull_request:
    paths:
      - "chttp/**"
      - ".github/workflows/chttp-jwt-admission-tdd.yml"

permissions:
  contents: write

jobs:
  linux:
    if: github.repository == 'qigao/salts' && github.event.pull_request.number == 213 && github.head_ref == 'design/chttp-auth-phase-jwt-hardening'
    name: Linux CHTTP JWT slice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply Task 1 expiry-policy GREEN
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "chttp/include/chttp/chttp.h",
              "  const char *expected_issuer;\n  const char *expected_audience;\n} chttp_jwt_bearer_validator_options;",
              "  const char *expected_issuer;\n  const char *expected_audience;\n  int allow_missing_exp;\n} chttp_jwt_bearer_validator_options;",
          )

          replace_once(
              "chttp/src/chttp_jwt_internal.h",
              "#define CHTTP_JWT_INTERNAL_H\n\ntypedef struct chttp_server_request_state",
              "#define CHTTP_JWT_INTERNAL_H\n\n#include <stdint.h>\n\ntypedef struct chttp_server_request_state",
          )
          replace_once(
              "chttp/src/chttp_jwt_internal.h",
              "int chttp_jwt_bearer_request_validate(chttp_server_request_state *state,\n                                      const chttp_server_request_view *request,\n                                      chttp_jwt_bearer_validator *validator);",
              "int chttp_jwt_bearer_request_validate(chttp_server_request_state *state,\n                                      const chttp_server_request_view *request,\n                                      chttp_jwt_bearer_validator *validator);\nint chttp_jwt_bearer_request_validate_at(chttp_server_request_state *state,\n                                         const chttp_server_request_view *request,\n                                         chttp_jwt_bearer_validator *validator,\n                                         int64_t now_seconds);",
          )

          replace_once(
              "chttp/src/chttp_jwt.c",
              "  int64_t clock_skew_seconds;\n  char *expected_issuer;",
              "  int64_t clock_skew_seconds;\n  int allow_missing_exp;\n  char *expected_issuer;",
          )
          replace_once(
              "chttp/src/chttp_jwt.c",
              "  impl->clock_skew_seconds = options->clock_skew_seconds;\n  impl->expected_issuer",
              "  impl->clock_skew_seconds = options->clock_skew_seconds;\n  impl->allow_missing_exp = options->allow_missing_exp != 0;\n  impl->expected_issuer",
          )

          old_validate = '''int chttp_jwt_bearer_request_validate(chttp_server_request_state *state,
                                      const chttp_server_request_view *request,
                                      chttp_jwt_bearer_validator *handle) {
  chttp_jwt_bearer_validator_impl *validator;
  const char *token;
  cjwt_t *jwt = NULL;
  const time_t now = time(NULL);
  if (handle == NULL || request == NULL || state == NULL) return SALTS_EINVAL;
  validator = (chttp_jwt_bearer_validator_impl *)handle->impl;
  if (validator == NULL) return SALTS_EINVAL;
  token = chttp_jwt_bearer_token(request);
  if (token == NULL || now == (time_t)-1) return SALTS_EPERM;
  if (cjwt_decode(token, strlen(token), OPT_ALLOW_ONLY_HS_ALG, validator->key, validator->key_size,
                  (int64_t)now, validator->clock_skew_seconds, &jwt) != CJWTE_OK ||
      jwt == NULL || jwt->header.alg != alg_hs256 || !chttp_jwt_claims_match(validator, jwt)) {
    cjwt_destroy(jwt);
    return SALTS_EPERM;
  }
  chttp_jwt_request_state_reset(state);
  state->jwt_owner = jwt;
  state->jwt_claims = (chttp_jwt_claims_view){.issuer = jwt->iss,
                                               .subject = jwt->sub,
                                               .jwt_id = jwt->jti,
                                               .audiences = (const char *const *)jwt->aud.names,
                                               .audience_count = (size_t)jwt->aud.count,
                                               .issued_at = jwt->iat,
                                               .not_before = jwt->nbf,
                                               .expires_at = jwt->exp};
  return SALTS_OK;
}
'''
          new_validate = '''static int chttp_jwt_expired_strict(int64_t now_seconds, int64_t expires_at,
                                    int64_t clock_skew_seconds) {
  if (clock_skew_seconds > 0 && expires_at > INT64_MAX - clock_skew_seconds) return 0;
  return now_seconds >= expires_at + clock_skew_seconds;
}

int chttp_jwt_bearer_request_validate_at(chttp_server_request_state *state,
                                         const chttp_server_request_view *request,
                                         chttp_jwt_bearer_validator *handle,
                                         int64_t now_seconds) {
  chttp_jwt_bearer_validator_impl *validator;
  const char *token;
  cjwt_t *jwt = NULL;
  if (handle == NULL || request == NULL || state == NULL) return SALTS_EINVAL;
  validator = (chttp_jwt_bearer_validator_impl *)handle->impl;
  if (validator == NULL) return SALTS_EINVAL;
  token = chttp_jwt_bearer_token(request);
  if (token == NULL) return SALTS_EPERM;
  if (cjwt_decode(token, strlen(token), OPT_ALLOW_ONLY_HS_ALG, validator->key, validator->key_size,
                  now_seconds, validator->clock_skew_seconds, &jwt) != CJWTE_OK ||
      jwt == NULL || jwt->header.alg != alg_hs256 || !chttp_jwt_claims_match(validator, jwt)) {
    cjwt_destroy(jwt);
    return SALTS_EPERM;
  }
  if ((!validator->allow_missing_exp && jwt->exp == NULL) ||
      (jwt->exp != NULL && chttp_jwt_expired_strict(now_seconds, *jwt->exp,
                                                    validator->clock_skew_seconds))) {
    cjwt_destroy(jwt);
    return SALTS_EPERM;
  }
  chttp_jwt_request_state_reset(state);
  state->jwt_owner = jwt;
  state->jwt_claims = (chttp_jwt_claims_view){.issuer = jwt->iss,
                                               .subject = jwt->sub,
                                               .jwt_id = jwt->jti,
                                               .audiences = (const char *const *)jwt->aud.names,
                                               .audience_count = (size_t)jwt->aud.count,
                                               .issued_at = jwt->iat,
                                               .not_before = jwt->nbf,
                                               .expires_at = jwt->exp};
  return SALTS_OK;
}

int chttp_jwt_bearer_request_validate(chttp_server_request_state *state,
                                      const chttp_server_request_view *request,
                                      chttp_jwt_bearer_validator *handle) {
  const time_t now = time(NULL);
  if (now == (time_t)-1) return SALTS_EPERM;
  return chttp_jwt_bearer_request_validate_at(state, request, handle, (int64_t)now);
}
'''
          replace_once("chttp/src/chttp_jwt.c", old_validate, new_validate)
          PY

          git diff --check
          git diff -- chttp/include/chttp/chttp.h chttp/src/chttp_jwt.c chttp/src/chttp_jwt_internal.h

      - name: Setup re2c and vcpkg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm re2c
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            VCPKG_BIN="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$VCPKG_BIN")" >> "$GITHUB_ENV"
          fi

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure release preset
        run: cmake --preset linux-release-user

      - name: Build JWT test
        run: cmake --build --preset linux-release-user --target chttp_jwt_test

      - name: Run JWT test
        run: ctest --preset linux-release-user -R "^chttp_jwt_test$" --output-on-failure

      - name: Commit Task 1 GREEN
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chttp/include/chttp/chttp.h chttp/src/chttp_jwt.c chttp/src/chttp_jwt_internal.h
          git commit -m "fix(chttp): enforce bearer expiration policy"
          git push origin HEAD:design/chttp-auth-phase-jwt-hardening
