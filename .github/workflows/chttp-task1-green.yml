name: CHTTP task1 GREEN

on:
  push:
    branches:
      - agent/chttp-h2-deferred-task1

permissions:
  contents: write

jobs:
  task1-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Apply verified-red Task 1 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/chttp_task1_apply.py
          python3 .github/scripts/chttp_task1_apply.py
          git diff --check

      - name: Verify private control compile boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t include_dirs < <(find . -type d -name include -print)
          args=(-std=c11 -Wall -Wextra -Wpedantic -fsyntax-only -I chttp/src)
          for dir in "${include_dirs[@]}"; do
            args+=( -I "$dir" )
          done
          gcc "${args[@]}" -x c - <<'EOF'
          #include "chttp_server_runtime.h"
          int main(void) {
            chttp_server_deferred_control control = {0};
            return chttp_server_deferred_control_state(&control) == CHTTP_SERVER_DEFERRED_IDLE
                       ? 0
                       : 1;
          }
          EOF

      - name: Setup dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes nasm ninja-build re2c
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            VCPKG_BIN="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$VCPKG_BIN")" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: cmake --preset release-linux-ninja

      - name: Build focused Task 1 targets
        run: cmake --build --preset build-default-linux --target chttp_response_test chttp_server_test

      - name: Run focused Task 1 regression
        run: ctest --preset test-release-linux -R '^(chttp_response_test|chttp_server_test)$' --output-on-failure

      - name: Commit verified Task 1 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/chttp_task1_apply.py
          rm -f .github/workflows/chttp-task1-green.yml
          git config user.name "Qi Gao"
          git config user.email "qi.gao2012@gmail.com"
          git add -A .github/scripts/chttp_task1_apply.py \
                     .github/workflows/chttp-task1-green.yml \
                     chttp/src/chttp_server_runtime.h \
                     chttp/src/chttp_server_response.c \
                     chttp/src/chttp_server.c \
                     chttp/tests/chttp_response_test.c \
                     chttp/tests/CMakeLists.txt
          git diff --cached --check
          git commit -m "refactor(chttp): unify deferred response control"
          git push origin HEAD:agent/chttp-h2-deferred-task1
