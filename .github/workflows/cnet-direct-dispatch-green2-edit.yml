name: CNet direct-dispatch routing GREEN edit

on:
  push:
    branches:
      - perf/cnet-dispatch-bypass-276
    paths:
      - .github/workflows/cnet-direct-dispatch-green2-edit.yml

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/cnet-dispatch-bypass-276
      - name: Apply A1 routing GREEN
        run: |
          python3 .github/scripts/cnet_direct_dispatch_green2_edit.py
          git diff --check
          git diff -- cnet/src/cnet_client.c
      - name: Commit A1 routing GREEN
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnet/src/cnet_client.c
          git commit -m 'feat(cnet): bypass dispatcher in diagnostic mode'
          git push origin HEAD:perf/cnet-dispatch-bypass-276
