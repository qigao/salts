name: CMeta object contract

on:
  pull_request:
    paths:
      - "cmeta/include/cmeta/object.h"
      - "cmeta/include/cmeta/method.h"
      - "cmeta/include/cmeta/invokable.h"
      - "cmeta/include/cmeta/meta.h"
      - "cmeta/src/object.c"
      - "cmeta/src/data_v2.c"
      - "cmeta/src/method.c"
      - "cmeta/src/invokable.c"
      - "cmeta/tests/cmeta_object_test.c"
      - "cmeta/tests/cmeta_data_test.c"
      - "cmeta/tests/cmeta_method_test.c"
      - "cmeta/tests/cmeta_invokable_test.c"
      - "cmeta/tests/cmeta_header_cpp_test.cpp"
      - "cmeta/tests/CMakeLists.txt"
      - ".github/workflows/cmeta-object-binding.yml"
  push:
    paths:
      - "cmeta/include/cmeta/object.h"
      - "cmeta/include/cmeta/method.h"
      - "cmeta/include/cmeta/invokable.h"
      - "cmeta/include/cmeta/meta.h"
      - "cmeta/src/object.c"
      - "cmeta/src/data_v2.c"
      - "cmeta/src/method.c"
      - "cmeta/src/invokable.c"
      - "cmeta/tests/cmeta_object_test.c"
      - "cmeta/tests/cmeta_data_test.c"
      - "cmeta/tests/cmeta_method_test.c"
      - "cmeta/tests/cmeta_invokable_test.c"
      - "cmeta/tests/cmeta_header_cpp_test.cpp"
      - "cmeta/tests/CMakeLists.txt"
      - ".github/workflows/cmeta-object-binding.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  native:
    name: Linux CMeta object contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools

      - name: Install native build prerequisite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Configure focused native build
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset linux-release-user \
            -DENABLE_TESTS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF \
            '-DVCPKG_INSTALL_OPTIONS=--only-binarycaching'

      - name: Build CMeta object targets
        shell: bash
        run: |
          set -euo pipefail
          cmake --build --preset linux-release-user --parallel 2 --target \
            cmeta_object_test \
            cmeta_data_test \
            cmeta_method_test \
            cmeta_invokable_test \
            cmeta_header_cpp_test

      - name: Run focused tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/linux-gcc-release \
            --output-on-failure \
            -R '^(cmeta_object_test|cmeta_data_test|cmeta_method_test|cmeta_invokable_test|cmeta_header_cpp_test)

      - name: Source hygiene
        shell: bash
        run: git diff --check


      - name: Source hygiene
        shell: bash
        run: git diff --check
