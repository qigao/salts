name: Salts.Native unified ACE+CNet 2.3 candidate (Linux x64)

# Separate, opt-in, unmerged 2.3 review candidate only.
# [2.3-VERIFY] runs the actual installed SDK and produces an artifact only.
# [2.3-CANDIDATE] requires exact-head full host CI before NuGet RC publication.
# Both are mutually exclusive; no stable tag/release or automatic promotion.
'on':
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: salts-23-unified-candidate-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Verify and optionally publish exact unified 2.3 SDK
    if: >-
      github.repository == 'qigao/salts' &&
      github.event.pull_request.head.repo.full_name == 'qigao/salts' &&
      github.event.pull_request.head.ref == 'release/salts-2.3-ace-cnet-review' &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.draft &&
      startsWith(github.event.pull_request.title, 'DO NOT MERGE') &&
      (contains(github.event.pull_request.title, '[2.3-CANDIDATE]') || contains(github.event.pull_request.title, '[2.3-VERIFY]')) &&
      !(contains(github.event.pull_request.title, '[2.3-CANDIDATE]') && contains(github.event.pull_request.title, '[2.3-VERIFY]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout the exact unmerged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Gate source, 2.3 version and immutable package ID
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse --abbrev-ref HEAD)" = 'HEAD'
          sdk_version="$(awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}' CMakeLists.txt)"
          vcpkg_version="$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["version-semver"])')"
          test "$sdk_version" = '2.3.0'
          test "$vcpkg_version" = "$sdk_version"
          # A SHA prefix avoids an all-numeric SemVer prerelease identifier.
          candidate_version="$sdk_version-rc.sha$SOURCE_SHA"
          echo "sdk_version=$sdk_version" >> "$GITHUB_OUTPUT"
          echo "candidate_version=$candidate_version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Restore canonical re2c
        uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - name: Configure shared vcpkg cache
        uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@fafb1efe5ac2440bfd7a08e493988d0459d89e51
        with:
          mode: read

      - name: Prepare Linux build host
        uses: ./.github/actions/setup-build-host

      - name: Restore candidate compiler cache
        id: compiler_cache
        uses: ./.github/actions/setup-compiler-cache
        with:
          profile: linux-unified-2.3-candidate

      - name: Configure and build 2.3 SDK
        shell: bash
        run: |
          set -euo pipefail
          test -f "$QIGAO_VCPKG_TOOLCHAIN_FILE"
          # Match the canonical Linux release CI dependency graph exactly.
          # The previous release-linux-ninja + explicit vcpkg override resolved
          # a different GmSSL source and failed TLS framing (1/253 CTests).
          cmake --preset linux-release-ci \
            -DCMAKE_SUPPRESS_REGENERATION=ON -DENABLE_TESTS=ON \
            -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF -DBUILD_BENCHMARKS=OFF \
            -DCMETA_BUILD_BENCHMARKS=OFF -DCMETA_BUILD_NATIVE_THUNKS=OFF \
            -DNATIVE_IO_BUILD_BENCHMARKS=OFF \
            -DCOROUTINE_BUILD_BENCHMARKS=OFF -DCNET_BUILD_BENCHMARKS=OFF
          cmake --build build/linux-gcc-release --parallel 2

      - name: Execute ACE+CNet native runtime and installed-SDK contracts
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/linux-gcc-release \
            --no-tests=error --output-on-failure --timeout 90

      - name: Install SDK and verify Component+CNet 2.3 ABI admission
        shell: bash
        env:
          SDK_VERSION: ${{ steps.identity.outputs.sdk_version }}
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/package/sdk/linux-x64"
          cmake --install build/linux-gcc-release --prefix "$prefix"
          test -f "$prefix/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$prefix/lib/cmake/Salts/SaltsConfigVersion.cmake"
          test -f "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          test -f "$prefix/include/salts/component.h"
          test -f "$prefix/include/salts/component_plugin.h"
          grep -Fq 'Salts::Component' "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          grep -Fq 'Salts::ComponentPlugin' "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          grep -Fq 'Salts::CNet' "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          grep -Fq 'Salts::NativeIO' "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          ! grep -Fq 'Salts::CNetManager' "$prefix/lib/cmake/Salts/SaltsTargets.cmake"
          for header in cnet/manager.h cnet/client_pool.h cnet/recovery_policy.h cnet/managed_dial.h cnet/sg_host.h; do
            test -f "$prefix/include/$header"
          done
          grep -Fq 'recovery_ticket' "$prefix/include/cnet/managed_dial.h" || {
            echo "Cannot release Managed Dial without positive protocol READY capability (#1082)" >&2; exit 1
          }
          grep -Fq 'set(PACKAGE_VERSION "2.3.0")' "$prefix/lib/cmake/Salts/SaltsConfigVersion.cmake"
          cnet_so="$(find "$prefix" -type f -name 'libcnet.so*' -print -quit)"
          test -n "$cnet_so" || { echo "missing versioned CNet shared library" >&2; exit 1; }
          readelf -d "$cnet_so" | grep -Eq 'SONAME.*libcnet[.]so[.]2[.]3([^0-9]|$)'
          grep -Fq 'SALTS_COMPONENT_CONTEXT_INIT' "$prefix/include/salts/component.h"
          grep -Fq 'owner_address' "$prefix/include/salts/component_plugin.h"
          test ! -e "$prefix/lib/libcnet_manager.so"
          test ! -e "$prefix/bin/cnet_manager.dll"

          # This existing out-of-tree fixture rejects find_package(Salts 2.2)
          # and builds/runs a real exact-version Component consumer.
          cmake -S component/tests/package_config/component \
            -B "$RUNNER_TEMP/ace-installed-consumer" \
            "-DCMAKE_PREFIX_PATH=$prefix" \
            "-DSALTS_TEST_PREFIX=$prefix" \
            "-DSALTS_TEST_VERSION=$SDK_VERSION" \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE \
            -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=FALSE
          cmake --build "$RUNNER_TEMP/ace-installed-consumer" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/ace-installed-consumer" \
            --no-tests=error --output-on-failure

          # Independent C11/C++17 find_package from the same installed prefix.
          cmake -S cnet/tests/package_config/strategy \
            -B "$RUNNER_TEMP/cnet-installed-consumer" \
            "-DSALTS_TEST_PREFIX=$prefix" \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=FALSE \
            -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=FALSE
          cmake --build "$RUNNER_TEMP/cnet-installed-consumer" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/cnet-installed-consumer" \
            --no-tests=error --output-on-failure

      - name: Attest the source and installed SDK
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.identity.outputs.candidate_version }}
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/package/sdk/linux-x64"
          cat > "$prefix/salts-sdk-manifest.txt" <<EOF
          version=$CANDIDATE_VERSION
          commit=$SOURCE_SHA
          rid=linux-x64
          profile=unified-2.3-candidate
          EOF

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pack and inspect exact SHA-qualified NuGet artifact
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.identity.outputs.candidate_version }}
        run: |
          set -euo pipefail
          dotnet pack packaging/nuget/Salts.Native.csproj \
            --configuration Release --output dist \
            -p:PackageVersion="$CANDIDATE_VERSION" \
            -p:PackageRoot="$GITHUB_WORKSPACE/package" \
            -p:RepositoryCommit="$SOURCE_SHA"
          nupkg="dist/Salts.Native.$CANDIDATE_VERSION.nupkg"
          test -f "$nupkg"
          python3 - "$nupkg" "$CANDIDATE_VERSION" "$SOURCE_SHA" <<'PY'
          import sys
          import zipfile

          path, version, sha = sys.argv[1:]
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              manifest = 'sdk/linux-x64/salts-sdk-manifest.txt'
              if manifest not in names:
                  raise SystemExit('Unified 2.3 candidate manifest missing')
              if sorted(name for name in names if name.endswith('/salts-sdk-manifest.txt')) != [manifest]:
                  raise SystemExit('candidate contains unexpected platform manifests')
              actual = dict(
                  line.split('=', 1)
                  for line in archive.read(manifest).decode('utf-8').splitlines()
                  if '=' in line
              )
              expected = dict(
                  version=version, commit=sha, rid='linux-x64',
                  profile='unified-2.3-candidate'
              )
              if actual != expected:
                  raise SystemExit(f'candidate manifest mismatch: {actual!r}')
              required = (
                  'sdk/linux-x64/lib/cmake/Salts/SaltsConfigVersion.cmake',
                  'sdk/linux-x64/lib/cmake/Salts/SaltsTargets.cmake',
                  'sdk/linux-x64/include/salts/component.h',
                  'sdk/linux-x64/include/salts/component_plugin.h',
                  'sdk/linux-x64/include/cnet/managed_dial.h',
                  'sdk/linux-x64/include/cnet/client_pool.h',
                  'sdk/linux-x64/include/cnet/sg_host.h'
              )
              for name in required:
                  if name not in names:
                      raise SystemExit(f'missing packaged SDK file: {name}')
          PY
          sha256sum "$nupkg" | tee dist/SHA256SUMS

      - name: Upload attestable prerelease artifact
        uses: actions/upload-artifact@v4
        with:
          name: salts-native-23-unified-candidate-linux-x64
          path: |
            dist/*.nupkg
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Verify successful exact-head full host CI before prerelease publication
        if: contains(github.event.pull_request.title, '[2.3-CANDIDATE]')
        timeout-minutes: 45
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/1083" \
            --jq '.draft' | grep -Fqx 'true'
          full_ci_id=""
          for attempt in $(seq 1 30); do
            full_ci_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&per_page=50" \
              --jq '.workflow_runs | map(select(.event == "pull_request")) | .[0].id // empty')"
            if [ -n "$full_ci_id" ]; then break; fi
            sleep 15
          done
          test -n "$full_ci_id" || { echo "Exact eight-profile CI not found" >&2; exit 1; }
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$full_ci_id" --jq '.head_sha')" = "$SOURCE_SHA"
          gh run watch "$full_ci_id" --repo "$GITHUB_REPOSITORY" --interval 15 --exit-status
          native_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$full_ci_id/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("native / "))] | length')"
          incomplete_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$full_ci_id/jobs?per_page=100" \
            --jq '[.jobs[] | select((.name | startswith("native / ")) and .conclusion != "success")] | length')"
          test "$native_count" -eq 8 && test "$incomplete_count" -eq 0 || {
            echo "Candidate requires successful Linux, macOS, Windows, ARM and mobile CI on $SOURCE_SHA" >&2
            exit 1
          }
          # A green subset is not a release qualification. The *same*
          # combined source must have executed all five complete native CTests.
          full_ctest_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$full_ci_id/jobs?per_page=100" \
            --jq '[.jobs[] |
              select(.name == "native / linux-release" or
                     .name == "native / linux-clang-release" or
                     .name == "native / windows-release" or
                     .name == "native / macos-release" or
                     .name == "native / macos-clang-release") |
              select(any(.steps[]; (
                (.name == "Run complete Unix integration tests" or
                 .name == "Run complete Windows ACE integration tests") and
                .conclusion == "success")))] | length')"
          test "$full_ctest_count" -eq 5 || {
            echo "Unified SDK requires all five complete host CTest steps on $SOURCE_SHA" >&2
            exit 1
          }

          # ASan+UBSan and TSan must both pass on this immutable combined SHA
          # in one prior [2.3-SAN] CI run. Separate ACE/CNet branch success
          # cannot authorize publication. The normal candidate matrix has
          # exactly eight profiles and therefore does not repeat sanitizers.
          sanitizer_verified=0
          for san_run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&per_page=100" \
                --jq '.workflow_runs[] | select(.event == "pull_request" and .conclusion == "success") | .id'); do
            qualified="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$san_run/jobs?per_page=100" \
              --jq '[.jobs[] | select(
                (.name == "native / linux-ace-asan-ubsan" or
                 .name == "native / linux-ace-tsan") and
                .conclusion == "success")] | length')"
            if [ "$qualified" -eq 2 ]; then
              sanitizer_verified=1
              echo "Combined-SHA sanitizer qualification: CI $san_run"
              break
            fi
          done
          test "$sanitizer_verified" -eq 1 || {
            echo "No exact-SHA combined [2.3-SAN] ASan+UBSan/TSan success for $SOURCE_SHA" >&2
            exit 1
          }
          echo "Candidate source SHA $SOURCE_SHA qualified by eight-profile CI $full_ci_id"

      - name: Publish opt-in immutable prerelease (not a stable release)
        if: contains(github.event.pull_request.title, '[2.3-CANDIDATE]')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_VERSION: ${{ steps.identity.outputs.candidate_version }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/unified-candidate-nuget.config"
          printf '<configuration><packageSources><clear /></packageSources></configuration>\n' > "$config"
          dotnet nuget add source https://nuget.pkg.github.com/qigao/index.json \
            --name github --username qigao --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text --configfile "$config"
          dotnet nuget push "dist/Salts.Native.$CANDIDATE_VERSION.nupkg" \
            --api-key "$GITHUB_TOKEN" --source github --skip-duplicate \
            --configfile "$config"
          {
            echo '### Unified ACE+CNet 2.3 integration-only candidate'
            echo "- Source commit: $SOURCE_SHA"
            echo "- NuGet: Salts.Native $CANDIDATE_VERSION"
            echo '- RID: linux-x64 only'
            echo '- Packaged Windows/macOS RIDs, final sanitizer and downstream qualification remain separate.'
            echo '- No tag, GitHub Release, 2.2.x overwrite or master merge was performed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report ccache compilation statistics
        if: ${{ always() && steps.compiler_cache.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ccache --show-stats
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
