name: CNet direct-dispatch RED edit

on:
  push:
    branches:
      - perf/cnet-dispatch-bypass-276
    paths:
      - .github/workflows/cnet-direct-dispatch-red-edit.yml

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/cnet-dispatch-bypass-276
      - name: Add A1 RED target
        run: |
          python3 .github/scripts/cnet_direct_dispatch_red_edit.py
          git diff --check
          git diff -- cnet/tests/CMakeLists.txt
      - name: Commit A1 RED target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnet/tests/CMakeLists.txt
          git commit -m 'test(cnet): wire diagnostic direct-dispatch RED'
          git push origin HEAD:perf/cnet-dispatch-bypass-276
