name: CMeta conformance

on:
  pull_request:
    paths:
      - "cmeta/**"
      - "cserde/**"
      - "cbind/**"
      - "cflow/**"
      - "formal/cmeta_cflow_calculus/**"
      - "platform/**"
      - "concurrency/**"
      - "tinytest/**"
      - "cstl/**"
      - "salts_serial/**"
      - "utils/**"
      - "cmake/**"
      - "tests/install_consumer/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "presets/**"
      - "vcpkg.json"
      - ".github/workflows/cmeta.yml"
  push:
    branches: [master]
    paths:
      - "cmeta/**"
      - "cserde/**"
      - "cbind/**"
      - "cflow/**"
      - "formal/cmeta_cflow_calculus/**"
      - "platform/**"
      - "concurrency/**"
      - "tinytest/**"
      - "cstl/**"
      - "salts_serial/**"
      - "utils/**"
      - "cmake/**"
      - "tests/install_consumer/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "presets/**"
      - "vcpkg.json"
      - ".github/workflows/cmeta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Lean refinement certificate
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: true
          lake-package-directory: formal/cmeta_cflow_calculus

      - name: Setup re2c and vcpkg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm re2c
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            VCPKG_BIN="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$VCPKG_BIN")" >> "$GITHUB_ENV"
          fi

      - name: Configure
        shell: bash
        run: |
          cmake --preset linux-release-user
          grep -Fx 'SALTS_ENABLE_EPOLL_READINESS:BOOL=ON' \
            build/linux-gcc-release/CMakeCache.txt

      - name: Build
        run: cmake --build --preset linux-release-user

      - name: Test execution foundation and typed layers
        run: ctest --preset linux-release-user -R "^(platform_|concurrency_|thread_pool_test$|disruptor_test$|cmeta_|cserde_|cbind_|cflow_|cstl_|test_execution_compat$|test_salts_process$)" --output-on-failure

      - name: Install release profile
        run: cmake --build --preset install-linux-release-user

      - name: Verify C certificate binding
        run: ctest --preset test-release-linux -R "^(cflow_certificate_test|cflow_calculus_conformance_test)$" --output-on-failure

      - name: Verify installed package targets
        run: cmake --build --preset linux-release-user --target verify_installed_package

      - name: Test full Linux suite
        run: ctest --preset linux-release-user --output-on-failure

      - name: Verify CFlow lifecycle paths with AddressSanitizer
        run: |
          cmake --preset linux-dev-user -DBUILD_BENCHMARKS=OFF
          cmake --build --preset linux-dev-user --target \
            cflow_native_socket_example \
            cflow_native_pipe_example \
            cflow_native_file_example \
            cflow_io_native_test \
            cflow_io_pipe_test \
            cflow_io_file_test \
            cflow_process_test
          ctest --preset linux-dev-user \
            -R "^(cflow_native_(socket|pipe|file)_example|cflow_io_(native|pipe|file)_test|cflow_process_test)$" \
            --output-on-failure

  macos:
    name: macOS 15 release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Setup re2c and vcpkg
        shell: bash
        run: |
          brew install nasm re2c
          if [ -n "${VCPKG_ROOT:-}" ] &&
             [ -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            true
          elif [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] &&
               [ -f "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          elif [ -f "$(brew --prefix)/share/vcpkg/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "VCPKG_ROOT=$(brew --prefix)/share/vcpkg" >> "$GITHUB_ENV"
          else
            echo "A valid VCPKG_ROOT is unavailable" >&2
            exit 1
          fi

      - name: Configure
        run: cmake --preset release-mac-ninja

      - name: Build
        run: cmake --build --preset build-default-mac

      - name: Test execution foundation and typed layers
        run: ctest --preset test-release-mac -R "^(platform_|concurrency_|thread_pool_test$|disruptor_test$|cmeta_|cserde_|cflow_|cstl_|test_execution_compat$)" --output-on-failure

      - name: Verify installed package targets
        run: cmake --build --preset build-default-mac --target verify_installed_package

      - name: Collect macOS diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p build/macos-diagnostics
          sw_vers > build/macos-diagnostics/os.txt
          cmake --version > build/macos-diagnostics/cmake.txt
          cc --version > build/macos-diagnostics/compiler.txt 2>&1
          cp build/mac-clang-release/CMakeCache.txt build/macos-diagnostics/ 2>/dev/null || true
          cp build/mac-clang-release/CMakeFiles/CMakeConfigureLog.yaml build/macos-diagnostics/ 2>/dev/null || true

      - name: Upload macOS diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cflow-macos-15-diagnostics
          path: build/macos-diagnostics
          if-no-files-found: error

  android:
    name: Android arm64 Release cross-build
    runs-on: ubuntu-24.04
    env:
      ANDROID_INSTALL_PREFIX: ${{ github.workspace }}/build/android-arm64-package
    steps:
      - uses: actions/checkout@v6

      - name: Setup re2c and validate toolchains
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm re2c
          if [ -n "${VCPKG_ROOT:-}" ] &&
             [ -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            true
          elif [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] &&
               [ -f "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            echo "A valid VCPKG_ROOT is unavailable" >&2
            exit 1
          fi
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            echo "ANDROID_NDK_HOME is unavailable" >&2
            exit 1
          fi
          if [ ! -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" ]; then
            echo "Android NDK CMake toolchain is unavailable" >&2
            exit 1
          fi

      - name: Configure Android arm64 Release
        run: cmake --preset android-arm64-v8a-release

      - name: Cross-build Android arm64 Release
        run: cmake --build --preset build-android-arm64-v8a-release

      - name: Install Android package
        run: cmake --install build/android-arm64-v8a-release --prefix "$ANDROID_INSTALL_PREFIX"

      - name: Verify Android package exports
        shell: bash
        run: |
          test -f "$ANDROID_INSTALL_PREFIX/include/cflow/cflow.h"
          test -f "$ANDROID_INSTALL_PREFIX/include/salts/thread.h"
          test -f "$ANDROID_INSTALL_PREFIX/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$ANDROID_INSTALL_PREFIX/lib/cmake/Salts/SaltsTargets.cmake"

      - name: Collect Android build evidence
        if: always()
        shell: bash
        run: |
          mkdir -p build/android-evidence
          {
            echo "host=ubuntu-24.04"
            echo "abi=arm64-v8a"
            echo "api=android-24"
            echo "ndk=$ANDROID_NDK_HOME"
          } > build/android-evidence/target.txt
          cmake --version > build/android-evidence/cmake.txt
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version > build/android-evidence/compiler.txt 2>&1 || true
          cp "$ANDROID_NDK_HOME/source.properties" \
            build/android-evidence/ndk-source.properties 2>/dev/null || true
          cp build/android-arm64-v8a-release/CMakeCache.txt \
            build/android-evidence/ 2>/dev/null || true
          cp build/android-arm64-v8a-release/CMakeFiles/CMakeConfigureLog.yaml \
            build/android-evidence/ 2>/dev/null || true

      - name: Upload Android package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salts-android-arm64-release
          path: |
            build/android-arm64-package
            build/android-evidence
          if-no-files-found: error

  windows:
    name: Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup re2c
        shell: powershell
        run: choco install re2c -y --no-progress

      - name: Setup Windows build environment
        id: windows-env
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:VCPKG_INSTALLATION_ROOT)) {
            throw "VCPKG_INSTALLATION_ROOT is unavailable"
          }
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $vcpkgToolchain = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"
          if (-not (Test-Path -LiteralPath $vcpkgToolchain -PathType Leaf)) {
            throw "vcpkg toolchain is unavailable: $vcpkgToolchain"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere is unavailable: $vswhere"
          }
          $vsInstall = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0) {
            throw "vswhere failed with exit code $LASTEXITCODE"
          }
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio with the x64 C++ toolchain was not found"
          }
          $vsDevCmd = Join-Path $vsInstall "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) {
            throw "VsDevCmd.bat is unavailable: $vsDevCmd"
          }
          if ([string]::IsNullOrWhiteSpace($env:ImageOS) -or
              [string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            throw "GitHub runner image identity is unavailable"
          }

          $binaryCache = Join-Path $env:GITHUB_WORKSPACE "build\vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          "PROJECT_ROOT=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
          "VCPKG_BINARY_CACHE=$binaryCache" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$binaryCache,readwrite" >> $env:GITHUB_ENV
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-${{ steps.windows-env.outputs.image }}-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-${{ steps.windows-env.outputs.image }}-x64-windows-
            vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --preset win-release-user

      - name: Build
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --build --preset win-release-user

      - name: Test execution foundation and typed layers
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          ctest --preset win-release-user -R "^(platform_|concurrency_|thread_pool_test$|disruptor_test$|cmeta_|cserde_|cbind_|cflow_|cstl_|test_execution_compat$|test_salts_process$)" --output-on-failure

      - name: Install release profile
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --build --preset install-win-release-user

      - name: Verify installed package targets
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --build --preset win-release-user --target verify_installed_package
