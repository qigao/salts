name: CMeta conformance

on:
  pull_request:
    paths:
      - "cmeta/**"
      - "cserde/**"
      - "cflow/**"
      - "formal/cmeta_cflow_calculus/**"
      - "platform/**"
      - "concurrency/**"
      - "tinytest/**"
      - "turbostl/**"
      - "turbo_serial/**"
      - "utils/**"
      - "cmake/**"
      - "tests/install_consumer/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "presets/**"
      - "vcpkg.json"
      - ".github/workflows/cmeta.yml"
  push:
    branches: [master]
    paths:
      - "cmeta/**"
      - "cserde/**"
      - "cflow/**"
      - "formal/cmeta_cflow_calculus/**"
      - "platform/**"
      - "concurrency/**"
      - "tinytest/**"
      - "turbostl/**"
      - "turbo_serial/**"
      - "utils/**"
      - "cmake/**"
      - "tests/install_consumer/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "presets/**"
      - "vcpkg.json"
      - ".github/workflows/cmeta.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Lean refinement certificate
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: true
          lake-package-directory: formal/cmeta_cflow_calculus

      - name: Setup re2c and vcpkg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y re2c
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            VCPKG_BIN="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$VCPKG_BIN")" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: cmake --preset release-linux-ninja

      - name: Build
        run: cmake --build --preset build-default-linux

      - name: Test execution foundation and typed layers
        run: ctest --preset test-release-linux -R "^(platform_|concurrency_|thread_pool_test$|disruptor_test$|cmeta_|cserde_|cflow_|turbostl_|test_execution_compat$)" --output-on-failure

      - name: Verify C certificate binding
        run: ctest --preset test-release-linux -R "^(cflow_certificate_test|cflow_calculus_conformance_test)$" --output-on-failure

      - name: Verify installed package targets
        run: cmake --build --preset build-default-linux --target verify_installed_package

  macos:
    name: macOS 15 release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Setup re2c and vcpkg
        shell: bash
        run: |
          brew install re2c
          if [ -n "${VCPKG_ROOT:-}" ] &&
             [ -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            true
          elif [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] &&
               [ -f "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            echo "A valid VCPKG_ROOT is unavailable" >&2
            exit 1
          fi

      - name: Configure
        run: cmake --preset release-mac-ninja

      - name: Build
        run: cmake --build --preset build-default-mac

      - name: Test execution foundation and typed layers
        run: ctest --preset test-release-mac -R "^(platform_|concurrency_|thread_pool_test$|disruptor_test$|cmeta_|cserde_|cflow_|turbostl_|test_execution_compat$)" --output-on-failure

      - name: Verify installed package targets
        run: cmake --build --preset build-default-mac --target verify_installed_package

      - name: Collect macOS diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p build/macos-diagnostics
          sw_vers > build/macos-diagnostics/os.txt
          cmake --version > build/macos-diagnostics/cmake.txt
          cc --version > build/macos-diagnostics/compiler.txt 2>&1
          cp build/mac-clang-release/CMakeCache.txt build/macos-diagnostics/ 2>/dev/null || true
          cp build/mac-clang-release/CMakeFiles/CMakeConfigureLog.yaml build/macos-diagnostics/ 2>/dev/null || true

      - name: Upload macOS diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cflow-macos-15-diagnostics
          path: build/macos-diagnostics
          if-no-files-found: error

  windows:
    name: Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup re2c
        shell: powershell
        run: choco install re2c -y --no-progress

      - name: Configure, build, and test
        shell: cmd
        run: |
          if defined VCPKG_INSTALLATION_ROOT set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"
          if not defined VCPKG_ROOT exit /b 1

          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1

          cmake --preset release-win-msvc-ninja
          if errorlevel 1 exit /b 1
          cmake --build --preset build-release-windows
          if errorlevel 1 exit /b 1
          ctest --preset test-release-windows -R "^(platform_|concurrency_|thread_pool_test$|disruptor_test$|cmeta_|cserde_|cflow_|turbostl_|test_execution_compat$)" --output-on-failure
          if errorlevel 1 exit /b 1
          cmake --build --preset build-release-windows --target verify_installed_package
