name: CMeta conformance

on:
  pull_request:
    paths:
      - "cmeta/**"
      - "cserde/**"
      - "cbind/**"
      - "cflow/**"
      - "simd/**"
      - "formal/cmeta_cflow_calculus/**"
      - "platform/**"
      - "concurrency/**"
      - "tinytest/**"
      - "tinymock/**"
      - "cstl/**"
      - "uri/**"
      - "salts_serial/**"
      - "utils/**"
      - "cmake/**"
      - "tests/cmeta_shared_owner/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "presets/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/workflows/cmeta.yml"
      - ".github/actions/setup-re2c-tools/**"
  push:
    branches: [master]
    paths:
      - "cmeta/**"
      - "cserde/**"
      - "cbind/**"
      - "cflow/**"
      - "simd/**"
      - "formal/cmeta_cflow_calculus/**"
      - "platform/**"
      - "concurrency/**"
      - "tinytest/**"
      - "tinymock/**"
      - "cstl/**"
      - "uri/**"
      - "salts_serial/**"
      - "utils/**"
      - "cmake/**"
      - "tests/cmeta_shared_owner/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "presets/**"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/workflows/cmeta.yml"
      - ".github/actions/setup-re2c-tools/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  linux:
    name: Linux release
    runs-on: ubuntu-latest
    outputs:
      sdk-image: ${{ steps.linux-env.outputs.image }}
      sdk-triplet: ${{ steps.linux-env.outputs.triplet }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify Lean refinement certificate
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: true
          lake-package-directory: formal/cmeta_cflow_calculus

      - name: Restore versioned re2c tools
        uses: ./.github/actions/setup-re2c-tools

      - name: Setup vcpkg
        id: linux-env
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          test -n "${VCPKG_ROOT:-}"
          test -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          binary_cache="$GITHUB_WORKSPACE/build/vcpkg-binary-cache"
          mkdir -p "$binary_cache"
          echo "VCPKG_BINARY_CACHE=$binary_cache" >> "$GITHUB_ENV"
          echo "image=${ImageOS:-linux}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "triplet=x64-linux" >> "$GITHUB_OUTPUT"

      - name: Restore Linux vcpkg binary cache
        id: linux-vcpkg-cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.linux-env.outputs.image }}-${{ steps.linux-env.outputs.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.linux-env.outputs.image }}-${{ steps.linux-env.outputs.triplet }}-

      - name: Report Linux vcpkg cache state
        run: echo "vcpkg cache hit=${{ steps.linux-vcpkg-cache.outputs.cache-hit }}"

      - name: Configure
        shell: bash
        run: |
          cmake --preset linux-release-user
          grep -Fx 'SALTS_ENABLE_EPOLL_READINESS:BOOL=ON' \
            build/linux-gcc-release/CMakeCache.txt

      - name: Build
        run: cmake --build --preset linux-release-user

      - name: Test execution foundation and typed layers
        run: ctest --preset linux-release-user -R "^(platform_|concurrency_|thread_pool_test$|disruptor_test$|cmeta_|cserde_|cbind_|cflow_|cstl_|salts_simd_|test_execution_compat$|tinytest_equality_test$|test_salts_process$)" --output-on-failure

      - name: Install release profile
        run: cmake --build --preset install-linux-release-user

      - name: Verify C certificate binding
        run: ctest --preset test-release-linux -R "^(cflow_certificate_test|cflow_calculus_conformance_test)$" --output-on-failure

      - name: Stage Linux installed Salts SDK cache
        shell: bash
        run: |
          set -euxo pipefail
          sdk="$GITHUB_WORKSPACE/build/ci-salts-sdk"
          rm -rf "$sdk"
          mkdir -p "$sdk"
          cp -a "$GITHUB_WORKSPACE/external/pkgs/salts/release/." "$sdk/"
          test -f "$sdk/lib/cmake/Salts/SaltsConfig.cmake"
          cat > "$sdk/salts-sdk-manifest.txt" <<EOF
          commit=${{ github.event.pull_request.head.sha || github.sha }}
          os=${{ runner.os }}
          arch=${{ runner.arch }}
          image=${{ steps.linux-env.outputs.image }}
          triplet=${{ steps.linux-env.outputs.triplet }}
          profile=release
          EOF

      - name: Save Linux installed Salts SDK cache
        uses: actions/cache/save@v4
        with:
          path: build/ci-salts-sdk
          key: salts-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.linux-env.outputs.image }}-${{ steps.linux-env.outputs.triplet }}-release-${{ github.event.pull_request.head.sha || github.sha }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Verify CMeta shared ownership with sanitizers
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S tests/cmeta_shared_owner -B build/cmeta-owner -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMETA_OWNER_SANITIZERS=ON
          cmake --build build/cmeta-owner -j2
          ctest --test-dir build/cmeta-owner --no-tests=error --output-on-failure

      - name: Test full Linux suite
        run: ctest --preset linux-release-user --output-on-failure

      - name: Verify CFlow lifecycle paths with AddressSanitizer
        run: |
          cmake --preset linux-dev-user -DBUILD_BENCHMARKS=OFF
          cmake --build --preset linux-dev-user --target \
            cflow_native_socket_example \
            cflow_native_pipe_example \
            cflow_native_file_example \
            cflow_io_native_test \
            cflow_io_native_adapter_test \
            cflow_io_pipe_test \
            cflow_io_file_test
          ctest --preset linux-dev-user \
            -R "^(cflow_native_(socket|pipe|file)_example|cflow_io_(native|native_adapter|pipe|file)_test)$" \
            --output-on-failure

      - name: Verify CSTL allocator with sanitizers
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user -DBUILD_BENCHMARKS=OFF \
            -DENABLE_SANITIZER_ADDRESS=ON \
            -DENABLE_SANITIZER_UNDEFINED=ON
          cmake --build --preset linux-dev-user --target \
            cstl_vec_alloc_test \
            cstl_vec_alloc_cpp_test \
            cstl_sequence_test \
            cstl_ownership_test \
            cstl_header_test \
            cstl_header_cpp_test
          ctest --preset linux-dev-user \
            -R "^(cstl_vec_alloc_test|cstl_vec_alloc_cpp_test|cstl_sequence_test|cstl_ownership_test|cstl_header_test|cstl_header_cpp_test)$" \
            --output-on-failure

      - name: Check exact head and unchanged tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"

  sdk-cache-provenance-linux:
    name: Linux cached SDK provenance
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Restore exact-head Salts SDK
        id: salts-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: build/ci-salts-sdk
          key: salts-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.linux.outputs.sdk-image }}-${{ needs.linux.outputs.sdk-triplet }}-release-${{ github.event.pull_request.head.sha || github.sha }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          fail-on-cache-miss: true

      - name: Verify cached SDK provenance
        shell: bash
        run: |
          set -euxo pipefail
          manifest="$GITHUB_WORKSPACE/build/ci-salts-sdk/salts-sdk-manifest.txt"
          test -f "$manifest"
          grep -Fx "commit=${{ github.event.pull_request.head.sha || github.sha }}" "$manifest"
          grep -Fx "os=${{ runner.os }}" "$manifest"
          grep -Fx "arch=${{ runner.arch }}" "$manifest"
          grep -Fx "image=${{ needs.linux.outputs.sdk-image }}" "$manifest"
          grep -Fx "triplet=${{ needs.linux.outputs.sdk-triplet }}" "$manifest"
          grep -Fx "profile=release" "$manifest"
          test -f build/ci-salts-sdk/lib/cmake/Salts/SaltsConfig.cmake

      - name: Check exact head and unchanged tracked source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test -z "$(git status --porcelain --untracked-files=no)"

  macos:
    name: macOS 15 release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Restore versioned re2c tools
        uses: ./.github/actions/setup-re2c-tools

      - name: Setup vcpkg
        id: macos-env
        shell: bash
        run: |
          brew install nasm
          test -n "${VCPKG_ROOT:-}"
          test -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          binary_cache="$GITHUB_WORKSPACE/build/vcpkg-binary-cache"
          mkdir -p "$binary_cache"
          echo "VCPKG_BINARY_CACHE=$binary_cache" >> "$GITHUB_ENV"
          echo "image=${ImageOS:-macos}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "triplet=default-osx-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore macOS vcpkg binary cache
        id: macos-vcpkg-cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.macos-env.outputs.image }}-${{ steps.macos-env.outputs.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.macos-env.outputs.image }}-${{ steps.macos-env.outputs.triplet }}-

      - name: Report macOS vcpkg cache state
        run: echo "vcpkg cache hit=${{ steps.macos-vcpkg-cache.outputs.cache-hit }}"

      - name: Configure
        run: cmake --preset release-mac-ninja

      - name: Build
        run: cmake --build --preset build-default-mac

      - name: Test execution foundation and typed layers
        run: ctest --preset test-release-mac -R "^(platform_|concurrency_|thread_pool_test$|disruptor_test$|cmeta_|cserde_|cflow_|cstl_|salts_simd_|test_execution_compat$|tinytest_equality_test$)" --output-on-failure

      - name: Collect macOS diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p build/macos-diagnostics
          sw_vers > build/macos-diagnostics/os.txt
          cmake --version > build/macos-diagnostics/cmake.txt
          cc --version > build/macos-diagnostics/compiler.txt 2>&1
          cp build/mac-clang-release/CMakeCache.txt build/macos-diagnostics/ 2>/dev/null || true
          cp build/mac-clang-release/CMakeFiles/CMakeConfigureLog.yaml build/macos-diagnostics/ 2>/dev/null || true

      - name: Upload macOS diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cflow-macos-15-diagnostics
          path: build/macos-diagnostics
          if-no-files-found: error

  android:
    name: Android arm64 Release cross-build
    runs-on: ubuntu-24.04
    env:
      ANDROID_INSTALL_PREFIX: ${{ github.workspace }}/build/android-arm64-package
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Restore versioned re2c tools
        uses: ./.github/actions/setup-re2c-tools

      - name: Validate Android toolchains
        id: android-env
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm ninja-build
          test -n "${VCPKG_ROOT:-}"
          test -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          if [ -z "${ANDROID_NDK_HOME:-}" ]; then
            echo "ANDROID_NDK_HOME is unavailable" >&2
            exit 1
          fi
          if [ ! -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" ]; then
            echo "Android NDK CMake toolchain is unavailable" >&2
            exit 1
          fi
          binary_cache="$GITHUB_WORKSPACE/build/vcpkg-binary-cache"
          mkdir -p "$binary_cache"
          echo "VCPKG_BINARY_CACHE=$binary_cache" >> "$GITHUB_ENV"
          ndk_revision="$(awk -F'= ' '/Pkg.Revision/ {print $2}' "$ANDROID_NDK_HOME/source.properties")"
          test -n "$ndk_revision"
          echo "image=${ImageOS:-linux}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "triplet=arm64-android" >> "$GITHUB_OUTPUT"
          echo "ndk=$ndk_revision" >> "$GITHUB_OUTPUT"

      - name: Restore Android vcpkg binary cache
        id: android-vcpkg-cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.android-env.outputs.image }}-${{ steps.android-env.outputs.triplet }}-ndk-${{ steps.android-env.outputs.ndk }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.android-env.outputs.image }}-${{ steps.android-env.outputs.triplet }}-ndk-${{ steps.android-env.outputs.ndk }}-

      - name: Report Android vcpkg cache state
        run: echo "vcpkg cache hit=${{ steps.android-vcpkg-cache.outputs.cache-hit }}"

      - name: Configure Android arm64 Release
        run: cmake --preset android-arm64-v8a-release

      - name: Cross-build Android arm64 Release
        run: cmake --build --preset build-android-arm64-v8a-release

      - name: Install Android package
        run: cmake --install build/android-arm64-v8a-release --prefix "$ANDROID_INSTALL_PREFIX"

      - name: Verify Android package exports
        shell: bash
        run: |
          test -f "$ANDROID_INSTALL_PREFIX/include/cflow/cflow.h"
          test -f "$ANDROID_INSTALL_PREFIX/include/salts/thread.h"
          test -f "$ANDROID_INSTALL_PREFIX/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$ANDROID_INSTALL_PREFIX/lib/cmake/Salts/SaltsTargets.cmake"

      - name: Collect Android build evidence
        if: always()
        shell: bash
        run: |
          mkdir -p build/android-evidence
          {
            echo "host=ubuntu-24.04"
            echo "abi=arm64-v8a"
            echo "api=android-24"
            echo "ndk=$ANDROID_NDK_HOME"
          } > build/android-evidence/target.txt
          cmake --version > build/android-evidence/cmake.txt
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version > build/android-evidence/compiler.txt 2>&1 || true
          cp "$ANDROID_NDK_HOME/source.properties" \
            build/android-evidence/ndk-source.properties 2>/dev/null || true
          cp build/android-arm64-v8a-release/CMakeCache.txt \
            build/android-evidence/ 2>/dev/null || true
          cp build/android-arm64-v8a-release/CMakeFiles/CMakeConfigureLog.yaml \
            build/android-evidence/ 2>/dev/null || true

      - name: Upload Android package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salts-android-arm64-release
          path: |
            build/android-arm64-package
            build/android-evidence
          if-no-files-found: error

  windows:
    name: Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Restore versioned re2c tools
        uses: ./.github/actions/setup-re2c-tools

      - name: Setup Windows build environment
        id: windows-env
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgRoot = $env:VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            throw "VCPKG_ROOT is unavailable"
          }
          $vcpkgToolchain = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"
          if (-not (Test-Path -LiteralPath $vcpkgToolchain -PathType Leaf)) {
            throw "vcpkg toolchain is unavailable: $vcpkgToolchain"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere is unavailable: $vswhere"
          }
          $vsInstall = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0) {
            throw "vswhere failed with exit code $LASTEXITCODE"
          }
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio with the x64 C++ toolchain was not found"
          }
          $vsDevCmd = Join-Path $vsInstall "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) {
            throw "VsDevCmd.bat is unavailable: $vsDevCmd"
          }
          if ([string]::IsNullOrWhiteSpace($env:ImageOS) -or
              [string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            throw "GitHub runner image identity is unavailable"
          }

          $binaryCache = Join-Path $env:GITHUB_WORKSPACE "build\vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          "PROJECT_ROOT=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
          "VCPKG_BINARY_CACHE=$binaryCache" >> $env:GITHUB_ENV
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "triplet=x64-windows" >> $env:GITHUB_OUTPUT

      - name: Restore Windows vcpkg binary cache
        id: windows-vcpkg-cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.windows-env.outputs.image }}-${{ steps.windows-env.outputs.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.windows-env.outputs.image }}-${{ steps.windows-env.outputs.triplet }}-

      - name: Report Windows vcpkg cache state
        shell: pwsh
        run: Write-Host "vcpkg cache hit=${{ steps.windows-vcpkg-cache.outputs.cache-hit }}"

      - name: Configure
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --preset win-release-user

      - name: Build
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --build --preset win-release-user

      - name: Test execution foundation and typed layers
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          ctest --preset win-release-user -R "^(platform_|concurrency_|thread_pool_test$|disruptor_test$|cmeta_|cserde_|cbind_|cflow_|cstl_|salts_simd_|test_execution_compat$|tinytest_equality_test$|test_salts_process$)" --output-on-failure

      - name: Install release profile
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --build --preset install-win-release-user

      - name: Verify CMeta shared ownership
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake -S tests/cmeta_shared_owner -B build/cmeta-owner -G Ninja -DCMAKE_BUILD_TYPE=Release
          if errorlevel 1 exit /b 1
          cmake --build build/cmeta-owner -j2
          if errorlevel 1 exit /b 1
          ctest --test-dir build/cmeta-owner --no-tests=error --output-on-failure

      - name: Stage Windows installed Salts SDK cache
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdk = Join-Path $env:GITHUB_WORKSPACE "build\ci-salts-sdk"
          $source = Join-Path $env:GITHUB_WORKSPACE "external\pkgs\salts\release"
          if (Test-Path -LiteralPath $sdk) { Remove-Item -Recurse -Force $sdk }
          New-Item -ItemType Directory -Force -Path $sdk | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $sdk -Recurse -Force
          $config = Join-Path $sdk "lib\cmake\Salts\SaltsConfig.cmake"
          if (-not (Test-Path -LiteralPath $config -PathType Leaf)) {
            throw "installed SaltsConfig.cmake missing: $config"
          }
          @(
            "commit=${{ github.event.pull_request.head.sha || github.sha }}"
            "os=${{ runner.os }}"
            "arch=${{ runner.arch }}"
            "image=${{ steps.windows-env.outputs.image }}"
            "triplet=${{ steps.windows-env.outputs.triplet }}"
            "profile=release"
          ) | Set-Content -LiteralPath (Join-Path $sdk "salts-sdk-manifest.txt")

      - name: Save Windows installed Salts SDK cache
        uses: actions/cache/save@v4
        with:
          path: build/ci-salts-sdk
          key: salts-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.windows-env.outputs.image }}-${{ steps.windows-env.outputs.triplet }}-release-${{ github.event.pull_request.head.sha || github.sha }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Check exact head and unchanged tracked source
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expected = "${{ github.event.pull_request.head.sha || github.sha }}"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "expected head $expected, got $actual" }
          $dirty = @(git status --porcelain --untracked-files=no)
          if ($dirty.Count -ne 0) { throw "tracked source changed: $($dirty -join '; ')" }
