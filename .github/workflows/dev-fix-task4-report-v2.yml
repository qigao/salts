name: Dev fix retained benchmark report v2
on:
  push:
    branches:
      - perf/cnet-zero-copy-slice-292
    paths:
      - .github/dev-fix-task4-report-v2.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/cnet-zero-copy-slice-292
          fetch-depth: 0
          persist-credentials: true
      - name: Apply fail-closed edit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python .github/dev-fix-task4-report-v2.py
          rm .github/dev-fix-task4-report-v2.py
          rm .github/workflows/dev-fix-task4-report-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:perf/cnet-zero-copy-slice-292
