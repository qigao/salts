name: TurboSTL meta facade cleanup

on:
  push:
    branches:
      - refactor/turbostl-natural-api

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/turbostl-natural-api
          fetch-depth: 0
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Move generated facade to detail
        run: bash scripts/turbostl_meta_facade_cleanup.sh
      - name: Commit cleanup
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A turbostl cmeta cflow utils turbo_serial
          git commit -m "refactor(turbostl): retire public meta facade"
          git push origin HEAD:refactor/turbostl-natural-api
