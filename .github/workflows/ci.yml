name: CHTTP JWT Task 7 release checkpoints

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"

permissions:
  contents: write

jobs:
  linux:
    name: Linux release checkpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/chttp-auth-phase-jwt-hardening

      - name: Apply Task 7 docs/style patch
        run: |
          python3 .github/scripts/chttp-jwt-task7-docs.py
          git diff --check
          test "$(git diff --name-only | sort)" = $'chttp/README.md\nchttp/src/chttp_jwt.c'

      - name: Setup re2c and vcpkg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm re2c
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            VCPKG_BIN="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$VCPKG_BIN")" >> "$GITHUB_ENV"
          fi

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Fresh configure
        run: cmake --fresh --preset linux-release-user

      - name: Build full Linux release
        run: cmake --build --preset linux-release-user

      - name: Run narrow CHTTP/JWT checkpoint
        run: >-
          ctest --preset linux-release-user
          -R "^(chttp_jwt_test|chttp_server_parser_test|chttp_server_test|chttp_websocket_test|chttp_h2_server_test|chttp_requests_test|chttp_tls_test|chttp_cjwt_.*)$"
          --output-on-failure

      - name: Run full Linux CTest
        run: ctest --preset linux-release-user --output-on-failure

  windows:
    name: Windows release checkpoint
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/chttp-auth-phase-jwt-hardening

      - name: Apply Task 7 docs/style patch
        shell: pwsh
        run: |
          python .github/scripts/chttp-jwt-task7-docs.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = (git diff --name-only | Sort-Object) -join "`n"
          if ($changed -ne "chttp/README.md`nchttp/src/chttp_jwt.c") {
            throw "unexpected Task 7 diff: $changed"
          }

      - name: Setup re2c
        shell: powershell
        run: choco install re2c -y --no-progress

      - name: Setup Windows build environment
        id: windows-env
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_INSTALLATION_ROOT)) {
            throw "VCPKG_INSTALLATION_ROOT is unavailable"
          }
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $vcpkgToolchain = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"
          if (-not (Test-Path -LiteralPath $vcpkgToolchain -PathType Leaf)) {
            throw "vcpkg toolchain is unavailable: $vcpkgToolchain"
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere is unavailable: $vswhere"
          }
          $vsInstall = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio with the x64 C++ toolchain was not found"
          }
          $binaryCache = Join-Path $env:GITHUB_WORKSPACE "build\vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          "PROJECT_ROOT=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
          "VCPKG_BINARY_CACHE=$binaryCache" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;files,$binaryCache,readwrite" >> $env:GITHUB_ENV
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-${{ steps.windows-env.outputs.image }}-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-${{ steps.windows-env.outputs.image }}-x64-windows-
            vcpkg-binary-${{ runner.os }}-${{ runner.arch }}-

      - name: Fresh configure
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --fresh --preset win-release-user

      - name: Build full Windows release
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --build --preset win-release-user

      - name: Run narrow CHTTP/JWT checkpoint
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          ctest --preset win-release-user -R "^(chttp_jwt_test|chttp_server_parser_test|chttp_server_test|chttp_websocket_test|chttp_h2_server_test|chttp_requests_test|chttp_tls_test|chttp_cjwt_.*)$" --output-on-failure

      - name: Run full Windows CTest
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          ctest --preset win-release-user --output-on-failure

  commit:
    name: Commit verified Task 7 docs
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/chttp-auth-phase-jwt-hardening
      - name: Apply and commit verified docs/style patch
        shell: bash
        run: |
          python3 .github/scripts/chttp-jwt-task7-docs.py
          git diff --check
          test "$(git diff --name-only | sort)" = $'chttp/README.md\nchttp/src/chttp_jwt.c'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chttp/README.md chttp/src/chttp_jwt.c
          git commit -m "docs(chttp): document JWT admission security boundary"
          git push origin HEAD:design/chttp-auth-phase-jwt-hardening
