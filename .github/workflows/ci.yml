name: CHTTP JWT Task 4 GREEN executor

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/chttp-auth-phase-jwt-hardening

      - name: Apply approved Task 4 production patch
        run: |
          python3 .github/scripts/chttp-jwt-task4-green.py
          git diff --check
          test "$(git diff --name-only | sort)" = $'chttp/include/chttp/chttp.h\nchttp/src/chttp_server_route.c\nchttp/src/chttp_websocket_server.c'

      - name: Setup build environment
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm re2c
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            VCPKG_BIN="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$VCPKG_BIN")" >> "$GITHUB_ENV"
          fi

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure release preset
        run: cmake --preset linux-release-user

      - name: Build Task 4 GREEN
        run: >-
          cmake --build --preset linux-release-user --target
          chttp_jwt_test chttp_server_parser_test chttp_server_test chttp_websocket_test

      - name: Run Task 4 GREEN
        run: >-
          ctest --preset linux-release-user
          -R "^(chttp_jwt_test|chttp_server_parser_test|chttp_server_test|chttp_websocket_test)$"
          --output-on-failure

      - name: Audit H1 WebSocket admission reuse
        shell: bash
        run: |
          test "$(git grep -c 'chttp_server_route_find' -- chttp/src/chttp_websocket_server.c || true)" = "0"
          git grep -n "admitted_route\|jwt_claims" -- chttp/src/chttp_websocket_server.c

      - name: Commit and push verified Task 4 GREEN
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chttp/include/chttp/chttp.h chttp/src/chttp_server_route.c chttp/src/chttp_websocket_server.c
          git commit -m "feat(chttp): protect websocket admission with JWT"
          git push origin HEAD:design/chttp-auth-phase-jwt-hardening
