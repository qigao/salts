name: CHTTP JWT Task 3 GREEN executor

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/chttp-auth-phase-jwt-hardening

      - name: Apply approved Task 3 production patch
        run: |
          python3 .github/scripts/chttp-jwt-task3-green.py
          git diff --check
          test "$(git diff --name-only | sort)" = $'chttp/include/chttp/chttp.h\nchttp/src/chttp_jwt.c\nchttp/src/chttp_server.c\nchttp/src/chttp_server_route.c\nchttp/src/chttp_server_runtime.h'

      - name: Setup build environment
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm re2c
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            VCPKG_BIN="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$VCPKG_BIN")" >> "$GITHUB_ENV"
          fi

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure release preset
        run: cmake --preset linux-release-user

      - name: Build Task 3 GREEN
        run: >-
          cmake --build --preset linux-release-user --target
          chttp_jwt_test chttp_server_parser_test chttp_server_test

      - name: Run Task 3 GREEN
        run: >-
          ctest --preset linux-release-user
          -R "^(chttp_jwt_test|chttp_server_parser_test|chttp_server_test)$"
          --output-on-failure

      - name: Prove ordinary JWT middleware contract is gone from code
        shell: bash
        run: |
          if git grep -n "chttp_jwt_bearer_middleware" -- chttp/include chttp/src; then
            echo "::error::ordinary JWT middleware contract still exists"
            exit 1
          fi

      - name: Commit and push verified Task 3 GREEN
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chttp/include/chttp/chttp.h chttp/src/chttp_jwt.c chttp/src/chttp_server.c chttp/src/chttp_server_route.c chttp/src/chttp_server_runtime.h
          git commit -m "feat(chttp): authenticate JWT before request body admission"
          git push origin HEAD:design/chttp-auth-phase-jwt-hardening
