name: CHTTP JWT Task 5 GREEN executor

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/chttp-auth-phase-jwt-hardening

      - name: Apply approved Task 5 production patch
        shell: bash
        run: |
          python3 .github/scripts/chttp-jwt-task5-green.py
          git diff --check
          test "$(git diff --name-only | sort)" = $'chttp/src/chttp_h2_server.c\nchttp/tests/chttp_h2_server_test.c'

      - name: Setup build environment
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm re2c
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            VCPKG_BIN="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$VCPKG_BIN")" >> "$GITHUB_ENV"
          fi

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure release preset
        run: cmake --preset linux-release-user

      - name: Build Task 5 GREEN
        run: >-
          cmake --build --preset linux-release-user --target
          chttp_h2_server_test chttp_server_test chttp_jwt_test chttp_websocket_test

      - name: Run Task 5 GREEN
        run: >-
          ctest --preset linux-release-user
          -R "^(chttp_h2_server_test|chttp_server_test|chttp_jwt_test|chttp_websocket_test)$"
          --output-on-failure

      - name: Audit regular HTTP2 admission
        shell: bash
        run: |
          git grep -n "chttp_server_request_admit" -- chttp/src/chttp_h2_server.c
          git grep -n "admission_rejected" -- chttp/src/chttp_h2_server.c

      - name: Commit and push verified Task 5 GREEN
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chttp/src/chttp_h2_server.c chttp/tests/chttp_h2_server_test.c
          git commit -m "feat(chttp): authenticate HTTP2 streams before body delivery"
          git push origin HEAD:design/chttp-auth-phase-jwt-hardening
