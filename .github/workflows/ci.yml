name: CHTTP JWT Task 6 RED executor

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/chttp-auth-phase-jwt-hardening

      - name: Apply Task 6 RED test
        shell: bash
        run: |
          python3 .github/scripts/chttp-jwt-task6-red.py
          git diff --check
          test "$(git diff --name-only)" = "chttp/tests/chttp_h2_server_test.c"

      - name: Setup build environment
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm re2c
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            VCPKG_BIN="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$VCPKG_BIN")" >> "$GITHUB_ENV"
          fi

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure release preset
        run: cmake --preset linux-release-user

      - name: Build Task 6 RED
        run: cmake --build --preset linux-release-user --target chttp_h2_server_test

      - name: Prove Task 6 runtime RED
        shell: bash
        run: |
          set +e
          output="$(build/linux-gcc-release/bin/chttp_h2_server_test --filter "authenticates RFC 8441 websocket before opening" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::Task 6 RED unexpectedly passed before RFC8441 admission implementation"
            exit 1
          fi

      - name: Commit verified Task 6 RED
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chttp/tests/chttp_h2_server_test.c
          git commit -m "test(chttp): add RFC8441 JWT admission RED"
          git push origin HEAD:design/chttp-auth-phase-jwt-hardening
