name: CHTTP JWT Task 7 GREEN executor

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/chttp-auth-phase-jwt-hardening

      - name: Apply minimal Bearer 1*SP production patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("chttp/src/chttp_jwt.c")
          text = path.read_text()
          old_enum = '''enum {
            CHTTP_JWT_HS256_MIN_KEY_BYTES = 32u,
            CHTTP_JWT_BEARER_PREFIX_SIZE = sizeof("Bearer ") - 1u
          };'''
          new_enum = '''enum {
            CHTTP_JWT_HS256_MIN_KEY_BYTES = 32u,
            CHTTP_JWT_BEARER_SCHEME_SIZE = sizeof("Bearer") - 1u
          };'''
          # Match repository formatting without relying on indentation in this script.
          old_enum = old_enum.replace("          ", "")
          new_enum = new_enum.replace("          ", "")
          if text.count(old_enum) != 1:
              raise SystemExit("unexpected Bearer enum shape")
          text = text.replace(old_enum, new_enum, 1)

          old = '''static const char *chttp_jwt_bearer_token(const chttp_server_request_view *request) {
            const char *authorization = NULL;
            size_t index;
            if (request == NULL || request->headers == NULL) return NULL;
            for (index = 0u; index < request->header_count; ++index) {
              const chttp_header *header = &request->headers[index];
              if (chttp_jwt_ascii_equal_ci(header->name, "Authorization")) {
                if (authorization != NULL || header->value == NULL) return NULL;
                authorization = header->value;
              }
            }
            if (authorization == NULL || strlen(authorization) <= CHTTP_JWT_BEARER_PREFIX_SIZE ||
                authorization[CHTTP_JWT_BEARER_PREFIX_SIZE - 1u] != ' ')
              return NULL;
            for (index = 0u; index + 1u < CHTTP_JWT_BEARER_PREFIX_SIZE; ++index) {
              const unsigned char value = (unsigned char)authorization[index];
              const unsigned char expected = (unsigned char)"Bearer"[index];
              const unsigned char lower = value >= 'A' && value <= 'Z' ? (unsigned char)(value + ('a' - 'A'))
                                                                         : value;
              const unsigned char expected_lower =
                  expected >= 'A' && expected <= 'Z' ? (unsigned char)(expected + ('a' - 'A')) : expected;
              if (lower != expected_lower) return NULL;
            }
            return authorization + CHTTP_JWT_BEARER_PREFIX_SIZE;
          }'''.replace("          ", "")
          new = '''static const char *chttp_jwt_bearer_token(const chttp_server_request_view *request) {
            const char *authorization = NULL;
            size_t authorization_size;
            size_t index;
            if (request == NULL || request->headers == NULL) return NULL;
            for (index = 0u; index < request->header_count; ++index) {
              const chttp_header *header = &request->headers[index];
              if (chttp_jwt_ascii_equal_ci(header->name, "Authorization")) {
                if (authorization != NULL || header->value == NULL) return NULL;
                authorization = header->value;
              }
            }
            if (authorization == NULL) return NULL;
            authorization_size = strlen(authorization);
            if (authorization_size <= CHTTP_JWT_BEARER_SCHEME_SIZE ||
                authorization[CHTTP_JWT_BEARER_SCHEME_SIZE] != ' ')
              return NULL;
            for (index = 0u; index < CHTTP_JWT_BEARER_SCHEME_SIZE; ++index) {
              const unsigned char value = (unsigned char)authorization[index];
              const unsigned char expected = (unsigned char)"Bearer"[index];
              const unsigned char lower = value >= 'A' && value <= 'Z' ? (unsigned char)(value + ('a' - 'A'))
                                                                         : value;
              const unsigned char expected_lower =
                  expected >= 'A' && expected <= 'Z' ? (unsigned char)(expected + ('a' - 'A')) : expected;
              if (lower != expected_lower) return NULL;
            }
            index = CHTTP_JWT_BEARER_SCHEME_SIZE;
            while (index < authorization_size && authorization[index] == ' ') ++index;
            if (index == authorization_size || authorization[index] == '\t') return NULL;
            return authorization + index;
          }'''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit("unexpected Bearer parser shape")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --name-only)" = "chttp/src/chttp_jwt.c"
          git diff -- chttp/src/chttp_jwt.c

      - name: Setup build environment
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm re2c
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            VCPKG_BIN="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$VCPKG_BIN")" >> "$GITHUB_ENV"
          fi

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure release preset
        run: cmake --preset linux-release-user

      - name: Build Task 7 GREEN slice
        run: >-
          cmake --build --preset linux-release-user --target
          chttp_jwt_test chttp_server_parser_test chttp_server_test
          chttp_h2_server_test chttp_websocket_test

      - name: Run Task 7 GREEN slice
        run: >-
          ctest --preset linux-release-user
          -R "^(chttp_jwt_test|chttp_server_parser_test|chttp_server_test|chttp_h2_server_test|chttp_websocket_test)$"
          --output-on-failure

      - name: Prove Bearer rejection matrix GREEN
        run: >-
          build/linux-gcc-release/bin/chttp_server_test
          --filter "uses one uniform JWT rejection boundary and RFC6750 Bearer spacing"

      - name: Commit verified Task 7 GREEN
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chttp/src/chttp_jwt.c
          git commit -m "fix(chttp): accept RFC6750 Bearer space runs"
          git push origin HEAD:design/chttp-auth-phase-jwt-hardening
