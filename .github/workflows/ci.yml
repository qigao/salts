name: CHTTP JWT Task 7 corrected RED verifier

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/chttp-auth-phase-jwt-hardening

      - name: Correct Task 7 wire fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("chttp/tests/chttp_server_test.c")
          text = path.read_text()
          start_marker = '  it("uses one uniform JWT rejection boundary and RFC6750 Bearer spacing") {'
          end_marker = '  it("authenticates server-wide JWT before streaming admission and 100 continue") {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          corrected = block.replace(r'\\r\\n', r'\r\n').replace(r'\\t', r'\t')
          if corrected == block:
              raise SystemExit("Task 7 wire fixtures were not in the expected escaped-RED form")
          text = text[:start] + corrected + text[end:]
          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only)" = "chttp/tests/chttp_server_test.c"
          git diff -- chttp/tests/chttp_server_test.c

      - name: Setup build environment
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm re2c
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            VCPKG_BIN="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$VCPKG_BIN")" >> "$GITHUB_ENV"
          fi

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure release preset
        run: cmake --preset linux-release-user

      - name: Build corrected Task 7 RED
        run: cmake --build --preset linux-release-user --target chttp_server_test

      - name: Prove corrected Task 7 runtime RED
        shell: bash
        run: |
          set +e
          output="$(build/linux-gcc-release/bin/chttp_server_test --filter "uses one uniform JWT rejection boundary and RFC6750 Bearer spacing" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::Task 7 RED unexpectedly passed before Bearer 1*SP support"
            exit 1
          fi
          printf '%s\n' "$output" | grep -F "uses one uniform JWT rejection boundary and RFC6750 Bearer spacing"
          printf '%s\n' "$output" | grep -F "[ FAIL  ]"

      - name: Commit corrected verified Task 7 RED
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chttp/tests/chttp_server_test.c
          git commit -m "test(chttp): correct JWT rejection matrix wire fixtures"
          git push origin HEAD:design/chttp-auth-phase-jwt-hardening
