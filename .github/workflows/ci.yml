name: ci

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / GCC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y re2c ninja-build
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Configure, build and test
        run: |
          cmake --preset ci-linux
          cmake --build --preset ci-linux
          ctest --preset ci-linux

  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install re2c
        shell: pwsh
        run: choco install re2c -y --no-progress
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Configure, build and test
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          cmake --preset ci-windows || exit /b 1
          cmake --build --preset ci-windows || exit /b 1
          ctest --preset ci-windows || exit /b 1

  macos:
    name: macOS / Clang
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install re2c
        run: brew install re2c
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Configure, build and test
        run: |
          cmake --preset ci-macos
          cmake --build --preset ci-macos
          ctest --preset ci-macos

  android:
    name: Android / arm64-v8a
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y re2c ninja-build
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: false
      - name: Configure and build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cmake --preset ci-android-arm64
          cmake --build --preset ci-android-arm64
