name: CHTTP JWT macOS fixed-base provenance

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"

permissions:
  contents: read

env:
  JWT_FIXED_BASE: f9c68fb34fbc6bb9b2e7db3fcd35b7669550aee2

jobs:
  macos-fixed-base:
    name: macOS fixed-base remaining-failure provenance
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f9c68fb34fbc6bb9b2e7db3fcd35b7669550aee2
          fetch-depth: 1

      - name: Record exact fixed-base checkout
        shell: bash
        run: |
          set -euo pipefail
          echo "CHECKOUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$JWT_FIXED_BASE"

      - name: Setup re2c and vcpkg
        shell: bash
        run: |
          brew install nasm re2c
          if [ -n "${VCPKG_ROOT:-}" ] &&
             [ -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            true
          elif [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] &&
               [ -f "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          elif [ -f "$(brew --prefix)/share/vcpkg/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "VCPKG_ROOT=$(brew --prefix)/share/vcpkg" >> "$GITHUB_ENV"
          else
            echo "A valid VCPKG_ROOT is unavailable" >&2
            exit 1
          fi

      - name: Fresh configure fixed base
        run: cmake --fresh --preset release-mac-ninja

      - name: Build only remaining baseline candidates
        run: cmake --build --preset build-default-mac --target cnet_transport_test s3_file_test

      - name: Prove exact fixed-base failure cases
        shell: bash
        run: |
          set -euo pipefail
          prove_known_failure_set() {
            local binary="$1"
            local expected_count="$2"
            shift 2
            local log="$RUNNER_TEMP/$(basename "$binary").log"
            local status
            set +e
            "$binary" > "$log" 2>&1
            status=$?
            set -e
            cat "$log"
            test "$status" -ne 0
            test "$(grep -c '\[ FAIL  \]' "$log")" -eq "$expected_count"
            for expected in "$@"; do
              grep -F "$expected" "$log"
            done
          }

          prove_known_failure_set \
            build/mac-clang-release/bin/cnet_transport_test 1 \
            'applies bounded stream socket options before transport admission'

          prove_known_failure_set \
            build/mac-clang-release/bin/s3_file_test 2 \
            'streams signed files over HTTP/1.1' \
            'streams signed files over HTTP/2'
