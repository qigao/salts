name: CHTTP JWT Task 3 checkpoint

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/chttp-auth-phase-jwt-hardening

      - name: Add Task 3 checkpoint tests
        run: |
          python3 .github/scripts/chttp-jwt-task3-checkpoint.py
          git diff --check
          test "$(git diff --name-only)" = "chttp/tests/chttp_server_test.c"

      - name: Setup build environment
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm re2c
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            VCPKG_BIN="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$VCPKG_BIN")" >> "$GITHUB_ENV"
          fi

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure release preset
        run: cmake --preset linux-release-user

      - name: Build Task 3 checkpoint
        run: >-
          cmake --build --preset linux-release-user --target
          chttp_jwt_test chttp_server_parser_test chttp_server_test

      - name: Run Task 3 checkpoint
        run: >-
          ctest --preset linux-release-user
          -R "^(chttp_jwt_test|chttp_server_parser_test|chttp_server_test)$"
          --output-on-failure

      - name: Commit verified Task 3 checkpoint tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chttp/tests/chttp_server_test.c
          git commit -m "test(chttp): prove HTTP1 JWT admission state isolation"
          git push origin HEAD:design/chttp-auth-phase-jwt-hardening
