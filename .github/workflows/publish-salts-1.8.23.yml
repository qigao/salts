name: Publish Salts 1.8.23 tag

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/publish-salts-1.8.23.yml"

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Create immutable v1.8.23 tag
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: 6e33a12890d85686d1d3f47eb4b0de31212cfe55
      RELEASE_TAG: v1.8.23
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$RELEASE_SHA^{commit}"

          version="$(
            git show "$RELEASE_SHA:CMakeLists.txt" |
              awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}'
          )"
          vcpkg_version="$(
            git show "$RELEASE_SHA:vcpkg.json" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["version-semver"])'
          )"

          test "$version" = "1.8.23"
          test "$vcpkg_version" = "1.8.23"
          test "$RELEASE_TAG" = "v$version"

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force

          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            existing="$(git rev-list -n 1 "$RELEASE_TAG")"
            test "$existing" = "$RELEASE_SHA"
            echo "$RELEASE_TAG already resolves to $RELEASE_SHA"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Salts 1.8.23"
          git push origin "$RELEASE_TAG"

      - name: Dispatch canonical native release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run native-nuget-release.yml \
            --ref master \
            -f release_sha="$RELEASE_SHA" \
            -f tag="$RELEASE_TAG"
