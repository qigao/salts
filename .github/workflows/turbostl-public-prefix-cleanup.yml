name: TurboSTL public prefix cleanup

on:
  push:
    branches:
      - refactor/turbostl-natural-api

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/turbostl-natural-api
          fetch-depth: 0
      - name: Install fd and ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep
      - name: Remove remaining TurboSTL public prefixes
        run: bash scripts/turbostl_public_prefix_cleanup.sh
      - name: Commit cleanup
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "refactor(turbostl): finish public prefix cleanup"
          git push origin HEAD:refactor/turbostl-natural-api
