name: Android arm64 runtime

on:
  pull_request:
    paths:
      - "platform/**"
      - "concurrency/**"
      - "cmeta/**"
      - "cflow/**"
      - "tools/android-test.ps1"
      - "presets/AndroidPresets.json"
      - "presets/BuildPresets.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/actions/setup-re2c-tools/**"
      - ".github/workflows/android-arm64-runtime.yml"
  push:
    branches: [master]
    paths:
      - "platform/**"
      - "concurrency/**"
      - "cmeta/**"
      - "cflow/**"
      - "tools/android-test.ps1"
      - "presets/AndroidPresets.json"
      - "presets/BuildPresets.json"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/actions/setup-re2c-tools/**"
      - ".github/workflows/android-arm64-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  runtime:
    name: Android arm64-v8a runtime / macOS M1
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ANDROID_RUNTIME_API: "35"
      ANDROID_RUNTIME_IMAGE: "system-images;android-35;google_apis;arm64-v8a"
      ANDROID_RUNTIME_AVD: "salts-arm64-api35"
      ANDROID_RUNTIME_BUILD_PRESET: "build-android-arm64-v8a-runtime-test-mac"
      ANDROID_RUNTIME_BUILD_DIR: "build/android-arm64-v8a-runtime-test"

    steps:
      - uses: actions/checkout@v6

      - name: Set up shared build dependencies
        id: shared_deps
        uses: ./.github/actions/setup-re2c-tools

      - name: Record host and Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          uname -m
          sw_vers
          test "$(uname -m)" = "arm64"
          test -n "${ANDROID_HOME:-}"
          test -n "${ANDROID_NDK_HOME:-}"
          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/emulator/emulator"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          "$ANDROID_HOME/emulator/emulator" -version
          awk -F'= ' '/Pkg.Revision/ {print "NDK=" $2}' "$ANDROID_NDK_HOME/source.properties"

      - name: Install Android arm64 system image
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_RUNTIME_IMAGE"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name "$ANDROID_RUNTIME_AVD" \
            --package "$ANDROID_RUNTIME_IMAGE" \
            --device "pixel_5"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd

      - name: Cross-build selected Release owner tests
        shell: bash
        run: |
          set -euo pipefail
          query="$GITHUB_WORKSPACE/$ANDROID_RUNTIME_BUILD_DIR/.cmake/api/v1/query/client-android-test"
          mkdir -p "$query"
          cat > "$query/query.json" <<'EOF'
          {
            "requests": [
              { "kind": "codemodel", "version": { "major": 2 } }
            ]
          }
          EOF

          cmake --preset android-arm64-v8a-runtime-test
          cmake --build --preset "$ANDROID_RUNTIME_BUILD_PRESET" --parallel 2 --target \
            platform_clock_test \
            platform_thread_test \
            concurrency_deadline_queue_test \
            cmeta_core_test \
            cflow_execution_test \
            cflow_machine_instance_test \
            cflow_scheduler_compat_test

      - name: Start Android arm64 emulator
        shell: bash
        run: |
          set -euo pipefail
          adb="$ANDROID_HOME/platform-tools/adb"
          emulator="$ANDROID_HOME/emulator/emulator"

          "$adb" kill-server || true
          "$adb" start-server

          nohup "$emulator" \
            -avd "$ANDROID_RUNTIME_AVD" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            -accel off \
            -memory 1536 \
            -cores 2 \
            > "$RUNNER_TEMP/android-emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/android-emulator.pid"

          "$adb" wait-for-device
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            boot="$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$boot" = "1" ]; then
              "$adb" shell input keyevent 82 >/dev/null 2>&1 || true
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/android-emulator.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/android-emulator.log"
              exit 1
            fi
            sleep 5
          done

          cat "$RUNNER_TEMP/android-emulator.log"
          echo "Android emulator did not finish booting within 600 seconds" >&2
          exit 1

      - name: Record device runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/android-arm64-runtime
          {
            echo "commit=$GITHUB_SHA"
            echo "runner_os=$RUNNER_OS"
            echo "runner_arch=$RUNNER_ARCH"
            echo "host_machine=$(uname -m)"
            echo "ndk=$(awk -F'= ' '/Pkg.Revision/ {print $2}' "$ANDROID_NDK_HOME/source.properties")"
            echo "target_abi=$(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
            echo "api_level=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            echo "fingerprint=$(adb shell getprop ro.build.fingerprint | tr -d '\r')"
            echo "emulator=$("$ANDROID_HOME/emulator/emulator" -version 2>&1 | head -n 1)"
            echo "configure_preset=android-arm64-v8a-runtime-test"
            echo "build_preset=$ANDROID_RUNTIME_BUILD_PRESET"
          } | tee artifacts/android-arm64-runtime/metadata.txt

          test "$(adb shell getprop ro.product.cpu.abi | tr -d '\r')" = "arm64-v8a"
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = "$ANDROID_RUNTIME_API"

      - name: Run Android owner tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $targets = @(
            "platform_clock_test",
            "platform_thread_test",
            "concurrency_deadline_queue_test",
            "cmeta_core_test",
            "cflow_execution_test",
            "cflow_machine_instance_test",
            "cflow_scheduler_compat_test"
          )

          foreach ($target in $targets) {
            $junit = "artifacts/android-arm64-runtime/$target.xml"
            ./tools/android-test.ps1 $target `
              -Preset $env:ANDROID_RUNTIME_BUILD_PRESET `
              -BuildDirectory $env:ANDROID_RUNTIME_BUILD_DIR `
              -NoBuild `
              -JUnit $junit `
              -Tap
          }

      - name: Upload Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-runtime-evidence
          path: |
            artifacts/android-arm64-runtime
            ${{ runner.temp }}/android-emulator.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          "$ANDROID_HOME/platform-tools/adb" emu kill || true

      - name: Source hygiene
        shell: bash
        run: git diff --check
