name: Android arm64 runtime qualification

on:
  pull_request:
    paths:
      - "platform/**"
      - "concurrency/**"
      - "cmeta/**"
      - "cflow/**"
      - "cmake/SaltsConfig.cmake.in"
      - "presets/AndroidPresets.json"
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/actions/setup-re2c-tools/**"
      - ".github/scripts/build-android-arm64-runtime-consumer.sh"
      - ".github/scripts/run-android-arm64-runtime.sh"
      - ".github/workflows/android-arm64-runtime.yml"
  push:
    branches: [master]
    paths:
      - "platform/**"
      - "concurrency/**"
      - "cmeta/**"
      - "cflow/**"
      - "cmake/SaltsConfig.cmake.in"
      - "presets/AndroidPresets.json"
      - "CMakeLists.txt"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - ".github/actions/setup-re2c-tools/**"
      - ".github/scripts/build-android-arm64-runtime-consumer.sh"
      - ".github/scripts/run-android-arm64-runtime.sh"
      - ".github/workflows/android-arm64-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: android-arm64-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_sdk:
    name: Android arm64-v8a cross-build SDK
    runs-on: ubuntu-24.04
    outputs:
      ndk_revision: ${{ steps.env.outputs.ndk }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up shared build dependencies
        id: shared_deps
        uses: ./.github/actions/setup-re2c-tools

      - name: Prepare Android cross-build environment
        id: env
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes nasm ninja-build
          test -n "$VCPKG_ROOT"
          test -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          test -n "$ANDROID_NDK_HOME"
          test -f "$ANDROID_NDK_HOME/source.properties"
          ndk_revision="$(
            awk -F'= ' '/Pkg.Revision/ {print $2}' \
              "$ANDROID_NDK_HOME/source.properties"
          )"
          test -n "$ndk_revision"
          cache="$GITHUB_WORKSPACE/build/vcpkg-binary-cache"
          mkdir -p "$cache"
          echo "VCPKG_BINARY_CACHE=$cache" >> "$GITHUB_ENV"
          echo "image=${ImageOS:-linux}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "triplet=arm64-android" >> "$GITHUB_OUTPUT"
          echo "ndk=$ndk_revision" >> "$GITHUB_OUTPUT"

      - name: Restore Android vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: android-runtime-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.env.outputs.image }}-${{ steps.env.outputs.triplet }}-ndk-${{ steps.env.outputs.ndk }}-${{ steps.shared_deps.outputs.contract_version }}-${{ steps.shared_deps.outputs.cache_revision }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            android-runtime-vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.env.outputs.image }}-${{ steps.env.outputs.triplet }}-ndk-${{ steps.env.outputs.ndk }}-${{ steps.shared_deps.outputs.contract_version }}-${{ steps.shared_deps.outputs.cache_revision }}-

      - name: Configure Android arm64-v8a Release SDK
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset android-arm64-v8a-release \
            -DENABLE_TESTS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF

      - name: Build and install Android SDK
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NDK_REVISION: ${{ steps.env.outputs.ndk }}
          CACHE_CONTRACT: ${{ steps.shared_deps.outputs.contract_version }}
          CACHE_REVISION: ${{ steps.shared_deps.outputs.cache_revision }}
        run: |
          set -euo pipefail
          cmake --build --preset build-android-arm64-v8a-release --parallel 2
          prefix="$GITHUB_WORKSPACE/stage/sdk/android-arm64-v8a"
          cmake --install build/android-arm64-v8a-release --prefix "$prefix"

          test -f "$prefix/lib/cmake/Salts/SaltsConfig.cmake"
          test -f "$prefix/include/salts/thread.h"
          test -f "$prefix/include/salts/deadline_queue.h"
          test -f "$prefix/include/cmeta/cmeta.h"
          test -f "$prefix/include/cflow/reactive.h"
          test -f "$prefix/include/cflow/scheduler.h"

          mkdir -p "$GITHUB_WORKSPACE/android-cross-build-results"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          result = {
              "schema": "salts-android-cross-build/v1",
              "commit": os.environ["SOURCE_SHA"],
              "host": "ubuntu-24.04",
              "abi": "arm64-v8a",
              "android_platform": "android-24",
              "ndk_revision": os.environ["NDK_REVISION"],
              "vcpkg_cache_contract": os.environ["CACHE_CONTRACT"],
              "vcpkg_cache_revision": os.environ["CACHE_REVISION"],
              "install_prefix": "stage/sdk/android-arm64-v8a",
              "runtime_verified": False,
          }
          path = root / "android-cross-build-results" / "cross-build.json"
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          PY

          export SALTS_ANDROID_NDK_REVISION="$NDK_REVISION"
          bash .github/scripts/build-android-arm64-runtime-consumer.sh
          test -f "$GITHUB_WORKSPACE/stage/runtime-bundle/salts_android_runtime_probe"
          test -f "$GITHUB_WORKSPACE/android-cross-build-results/package-consumer.json"

      - name: Upload Android installed SDK
        uses: actions/upload-artifact@v6
        with:
          name: salts-android-arm64-runtime-sdk
          path: stage/sdk/android-arm64-v8a
          if-no-files-found: error
          compression-level: 9

      - name: Upload Android cross-build metadata
        uses: actions/upload-artifact@v6
        with:
          name: salts-android-arm64-cross-build-evidence
          path: android-cross-build-results
          if-no-files-found: error

      - name: Upload Android runtime bundle
        uses: actions/upload-artifact@v6
        with:
          name: salts-android-arm64-runtime-bundle
          path: stage/runtime-bundle
          if-no-files-found: error
          compression-level: 9

  android_runtime:
    name: Android arm64-v8a API 30 runtime
    needs: android_sdk
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download Android runtime bundle
        uses: actions/download-artifact@v6
        with:
          name: salts-android-arm64-runtime-bundle
          path: stage/runtime-bundle

      - name: Download Android cross-build metadata
        uses: actions/download-artifact@v6
        with:
          name: salts-android-arm64-cross-build-evidence
          path: android-cross-build-results

      - name: Enable ARM64 Linux KVM
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          test "$(uname -m)" = "aarch64"
          if [[ ! -e /dev/kvm ]]; then
            echo "/dev/kvm is unavailable on ubuntu-24.04-arm" >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Run installed SDK on arm64 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 30
          target: aosp_atd
          arch: arm64-v8a
          cores: 2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window
            -accel on
            -no-snapshot
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
          script: bash .github/scripts/run-android-arm64-runtime.sh

      - name: Upload Android runtime evidence
        uses: actions/upload-artifact@v6
        with:
          name: salts-android-arm64-runtime-evidence
          path: android-runtime-results
          if-no-files-found: error
