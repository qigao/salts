name: Temporary Plugin Windows contract

on:
  pull_request:
    paths:
      - "plugin/**"
      - ".github/workflows/plugin-windows-contract.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: temp-plugin-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-plugin:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: qigao/vcpkg-cache/.github/actions/setup-vcpkg-cache@master
        with:
          mode: read

      - uses: qigao/vcpkg-cache/.github/actions/setup-re2c-tools@master

      - name: Prepare MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install ninja -y --no-progress
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products "*" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) { throw "MSVC was not found" }
          "VSINSTALL=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake -S . -B build\plugin-windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" -DVCPKG_TARGET_TRIPLET=x64-windows
          if errorlevel 1 exit /b 1

      - name: Build focused contract
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --build build\plugin-windows --target salts_plugin_windows_dependency_test --parallel 4
          if errorlevel 1 exit /b 1

      - name: Run focused contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ctest --test-dir build/plugin-windows -R '^salts_plugin_windows_dependency_test$' --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw "Windows Plugin dependency contract failed" }
