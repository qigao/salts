name: CSTL semantic zero first mutation

on:
  pull_request:
    paths:
      - "cstl/CMakeLists.txt"
      - "cstl/benchmarks/**"
      - "cstl/src/vec.c"
      - "cstl/src/deque.c"
      - "cstl/src/heap.c"
      - "cstl/src/list.c"
      - "cstl/src/set.c"
      - "cstl/src/map.c"
      - "cstl/tests/cstl_semantic_projection_test.c"
      - "cstl/tests/cstl_ownership_test.c"
      - "cstl/tests/cstl_list_test.c"
      - "cstl/tests/cstl_map_test.c"
      - ".github/workflows/cstl-semantic-zero.yml"
  push:
    paths:
      - "cstl/CMakeLists.txt"
      - "cstl/benchmarks/**"
      - "cstl/src/vec.c"
      - "cstl/src/deque.c"
      - "cstl/src/heap.c"
      - "cstl/src/list.c"
      - "cstl/src/set.c"
      - "cstl/src/map.c"
      - "cstl/tests/cstl_semantic_projection_test.c"
      - "cstl/tests/cstl_ownership_test.c"
      - "cstl/tests/cstl_list_test.c"
      - "cstl/tests/cstl_map_test.c"
      - ".github/workflows/cstl-semantic-zero.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  linux:
    name: Linux C11 semantic-zero contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools

      - name: Install native build prerequisite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Configure focused build
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset linux-release-user \
            -DENABLE_TESTS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=ON \
            -DBUILD_EXAMPLES=OFF \
            '-DVCPKG_INSTALL_OPTIONS=--only-binarycaching'

      - name: Build semantic-zero targets
        shell: bash
        run: |
          set -euo pipefail
          cmake --build --preset linux-release-user --parallel 2 --target \
            cstl_semantic_projection_test \
            cstl_ownership_test \
            cstl_list_test \
            cstl_map_test \
            cstl_semantic_zero_benchmark

      - name: Run semantic-zero tests
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/linux-gcc-release \
            --output-on-failure \
            -R '^(cstl_semantic_projection_test|cstl_ownership_test|cstl_list_test|cstl_map_test)$'

      - name: Run semantic-zero benchmark
        shell: bash
        run: |
          set -euo pipefail
          bench="$(find build/linux-gcc-release -type f -name cstl_semantic_zero_benchmark -perm -111 -print -quit)"
          test -n "$bench"
          "$bench" --no-color

      - name: Source hygiene
        shell: bash
        run: git diff --check

  windows:
    name: MSVC semantic-zero contract
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools

      - name: Configure focused MSVC build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build/cstl-semantic-msvc -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:QIGAO_VCPKG_TOOLCHAIN_FILE" "-DVCPKG_TARGET_TRIPLET=x64-windows" "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE\vcpkg_installed-cstl-semantic" "-DVCPKG_INSTALL_OPTIONS=--only-binarycaching" "-DENABLE_TESTS=ON" "-DBUILD_TESTS=ON" "-DBUILD_BENCHMARKS=ON" "-DBUILD_EXAMPLES=OFF"

      - name: Build semantic-zero targets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build/cstl-semantic-msvc --config Release --parallel 2 --target cstl_semantic_projection_test cstl_ownership_test cstl_list_test cstl_map_test cstl_semantic_zero_benchmark

      - name: Run semantic-zero tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ctest --test-dir build/cstl-semantic-msvc -C Release --output-on-failure -R "^(cstl_semantic_projection_test|cstl_ownership_test|cstl_list_test|cstl_map_test)$"

      - name: Source hygiene
        shell: pwsh
        run: git diff --check
