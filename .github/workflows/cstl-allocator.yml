name: CSTL allocator-bound Vec
on:
  pull_request:
    paths: ['cstl/**', 'cmeta/**', '.github/workflows/cstl-allocator.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cstl-allocator-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  allocator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=2:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
          path: vcpkg
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: xml-sax-vcpkg-b1b19307-v1
      - name: Prepare and identify source
        shell: bash
        run: |
          set -euxo pipefail
          echo "PROJECT_ROOT=$RUNNER_TEMP/salts-project" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/allocator-evidence"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD > "$RUNNER_TEMP/allocator-evidence/head.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/allocator-evidence/source.tar.gz"
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config nasm re2c
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Build and test canonical providers with ASan and UBSan
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user -DENABLE_SANITIZER_ADDRESS=ON \
            -DENABLE_SANITIZER_UNDEFINED=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/linux-gcc-debug --target cstl_vec_alloc_test cstl_vec_alloc_cpp_test \
            cstl_sequence_test cstl_ownership_test cstl_header_test cstl_header_cpp_test -j2
          ctest --test-dir build/linux-gcc-debug --no-tests=error --output-on-failure \
            -R '^(cstl_vec_alloc_test|cstl_vec_alloc_cpp_test|cstl_sequence_test|cstl_ownership_test|cstl_header_test|cstl_header_cpp_test)$' \
            --output-junit "$RUNNER_TEMP/allocator-evidence/sanitized.xml"
      - name: Build and install full native SDK
        shell: bash
        run: |
          set -euxo pipefail
          cmake --preset linux-dev-user -B build/allocator-sdk \
            -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_UNDEFINED=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/allocator-sdk"
          cmake --build build/allocator-sdk --target install -j2 \
            2>&1 | tee "$RUNNER_TEMP/allocator-evidence/install.log"
          test -f "$RUNNER_TEMP/allocator-sdk/include/cstl/allocator.h"
          test -f "$RUNNER_TEMP/allocator-sdk/include/cstl/vec_alloc.h"
          test -f "$RUNNER_TEMP/allocator-sdk/include/xml_parser/xml_sax.h"
      - name: Verify independent installed C and C++ consumers
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S cstl/tests/allocator_installed -B build/allocator-consumer -G Ninja \
            -DSalts_DIR="$RUNNER_TEMP/allocator-sdk/lib/cmake/Salts"
          cmake --build build/allocator-consumer -j2
          ctest --test-dir build/allocator-consumer --no-tests=error --output-on-failure \
            --output-junit "$RUNNER_TEMP/allocator-evidence/installed.xml"
      - name: Check tracked source unchanged
        if: always()
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cstl-allocator-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          path: |
            ${{ runner.temp }}/allocator-evidence/
            build/linux-gcc-debug/compile_commands.json
            build/linux-gcc-debug/Testing/Temporary/
            build/allocator-consumer/Testing/Temporary/
