name: CNet A/A edit

on:
  push:
    branches:
      - perf/cnet-iocp-aa-noise-268
    paths:
      - .github/workflows/cnet-aa-edit.yml

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/cnet-iocp-aa-noise-268
      - name: Apply A/A benchmark patch
        run: |
          python3 .github/scripts/cnet_aa_edit.py
          git diff --check
          git diff -- cnet/benchmarks/cnet_io_benchmark.c
      - name: Commit A/A benchmark patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnet/benchmarks/cnet_io_benchmark.c
          git commit -m 'perf(cnet): add NativeIO direct A/A noise control'
          git push origin HEAD:perf/cnet-iocp-aa-noise-268
