name: CI consolidation task1 edit

on:
  push:
    branches:
      - ci/consolidate-canonical-workflows
    paths:
      - .github/workflows/ci-consolidate-task1-edit.yml

permissions:
  contents: read

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/consolidate-canonical-workflows
      - name: Apply Task 1 patch
        run: |
          set -euxo pipefail
          python3 .github/scripts/ci_consolidate_task1.py
          git diff --check
          git diff -- .github/workflows/cmeta.yml
      - name: Export patched workflow
        uses: actions/upload-artifact@v6
        with:
          name: cmeta-task1-patched
          path: .github/workflows/cmeta.yml
          if-no-files-found: error
          retention-days: 1
