name: CNet fixed-control GREEN1 edit

on:
  push:
    branches:
      - perf/cnet-fixed-control-attribution-270
    paths:
      - .github/workflows/cnet-fixed-control-green1-edit.yml

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/cnet-fixed-control-attribution-270
      - name: Apply composed client/dispatcher profile
        run: |
          python3 .github/scripts/cnet_fixed_control_green1_edit.py
          git diff --check
          git diff -- cnet/src/cnet_client_internal.h cnet/src/cnet_dispatcher.h cnet/src/cnet_dispatcher.c cnet/src/cnet_client.c cnet/tests/cnet_api_test.c cnet/benchmarks/cnet_io_benchmark.c
      - name: Commit composed profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnet/src/cnet_client_internal.h cnet/src/cnet_dispatcher.h cnet/src/cnet_dispatcher.c cnet/src/cnet_client.c cnet/tests/cnet_api_test.c cnet/benchmarks/cnet_io_benchmark.c
          git commit -m 'perf(cnet): compose client and dispatcher profile'
          git push origin HEAD:perf/cnet-fixed-control-attribution-270
