name: CNet direct-dispatch semantic RED edit

on:
  push:
    branches:
      - perf/cnet-dispatch-bypass-276
    paths:
      - .github/workflows/cnet-direct-dispatch-red2-edit.yml

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/cnet-dispatch-bypass-276
      - name: Add A1 semantic RED
        run: |
          python3 .github/scripts/cnet_direct_dispatch_red2_edit.py
          git diff --check
          git diff -- cnet/tests/cnet_api_test.c
      - name: Commit A1 semantic RED
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnet/tests/cnet_api_test.c
          git commit -m 'test(cnet): require real direct-dispatch semantics'
          git push origin HEAD:perf/cnet-dispatch-bypass-276
