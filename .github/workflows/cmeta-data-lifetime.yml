name: CMeta data lifetime

on:
  pull_request:
    paths:
      - "cmeta/**"
      - "utils/include/salts_cmeta_data.h"
      - "utils/src/salts_cmeta_data.c"
      - "utils/tests/test_salts_cmeta_data.c"
      - "utils/tests/salts_cmeta_data_peer.c"
      - "utils/tests/CMakeLists.txt"
      - ".github/workflows/cmeta-data-lifetime.yml"
  push:
    branches: [master]
    paths:
      - "cmeta/**"
      - "utils/include/salts_cmeta_data.h"
      - "utils/src/salts_cmeta_data.c"
      - "utils/tests/test_salts_cmeta_data.c"
      - "utils/tests/salts_cmeta_data_peer.c"
      - "utils/tests/CMakeLists.txt"
      - ".github/workflows/cmeta-data-lifetime.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: cmeta-data-lifetime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-sanitizers:
    name: Linux ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools

      - name: Install native build prerequisite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm

      - name: Configure focused sanitizer build
        shell: bash
        run: |
          set -euo pipefail
          sanitizer_flags="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cmake --preset linux-release-user \
            -DENABLE_TESTS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF \
            '-DVCPKG_INSTALL_OPTIONS=--only-binarycaching' \
            -DCMAKE_C_FLAGS="$sanitizer_flags" \
            -DCMAKE_CXX_FLAGS="$sanitizer_flags" \
            -DCMAKE_EXE_LINKER_FLAGS="$sanitizer_flags" \
            -DCMAKE_SHARED_LINKER_FLAGS="$sanitizer_flags"

      - name: Build and run owned-data lifetime contract
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          cmake --build --preset linux-release-user --parallel 2 --target \
            test_salts_cmeta_data
          ctest --test-dir build/linux-gcc-release \
            --no-tests=error \
            --output-on-failure \
            -R '^test_salts_cmeta_data$'

      - name: Source hygiene
        shell: bash
        run: git diff --check
