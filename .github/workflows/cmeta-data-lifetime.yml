name: CMeta data lifetime

on:
  pull_request:
    paths:
      - "cmeta/**"
      - "utils/include/salts_cmeta_data.h"
      - "utils/src/salts_cmeta_data.c"
      - "utils/tests/test_salts_cmeta_data.c"
      - "utils/tests/salts_cmeta_data_peer.c"
      - "utils/tests/CMakeLists.txt"
      - "cstl/include/cstl/typed.h"
      - "cstl/include/cstl/detail/typed_facade.h"
      - "cstl/tests/cstl_typed_decl_c.c"
      - "cstl/tests/cstl_typed_decl_cpp.cpp"
      - "cstl/tests/CMakeLists.txt"
      - "cstl/tests/fixtures/cmeta_lower/**"
      - "cstl/tests/verify_cmeta_lowering.cmake"
      - "cstl/tests/verify_cmeta_lower_rejection.cmake"
      - "tools/cmeta-lower/**"
      - "cmake/SaltsCMetaLower.cmake"
      - "plugin/include/salts/plugin.h"
      - "plugin/src/plugin.c"
      - "plugin/src/plugin_registry.c"
      - "plugin/tests/**"
      - ".github/workflows/cmeta-data-lifetime.yml"
  push:
    branches: [master]
    paths:
      - "cmeta/**"
      - "utils/include/salts_cmeta_data.h"
      - "utils/src/salts_cmeta_data.c"
      - "utils/tests/test_salts_cmeta_data.c"
      - "utils/tests/salts_cmeta_data_peer.c"
      - "utils/tests/CMakeLists.txt"
      - "cstl/include/cstl/typed.h"
      - "cstl/include/cstl/detail/typed_facade.h"
      - "cstl/tests/cstl_typed_decl_c.c"
      - "cstl/tests/cstl_typed_decl_cpp.cpp"
      - "cstl/tests/CMakeLists.txt"
      - "cstl/tests/fixtures/cmeta_lower/**"
      - "cstl/tests/verify_cmeta_lowering.cmake"
      - "cstl/tests/verify_cmeta_lower_rejection.cmake"
      - "tools/cmeta-lower/**"
      - "cmake/SaltsCMetaLower.cmake"
      - "plugin/include/salts/plugin.h"
      - "plugin/src/plugin.c"
      - "plugin/src/plugin_registry.c"
      - "plugin/tests/**"
      - ".github/workflows/cmeta-data-lifetime.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: cmeta-data-lifetime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-sanitizers:
    name: Linux ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools

      - name: Install native build prerequisite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm

      - name: Configure focused sanitizer build
        shell: bash
        run: |
          set -euo pipefail
          sanitizer_flags="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cmake --preset linux-release-user \
            -DENABLE_TESTS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF \
            '-DVCPKG_INSTALL_OPTIONS=--only-binarycaching' \
            -DCMAKE_C_FLAGS="$sanitizer_flags" \
            -DCMAKE_CXX_FLAGS="$sanitizer_flags" \
            -DCMAKE_EXE_LINKER_FLAGS="$sanitizer_flags" \
            -DCMAKE_SHARED_LINKER_FLAGS="$sanitizer_flags"

      - name: Build and run CMeta lifecycle, reflection, and Plugin contracts
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          cmake --build --preset linux-release-user --parallel 2 --target \
            test_salts_cmeta_data \
            cstl_typed_decl_cpp_test \
            cstl_typed_test \
            cstl_cmeta_lower_runtime \
            cmeta_core_test \
            cmeta_function_reflection_test \
            cmeta_function_header_test \
            cmeta_header_cpp_test \
            cmeta_interface_function_test \
            cmeta_method_test \
            cmeta_invokable_test \
            cmeta_object_test \
            cmeta_reflection_plugin_test \
            salts_plugin_contract_test \
            salts_plugin_loader_test
          ctest --test-dir build/linux-gcc-release \
            --no-tests=error \
            --output-on-failure \
            -R "^(test_salts_cmeta_data|cstl_typed_decl_cpp_test|cstl_typed_test|cstl_cmeta_lower_.*|cmeta_lower_version|cmeta_core_test|cmeta_function_reflection_test|cmeta_function_header_test|cmeta_header_cpp_test|cmeta_interface_function_test|cmeta_method_test|cmeta_invokable_test|cmeta_object_test|cmeta_reflection_plugin_test|salts_plugin_contract_test|salts_plugin_loader_test)$"

      - name: Source hygiene
        shell: bash
        run: git diff --check
