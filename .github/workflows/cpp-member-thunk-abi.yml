name: C++ member thunk ABI

on:
  pull_request:
    paths:
      - "bindings/cpp/include/salts/bindings/member.hpp"
      - "bindings/cpp/tests/**"
      - "bindings/cpp/CMakeLists.txt"
      - ".github/workflows/cpp-member-thunk-abi.yml"
  push:
    paths:
      - "bindings/cpp/include/salts/bindings/member.hpp"
      - "bindings/cpp/tests/**"
      - "bindings/cpp/CMakeLists.txt"
      - ".github/workflows/cpp-member-thunk-abi.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  clang-linux:
    name: Clang / Linux x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools

      - name: Install Clang
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang
          clang++ --version

      - name: Build canonical C support with shared cache
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset linux-release-user \
            -DENABLE_TESTS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DSALTS_BINDINGS_LUA=OFF \
            -DSALTS_BINDINGS_QUICKJS=OFF \
            '-DVCPKG_INSTALL_OPTIONS=--only-binarycaching'
          cmake --build --preset linux-release-user --parallel 2 \
            --target salts_cmeta tinytest
          test -f build/linux-gcc-release/lib/libsalts_cmeta.a
          test -f build/linux-gcc-release/lib/libtinytest.a

      - name: Compile and run member thunk with Clang
        shell: bash
        run: |
          set -euo pipefail
          clang++ \
            -std=c++17 -O2 -Wall -Wextra -Wpedantic \
            -Ibindings/cpp/include \
            -Icmeta/include \
            -Itinytest/include \
            bindings/cpp/tests/cpp_member_thunk_test.cpp \
            build/linux-gcc-release/lib/libsalts_cmeta.a \
            build/linux-gcc-release/lib/libtinytest.a \
            -pthread -ldl -lm \
            -o build/cpp-member-thunk-clang
          ./build/cpp-member-thunk-clang

  appleclang-macos:
    name: AppleClang / macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools

      - name: Configure AppleClang qualification
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_ARCH" in
            ARM64) triplet=arm64-osx ;;
            X64) triplet=x64-osx ;;
            *) echo "unsupported RUNNER_ARCH=$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          clang++ --version
          cmake -S . -B build/member-appleclang -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$QIGAO_VCPKG_TOOLCHAIN_FILE" \
            -DVCPKG_TARGET_TRIPLET="$triplet" \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed-member" \
            -DVCPKG_INSTALL_OPTIONS=--only-binarycaching \
            -DENABLE_TESTS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DSALTS_BINDINGS_LUA=OFF \
            -DSALTS_BINDINGS_QUICKJS=OFF

      - name: Build and run member thunk
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/member-appleclang --parallel 2 \
            --target salts_cpp_member_thunk_test
          ctest --test-dir build/member-appleclang \
            --output-on-failure \
            -R '^salts_cpp_member_thunk_test$'

  msvc-windows:
    name: MSVC / Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools

      - name: Configure MSVC qualification
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake -S . -B build/member-msvc -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:QIGAO_VCPKG_TOOLCHAIN_FILE" "-DVCPKG_TARGET_TRIPLET=x64-windows" "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE\vcpkg_installed-member" "-DVCPKG_INSTALL_OPTIONS=--only-binarycaching" "-DENABLE_TESTS=ON" "-DBUILD_TESTS=ON" "-DBUILD_BENCHMARKS=OFF" "-DBUILD_EXAMPLES=OFF" "-DSALTS_BINDINGS_LUA=OFF" "-DSALTS_BINDINGS_QUICKJS=OFF"

      - name: Build and run member thunk
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build/member-msvc --config Release --target salts_cpp_member_thunk_test --parallel 2
          ctest --test-dir build/member-msvc -C Release --output-on-failure -R '^salts_cpp_member_thunk_test$'
