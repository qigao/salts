name: Salts native SDK release
'on':
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact immutable release commit SHA
        required: true
        type: string
      tag:
        description: Existing immutable release tag
        required: true
        type: string
      ci_run_id:
        description: Successful Salts CI run with prepare_release enabled for this exact commit
        required: true
        type: string
permissions:
  contents: read
  packages: read
  actions: read
concurrency:
  group: salts-native-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release_sha: ${{ steps.version.outputs.release_sha }}
      release: ${{ steps.version.outputs.release }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read project version
        id: version
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "unsupported native package event: $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          release_sha="$RELEASE_SHA"
          requested_tag="$RELEASE_TAG"

          test -n "$release_sha"
          git cat-file -e "$release_sha^{commit}"

          version="$(
            git show "$release_sha:CMakeLists.txt" |
              awk '/^[[:space:]]*VERSION[[:space:]]+[0-9]/{print $2; exit}'
          )"
          test -n "$version"
          vcpkg_version="$(
            git show "$release_sha:vcpkg.json" |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["version-semver"])'
          )"
          if [ "$vcpkg_version" != "$version" ]; then
            echo "release version mismatch: CMake=$version vcpkg=$vcpkg_version" >&2
            exit 1
          fi

          expected_tag="v$version"
          if [ "$requested_tag" != "$expected_tag" ]; then
            echo "release tag mismatch: requested=$requested_tag expected=$expected_tag" >&2
            exit 1
          fi

          git fetch origin "refs/tags/$expected_tag:refs/tags/$expected_tag" --force
          tagged_commit="$(git rev-list -n 1 "$expected_tag")"
          if [ "$tagged_commit" != "$release_sha" ]; then
            echo "release tag $expected_tag resolves to $tagged_commit, not $release_sha" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$expected_tag" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Require a successful release preparation run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          case "$CI_RUN_ID" in ''|*[!0-9]*) echo "invalid CI run ID" >&2; exit 1 ;; esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/source-run.json"
          gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch > "$RUNNER_TEMP/default-branch.txt"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'source-run.json').read_text())
          branch = (Path(os.environ['RUNNER_TEMP']) / 'default-branch.txt').read_text().strip()
          expected = {'conclusion': 'success', 'status': 'completed', 'event': 'workflow_dispatch',
                      'path': '.github/workflows/ci.yml', 'head_sha': os.environ['RELEASE_SHA'], 'head_branch': branch}
          for key, value in expected.items():
              if run.get(key) != value:
                  raise SystemExit(f"CI run {key}: expected {value!r}, got {run.get(key)!r}")
          if run['head_repository']['full_name'] != os.environ['GITHUB_REPOSITORY']:
              raise SystemExit('CI artifacts must come from this repository')
          PY
  publish:
    name: Publish package and GitHub Release
    needs: metadata
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: salts-native-nuget
          path: dist
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Verify downloaded package identity
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_SHA: ${{ needs.metadata.outputs.release_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          package = Path('dist') / f'Salts.Native.{version}.nupkg'
          expected_rids = {'linux-x64', 'linux-arm64', 'windows-x64', 'macos-arm64',
                           'android-arm64-v8a', 'ios-arm64', 'ios-simulator-arm64'}
          with zipfile.ZipFile(package) as archive:
              manifests = [name for name in archive.namelist() if name.endswith('/salts-sdk-manifest.txt')]
              if {name.split('/')[1] for name in manifests} != expected_rids or len(manifests) != len(expected_rids):
                  raise SystemExit('Incomplete or unexpected SDK platform set')
              for name in manifests:
                  values = dict(line.split('=', 1) for line in archive.read(name).decode('utf-8-sig').splitlines() if '=' in line)
                  for key, expected in [('version', version), ('commit', os.environ['RELEASE_SHA']), ('profile', 'release')]:
                      if values.get(key) != expected:
                          raise SystemExit(f'{name}: {key} mismatch')
          PY
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Enforce immutable release identity
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_SHA: ${{ needs.metadata.outputs.release_sha }}
        run: |
          set -euo pipefail
          if existing_tag="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null)"; then
            if [ "$existing_tag" != "$RELEASE_SHA" ]; then
              echo "tag $TAG resolves to $existing_tag, not $RELEASE_SHA" >&2
              echo "bump the Salts project/package version before publishing a changed SDK" >&2
              exit 1
            fi
            echo "tag $TAG already resolves to this commit"
          else
            echo "required release tag $TAG does not exist" >&2
            exit 1
          fi
          if existing_release="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish 2>/dev/null)"; then
            if [ "$existing_release" != "$RELEASE_SHA" ] && [ "$existing_release" != "$TAG" ]; then
              echo "release $TAG targets $existing_release, not $RELEASE_SHA" >&2
              exit 1
            fi
            echo "release $TAG already exists for this release identity"
          fi
      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dotnet nuget add source --username qigao --password "$GITHUB_TOKEN" --store-password-in-clear-text --name github https://nuget.pkg.github.com/qigao/index.json
          dotnet nuget push "dist/Salts.Native.${{ needs.metadata.outputs.version }}.nupkg" --api-key "$GITHUB_TOKEN" --source github --skip-duplicate
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_SHA: ${{ needs.metadata.outputs.release_sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; package publish was idempotent"
            exit 0
          fi
          gh release create "$TAG" dist/*.nupkg --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Salts $VERSION" --generate-notes
