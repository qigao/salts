name: CMeta-CFlow calculus

on:
  pull_request:
    paths:
      - "cmeta/**"
      - "cstl/**"
      - "coroutine/**"
      - "concurrency/**"
      - "platform/**"
      - "CMakeOptions.cmake"
      - "utils/include/object_pool.h"
      - "utils/src/object_pool.c"
      - "utils/tests/test_object_pool.c"
      - "CMakeUserPresets.json"
      - "formal/cmeta_cflow_calculus/**"
      - "cmeta/include/cmeta/generated/builtin_signature_manifest.h"
      - "cmeta/include/cmeta/types.h"
      - "cmeta/include/cmeta/relations.h"
      - "cflow/include/cflow/generated/builtin_operator_policy.h"
      - "cflow/include/cflow/generated/machine_schema.h"
      - "cflow/include/cflow/operator_policy.h"
      - "cflow/include/cflow/function_projection.h"
      - "cflow/src/function_projection.c"
      - "cflow/tests/cflow_function_projection_test.c"
      - "cflow/src/adapters.c"
      - "cflow/tests/cflow_stream_terminal_test.c"
      - "cflow/CMakeLists.txt"
      - "cflow/include/cflow/executor.h"
      - "cflow/src/executor.c"
      - "cflow/src/executor_internal.h"
      - "cflow/tests/CMakeLists.txt"
      - "cflow/tests/cflow_execution_test.c"
      - "cflow/tests/cflow_executor_dso_fixture.c"
      - "cflow/tests/cflow_executor_dso_fixture.h"
      - "cflow/tests/cflow_executor_dso_test.c"
      - "cflow/tests/cflow_interface_reflection_test.c"
      - "cflow/tests/cflow_parallel_reduce_test.c"
      - ".github/workflows/cmeta-cflow-calculus.yml"
  push:
    branches: [master]
    paths:
      - "cmeta/**"
      - "cstl/**"
      - "coroutine/**"
      - "concurrency/**"
      - "platform/**"
      - "CMakeOptions.cmake"
      - "utils/include/object_pool.h"
      - "utils/src/object_pool.c"
      - "utils/tests/test_object_pool.c"
      - "CMakeUserPresets.json"
      - "formal/cmeta_cflow_calculus/**"
      - "cmeta/include/cmeta/generated/builtin_signature_manifest.h"
      - "cmeta/include/cmeta/types.h"
      - "cmeta/include/cmeta/relations.h"
      - "cflow/include/cflow/generated/builtin_operator_policy.h"
      - "cflow/include/cflow/generated/machine_schema.h"
      - "cflow/include/cflow/operator_policy.h"
      - "cflow/include/cflow/function_projection.h"
      - "cflow/src/function_projection.c"
      - "cflow/tests/cflow_function_projection_test.c"
      - "cflow/src/adapters.c"
      - "cflow/tests/cflow_stream_terminal_test.c"
      - "cflow/CMakeLists.txt"
      - "cflow/include/cflow/executor.h"
      - "cflow/src/executor.c"
      - "cflow/src/executor_internal.h"
      - "cflow/tests/CMakeLists.txt"
      - "cflow/tests/cflow_execution_test.c"
      - "cflow/tests/cflow_executor_dso_fixture.c"
      - "cflow/tests/cflow_executor_dso_fixture.h"
      - "cflow/tests/cflow_executor_dso_test.c"
      - "cflow/tests/cflow_interface_reflection_test.c"
      - "cflow/tests/cflow_parallel_reduce_test.c"
      - ".github/workflows/cmeta-cflow-calculus.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  coroutine:
    name: CMeta native fastpath, capabilities and manifests / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            runner: ubuntu-24.04
            family: unix
            preset: linux-release-ci
          - name: GCC ASan
            runner: ubuntu-24.04
            family: unix
            preset: linux-dev-ci
          - name: MSVC
            runner: windows-2025
            family: windows
            preset: win-release-ci
          - name: ClangCL
            runner: windows-2025
            family: windows
            preset: win-clang-release-ci
          - name: AppleClang
            runner: macos-15
            family: unix
            preset: mac-release-ci
    steps:
      - uses: actions/checkout@v7
      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools
      - name: Discover Visual Studio
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsInstall)) { throw "Visual Studio with the x64 C++ toolchain was not found" }
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
      - name: Configure, build and test Unix native fastpath and capability contracts
        if: matrix.family == 'unix'
        shell: bash
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cmake --preset "${{ matrix.preset }}" -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF -DSALTS_NATIVE_FASTPATH=ON -DCMETA_BUILD_BENCHMARKS=ON
          cmake --build --preset "${{ matrix.preset }}" --parallel 2 --target \
            cmeta_coroutine_facade_test cmeta_coroutine_header_cpp_test \
            salts_coro_executor_test salts_coro_executor_header_cpp_test \
            cmeta_capabilities_test cmeta_capabilities_header_cpp_test \
            cmeta_core_test cmeta_data_test cmeta_enum_bits_test cmeta_header_cpp_test platform_fastpath_test platform_fastpath_cpp_test cmeta_meta_header_test cmeta_fastpath_test cmeta_fastpath_cpp_test cmeta_fastpath_coroutine_test cmeta_fastpath_benchmark cmeta_function_reflection_test cmeta_abi_test cmeta_manifest_test cmeta_manifest_view_test cmeta_manifest_view_cpp_test cmeta_trace_test cmeta_trace_cpp_test cmeta_trace_benchmark
          ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure --timeout 60 -V \
            -R '^(platform_fastpath_|cmeta_meta_header_test$|cmeta_trace_|cmeta_fastpath_|cmeta_function_reflection_test$|cmeta_abi_test$|cmeta_coroutine|salts_coro_executor|cmeta_capabilities|cmeta_core_test$|cmeta_data_test$|cmeta_enum_bits_test$|cmeta_header_cpp_test$|cmeta_manifest_)'
      - name: Configure, build and test Windows native fastpath and capability contracts
        if: matrix.family == 'windows'
        shell: cmd
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          set "BUILD_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%BUILD_VCPKG_ROOT%"
          cmake --preset "${{ matrix.preset }}" -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF -DSALTS_NATIVE_FASTPATH=ON -DCMETA_BUILD_BENCHMARKS=ON
          if errorlevel 1 exit /b 1
          cmake --build --preset "${{ matrix.preset }}" --parallel 2 --target cmeta_coroutine_facade_test cmeta_coroutine_header_cpp_test salts_coro_executor_test salts_coro_executor_header_cpp_test cmeta_capabilities_test cmeta_capabilities_header_cpp_test cmeta_core_test cmeta_data_test cmeta_enum_bits_test cmeta_header_cpp_test platform_fastpath_test platform_fastpath_cpp_test cmeta_meta_header_test cmeta_fastpath_test cmeta_fastpath_cpp_test cmeta_fastpath_coroutine_test cmeta_fastpath_benchmark cmeta_function_reflection_test cmeta_abi_test cmeta_manifest_test cmeta_manifest_view_test cmeta_manifest_view_cpp_test cmeta_trace_test cmeta_trace_cpp_test cmeta_trace_benchmark cflow_execution_test cflow_interface_reflection_test cflow_executor_dso_test
          if errorlevel 1 exit /b 1
          ctest --preset "${{ matrix.preset }}" --no-tests=error --output-on-failure --timeout 60 -V -R "^(platform_fastpath_|cmeta_meta_header_test$|cmeta_trace_|cmeta_fastpath_|cmeta_function_reflection_test$|cmeta_abi_test$|cmeta_coroutine|salts_coro_executor|cmeta_capabilities|cmeta_core_test$|cmeta_data_test$|cmeta_enum_bits_test$|cmeta_header_cpp_test$|cmeta_manifest_|cflow_execution_test$|cflow_interface_reflection_test$|cflow_executor_dso_test$)"          if errorlevel 1 exit /b 1


  fastpath-reference-tsan:
    name: CMeta portable fastpath / GCC TSan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools
      - name: Configure and validate instrumented portable atomics
        shell: bash
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cmake --preset linux-dev-ci -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF \
            -DSALTS_NATIVE_FASTPATH=OFF -DENABLE_SANITIZER_ADDRESS=OFF -DENABLE_SANITIZER_THREAD=ON
          cmake --build --preset linux-dev-ci --parallel 2 --target \
            platform_fastpath_test platform_fastpath_cpp_test cmeta_meta_header_test cmeta_fastpath_test cmeta_fastpath_cpp_test cmeta_function_reflection_test cmeta_abi_test cmeta_trace_test cmeta_trace_cpp_test
          ctest --preset linux-dev-ci --no-tests=error --output-on-failure --timeout 60 \
            -R '^(platform_fastpath_|cmeta_meta_header_test$|cmeta_trace_|cmeta_fastpath_(test|cpp_test|.*compile_fail)$|cmeta_function_reflection_test$|cmeta_abi_test$)'

  cmeta:
    name: CMeta scope and execution / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            runner: ubuntu-24.04
            family: linux
            configure_preset: linux-release-ci
            build_preset: linux-release-ci
            build_dir: build/linux-gcc-release
          - name: GCC ASan
            runner: ubuntu-24.04
            family: linux
            configure_preset: linux-dev-ci
            build_preset: linux-dev-ci
            build_dir: build/linux-gcc-debug
          - name: GCC TSan
            runner: ubuntu-24.04
            family: linux
            configure_preset: linux-tsan-ci
            build_preset: linux-tsan-ci
            build_dir: build/linux-gcc-tsan
          - name: AppleClang
            runner: macos-15
            family: macos
            configure_preset: mac-release-ci
            build_preset: mac-release-ci
            build_dir: build/mac-clang-release
          - name: MSVC
            runner: windows-2025
            family: windows
            configure_preset: win-release-ci
            build_preset: win-release-ci
            build_dir: build/Msvc-Release
          - name: ClangCL
            runner: windows-2025
            family: windows
            configure_preset: win-clang-release-ci
            build_preset: win-clang-release-ci
            build_dir: build/Clang-Release
    steps:
      - uses: actions/checkout@v7

      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools

      - name: Install Linux native build prerequisite
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Discover Visual Studio
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw "vswhere is unavailable: $vswhere" }
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsInstall)) { throw "Visual Studio with the x64 C++ toolchain was not found" }
          "PROJECT_ROOT=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV

      - name: Configure and build POSIX CMeta contracts
        if: matrix.family != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          export PROJECT_ROOT="$GITHUB_WORKSPACE"
          cmake --preset "${{ matrix.configure_preset }}" \
            -DENABLE_TESTS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF \
            '-DVCPKG_INSTALL_OPTIONS=--only-binarycaching'
          cmake --build --preset "${{ matrix.build_preset }}" --parallel 2 --target cmeta_scope_test cmeta_execution_test cmeta_pool_cpp_test cmeta_collector_test concurrency_rcu_test concurrency_typed_primitives_test concurrency_typed_rcu_cpp_test concurrency_header_cpp_test platform_local_test platform_local_cpp_test platform_header_cpp_test platform_thread_test test_object_pool test_object_pool_managed test_object_pool_managed_cpp cflow_stream_terminal_test cstl_generic_identity_test cstl_semantic_projection_test cstl_typed_decl_cpp_test

      - name: Configure and build Windows CMeta contracts
        if: matrix.family == 'windows'
        shell: cmd
        run: |
          set "BUILD_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%BUILD_VCPKG_ROOT%"
          cmake --preset "${{ matrix.configure_preset }}" -DENABLE_TESTS=ON -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
          if errorlevel 1 exit /b 1
          cmake --build --preset "${{ matrix.build_preset }}" --parallel 2 --target cmeta_scope_test cmeta_execution_test cmeta_pool_cpp_test cmeta_collector_test concurrency_rcu_test concurrency_typed_primitives_test concurrency_typed_rcu_cpp_test concurrency_header_cpp_test platform_local_test platform_local_cpp_test platform_header_cpp_test platform_thread_test test_object_pool test_object_pool_managed test_object_pool_managed_cpp cflow_stream_terminal_test cstl_generic_identity_test cstl_semantic_projection_test cstl_typed_decl_cpp_test
          if errorlevel 1 exit /b 1

      - name: Run POSIX scope, execution and nested CSTL contracts
        if: matrix.family != 'windows'
        shell: bash
        run: ctest --preset "${{ matrix.configure_preset }}" --output-on-failure -R "^(cmeta_scope_|cmeta_execution_test$|cmeta_pool_cpp_test$|cmeta_collector_test$|concurrency_rcu_test$|concurrency_typed_primitives_test$|concurrency_typed_rcu_cpp_test$|concurrency_header_cpp_test$|platform_local_|platform_header_cpp_test$|platform_thread_test$|test_object_pool$|test_object_pool_managed|cflow_stream_terminal_test$|cstl_generic_identity_test$|cstl_semantic_projection_test$|cstl_typed_decl_cpp_test$)"

      - name: Run Windows scope, execution and nested CSTL contracts
        if: matrix.family == 'windows'
        shell: cmd
        run: |
          set "BUILD_VCPKG_ROOT=%VCPKG_ROOT%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%BUILD_VCPKG_ROOT%"
          ctest --preset "${{ matrix.configure_preset }}" --output-on-failure -R "^(cmeta_scope_|cmeta_execution_test$|cmeta_pool_cpp_test$|cmeta_collector_test$|concurrency_rcu_test$|concurrency_typed_primitives_test$|concurrency_typed_rcu_cpp_test$|concurrency_header_cpp_test$|platform_local_|platform_header_cpp_test$|platform_thread_test$|test_object_pool$|test_object_pool_managed|cflow_stream_terminal_test$|cstl_generic_identity_test$|cstl_semantic_projection_test$|cstl_typed_decl_cpp_test$)"

      - name: Source hygiene
        shell: bash
        run: git diff --check

  projection:
    name: CFlow reflected function projection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools

      - name: Install native build prerequisite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Configure focused CFlow build
        shell: bash
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cmake --preset linux-release-ci \
            -DENABLE_TESTS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF \
            '-DVCPKG_INSTALL_OPTIONS=--only-binarycaching'

      - name: Build and run reflected CFlow contracts
        shell: bash
        run: |
          set -euo pipefail
          cmake --build --preset linux-release-ci --parallel 2
          ctest --test-dir build/linux-gcc-release \
            --output-on-failure \
            -R '^(cflow_function_projection_test|cflow_execution_test|cflow_interface_reflection_test)$'

      - name: Source hygiene
        shell: bash
        run: git diff --check

      - name: Install package and run Reflection-only integration tests
        shell: bash
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cmake --install build/linux-gcc-release
          export CMETA_PACKAGE_ROOT="$PROJECT_ROOT/external/pkgs/salts/release"
          cd cmeta/tests/installed
          cmake --preset installed-linux-release
          cmake --build --preset installed-linux-release --parallel 2
          ctest --preset installed-linux-release

  lean:
    name: Lean build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: true
          lake-package-directory: formal/cmeta_cflow_calculus
      - name: Verify generated signature manifest
        working-directory: formal/cmeta_cflow_calculus
        run: >-
          lake exe cmeta-signature-gen --check
          ../../cmeta/include/cmeta/generated/builtin_signature_manifest.h
      - name: Verify generated CFlow operator policy
        working-directory: formal/cmeta_cflow_calculus
        run: >-
          lake exe cflow-operator-policy-gen --check
          ../../cflow/include/cflow/generated/builtin_operator_policy.h
      - name: Verify generated CFlow Machine schema
        working-directory: formal/cmeta_cflow_calculus
        run: >-
          lake exe cflow-machine-schema-gen --check
          ../../cflow/include/cflow/generated/machine_schema.h
