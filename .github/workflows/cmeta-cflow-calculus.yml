name: CMeta-CFlow calculus

on:
  pull_request:
    paths:
      - "cmeta/**"
      - "formal/cmeta_cflow_calculus/**"
      - "cmeta/include/cmeta/generated/builtin_signature_manifest.h"
      - "cmeta/include/cmeta/types.h"
      - "cmeta/include/cmeta/relations.h"
      - "cflow/include/cflow/generated/builtin_operator_policy.h"
      - "cflow/include/cflow/generated/machine_schema.h"
      - "cflow/include/cflow/operator_policy.h"
      - "cflow/include/cflow/function_projection.h"
      - "cflow/src/function_projection.c"
      - "cflow/tests/cflow_function_projection_test.c"
      - ".github/workflows/cmeta-cflow-calculus.yml"
  push:
    branches: [master]
    paths:
      - "cmeta/**"
      - "formal/cmeta_cflow_calculus/**"
      - "cmeta/include/cmeta/generated/builtin_signature_manifest.h"
      - "cmeta/include/cmeta/types.h"
      - "cmeta/include/cmeta/relations.h"
      - "cflow/include/cflow/generated/builtin_operator_policy.h"
      - "cflow/include/cflow/generated/machine_schema.h"
      - "cflow/include/cflow/operator_policy.h"
      - "cflow/include/cflow/function_projection.h"
      - "cflow/src/function_projection.c"
      - "cflow/tests/cflow_function_projection_test.c"
      - ".github/workflows/cmeta-cflow-calculus.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  cmeta:
    name: CMeta structured scope / ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            runner: ubuntu-24.04
            family: linux
            configure_preset: linux-release-user
            build_preset: linux-release-user
            build_dir: build/linux-gcc-release
          - name: MSVC
            runner: windows-2025
            family: windows
            configure_preset: win-release-user
            build_preset: win-release-user
            build_dir: build/Msvc-Release
          - name: ClangCL
            runner: windows-2025
            family: windows
            configure_preset: win-clang-release-user
            build_preset: win-clang-release-user
            build_dir: build/Clang-Release
    steps:
      - uses: actions/checkout@v7

      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools

      - name: Install Linux native build prerequisite
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Discover Visual Studio
        if: matrix.family == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw "vswhere is unavailable: $vswhere" }
          $vsInstall = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsInstall)) { throw "Visual Studio with the x64 C++ toolchain was not found" }
          "PROJECT_ROOT=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV

      - name: Configure and build Linux CMeta contracts
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset "${{ matrix.configure_preset }}" \
            -DENABLE_TESTS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF \
            '-DVCPKG_INSTALL_OPTIONS=--only-binarycaching'
          cmake --build --preset "${{ matrix.build_preset }}" --parallel 2

      - name: Configure and build Windows CMeta contracts
        if: matrix.family == 'windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          cmake --preset "${{ matrix.configure_preset }}" -DENABLE_TESTS=ON -DBUILD_TESTS=ON -DBUILD_BENCHMARKS=OFF -DBUILD_EXAMPLES=OFF
          if errorlevel 1 exit /b 1
          cmake --build --preset "${{ matrix.build_preset }}" --parallel 2
          if errorlevel 1 exit /b 1

      - name: Run structured scope contract
        shell: pwsh
        run: ctest --test-dir "${{ matrix.build_dir }}" --output-on-failure -R "^cmeta_scope_test$"

      - name: Source hygiene
        shell: bash
        run: git diff --check

  projection:
    name: CFlow reflected function projection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools

      - name: Install native build prerequisite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Configure focused CFlow build
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset linux-release-user \
            -DENABLE_TESTS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF \
            '-DVCPKG_INSTALL_OPTIONS=--only-binarycaching'

      - name: Build and run reflected projection contract
        shell: bash
        run: |
          set -euo pipefail
          cmake --build --preset linux-release-user --parallel 2
          ctest --test-dir build/linux-gcc-release \
            --output-on-failure \
            -R '^cflow_function_projection_test$'

      - name: Source hygiene
        shell: bash
        run: git diff --check

  lean:
    name: Lean build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          test: true
          lake-package-directory: formal/cmeta_cflow_calculus
      - name: Verify generated signature manifest
        working-directory: formal/cmeta_cflow_calculus
        run: >-
          lake exe cmeta-signature-gen --check
          ../../cmeta/include/cmeta/generated/builtin_signature_manifest.h
      - name: Verify generated CFlow operator policy
        working-directory: formal/cmeta_cflow_calculus
        run: >-
          lake exe cflow-operator-policy-gen --check
          ../../cflow/include/cflow/generated/builtin_operator_policy.h
      - name: Verify generated CFlow Machine schema
        working-directory: formal/cmeta_cflow_calculus
        run: >-
          lake exe cflow-machine-schema-gen --check
          ../../cflow/include/cflow/generated/machine_schema.h
