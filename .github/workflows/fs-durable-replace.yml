name: Durable FS replacement contract

on:
  push:
    branches:
      - master
    paths:
      - "utils/src/salts_fs.c"
      - "utils/include/salts_fs.h"
      - "utils/tests/test_salts_fs.c"
      - "utils/tests/test_salts_fs_replace_fault.c"
      - "utils/tests/salts_fs_fsync_fault.c"
      - "utils/tests/CMakeLists.txt"
      - ".github/workflows/fs-durable-replace.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fs-durable-replace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: FS durable replace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Linux tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm ninja-build pkg-config re2c
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Set up Windows tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install re2c nasm -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'host tool installation failed' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vs)) { throw 'x64 MSVC was not found' }
          "VSINSTALL=$vs" >> $env:GITHUB_ENV
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configure and run Linux contract
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/fs-contract -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/vcpkg_installed/fs-linux" \
            -DSALTS_ENABLE_EPOLL_READINESS=ON \
            2>&1 | tee fs-configure.log
          cmake --build build/fs-contract \
            --target test_salts_fs salts_fs_replace_fault_test salts_fs_fsync_fault \
            --parallel 4 2>&1 | tee fs-build.log
          ctest --test-dir build/fs-contract \
            -R '^test_salts_fs(_replace_(pre|post)_publish_fault)?$' \
            --verbose --no-tests=error 2>&1 | tee fs-ctest.log

      - name: Configure and run Windows contract
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake -S . -B build\fs-contract -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" ^
            -DVCPKG_TARGET_TRIPLET=x64-windows ^
            -DVCPKG_INSTALLED_DIR="%GITHUB_WORKSPACE%\vcpkg_installed\fs-windows" ^
            > fs-configure.log 2>&1
          if errorlevel 1 (type fs-configure.log & exit /b 1)
          cmake --build build\fs-contract --target test_salts_fs --parallel 4 > fs-build.log 2>&1
          if errorlevel 1 (type fs-build.log & exit /b 1)
          ctest --test-dir build\fs-contract -R "^test_salts_fs$" --verbose --no-tests=error > fs-ctest.log 2>&1
          if errorlevel 1 (type fs-ctest.log & exit /b 1)
          type fs-ctest.log

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-durable-replace-${{ matrix.os }}-${{ github.sha }}
          path: |
            fs-configure.log
            fs-build.log
            fs-ctest.log
          if-no-files-found: warn
