name: CFlow interface reflection

on:
  pull_request:
    paths:
      - "cflow/include/cflow/reactive.h"
      - "cflow/include/cflow/executor.h"
      - "cflow/include/cflow/scheduler.h"
      - "cflow/include/cflow/clock.h"
      - "cflow/src/interfaces.c"
      - "cflow/src/executor.c"
      - "cflow/src/scheduler.c"
      - "cflow/src/time.c"
      - "cflow/tests/cflow_interface_reflection_test.c"
      - "cflow/tests/cflow_tinymock_interface_test.c"
      - "cflow/tests/cflow_header_cpp_test.cpp"
      - "tinymock/include/tinymock_cmeta.h"
      - ".github/workflows/cflow-interface-reflection.yml"
  push:
    branches: [master]
    paths:
      - "cflow/include/cflow/reactive.h"
      - "cflow/include/cflow/executor.h"
      - "cflow/include/cflow/scheduler.h"
      - "cflow/include/cflow/clock.h"
      - "cflow/src/interfaces.c"
      - "cflow/src/executor.c"
      - "cflow/src/scheduler.c"
      - "cflow/src/time.c"
      - "cflow/tests/cflow_interface_reflection_test.c"
      - "cflow/tests/cflow_tinymock_interface_test.c"
      - "cflow/tests/cflow_header_cpp_test.cpp"
      - "tinymock/include/tinymock_cmeta.h"
      - ".github/workflows/cflow-interface-reflection.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: cflow-interface-reflection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interface-contract:
    name: CFlow interface contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up shared build dependencies
        uses: ./.github/actions/setup-re2c-tools

      - name: Install native build prerequisite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm

      - name: Configure focused CFlow build
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset linux-release-user \
            -DENABLE_TESTS=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCHMARKS=OFF \
            -DBUILD_EXAMPLES=OFF \
            '-DVCPKG_INSTALL_OPTIONS=--only-binarycaching'

      - name: Build and run interface contracts
        shell: bash
        run: |
          set -euo pipefail
          cmake --build --preset linux-release-user --parallel 2 --target \
            cflow_interface_reflection_test \
            cflow_tinymock_interface_test \
            cflow_header_cpp_test
          ctest --test-dir build/linux-gcc-release \
            --no-tests=error \
            --output-on-failure \
            -R '^(cflow_interface_reflection_test|cflow_tinymock_interface_test|cflow_header_cpp_test)$'

      - name: Reject legacy public CFlow interface rows
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn 'X\(I,[RVD][0-9]' \
              cflow/include/cflow/clock.h \
              cflow/include/cflow/reactive.h \
              cflow/include/cflow/executor.h \
              cflow/include/cflow/scheduler.h; then
            echo "public CFlow interfaces must use full F/FR/FV/FD reflection" >&2
            exit 1
          fi

      - name: Source hygiene
        shell: bash
        run: git diff --check
