name: CFlow release host benchmarks

on:
  pull_request:
    paths:
      - "cmeta/**"
      - "cflow/**"
      - "turbostl/**"
      - "concurrency/**"
      - "platform/**"
      - "tinytest/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "cmake/**"
      - "presets/**"
      - "vcpkg.json"
      - "vcpkg-ports/**"
      - ".github/workflows/cflow-release-benchmarks.yml"
  push:
    branches: [master]
    paths:
      - "cmeta/**"
      - "cflow/**"
      - "turbostl/**"
      - "concurrency/**"
      - "platform/**"
      - "tinytest/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - "cmake/**"
      - "presets/**"
      - "vcpkg.json"
      - "vcpkg-ports/**"
      - ".github/workflows/cflow-release-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cflow-release-benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCHMARK_RUNS: 5

jobs:
  benchmark:
    name: ${{ matrix.host }} Release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-22.04-gcc
            runner: ubuntu-22.04
            family: linux
            configure_preset: linux-release-user
            build_preset: linux-release-user
            build_dir: build/linux-gcc-release
            executable: build/linux-gcc-release/bin/cflow_direct_benchmark
            parallel_executable: build/linux-gcc-release/bin/cflow_parallel_reduce_benchmark
            network_executable: build/linux-gcc-release/bin/cflow_network_benchmark
            network_backend: epoll
          - host: ubuntu-24.04-gcc
            runner: ubuntu-24.04
            family: linux
            configure_preset: linux-release-user
            build_preset: linux-release-user
            build_dir: build/linux-gcc-release
            executable: build/linux-gcc-release/bin/cflow_direct_benchmark
            parallel_executable: build/linux-gcc-release/bin/cflow_parallel_reduce_benchmark
            network_executable: build/linux-gcc-release/bin/cflow_network_benchmark
            network_backend: epoll
          - host: ubuntu-24.04-gcc-io-uring
            runner: ubuntu-24.04
            family: linux
            configure_preset: linux-release-user
            build_preset: linux-release-user
            build_dir: build/linux-gcc-release
            executable: build/linux-gcc-release/bin/cflow_direct_benchmark
            parallel_executable: build/linux-gcc-release/bin/cflow_parallel_reduce_benchmark
            network_executable: build/linux-gcc-release/bin/cflow_network_benchmark
            network_backend: io_uring
          - host: ubuntu-24.04-gcc-poll
            runner: ubuntu-24.04
            family: linux
            configure_preset: linux-release-user
            build_preset: linux-release-user
            build_dir: build/linux-gcc-release
            executable: build/linux-gcc-release/bin/cflow_direct_benchmark
            parallel_executable: build/linux-gcc-release/bin/cflow_parallel_reduce_benchmark
            network_executable: build/linux-gcc-release/bin/cflow_network_benchmark
            network_backend: poll
          - host: windows-2022-msvc
            runner: windows-2022
            family: windows
            configure_preset: win-release-user
            build_preset: win-release-user
            build_dir: build/Msvc-Release
            executable: build/Msvc-Release/bin/cflow_direct_benchmark.exe
            parallel_executable: build/Msvc-Release/bin/cflow_parallel_reduce_benchmark.exe
            network_executable: build/Msvc-Release/bin/cflow_network_benchmark.exe
            network_backend: iocp
          - host: windows-2025-msvc
            runner: windows-2025
            family: windows
            configure_preset: win-release-user
            build_preset: win-release-user
            build_dir: build/Msvc-Release
            executable: build/Msvc-Release/bin/cflow_direct_benchmark.exe
            parallel_executable: build/Msvc-Release/bin/cflow_parallel_reduce_benchmark.exe
            network_executable: build/Msvc-Release/bin/cflow_network_benchmark.exe
            network_backend: iocp
          - host: macos-15-appleclang
            runner: macos-15
            family: mac
            configure_preset: release-mac-ninja
            build_preset: build-default-mac
            build_dir: build/mac-clang-release
            executable: build/mac-clang-release/bin/cflow_direct_benchmark
            parallel_executable: build/mac-clang-release/bin/cflow_parallel_reduce_benchmark
            network_executable: build/mac-clang-release/bin/cflow_network_benchmark
            network_backend: kqueue

    steps:
      - uses: actions/checkout@v6

      - name: Setup Linux dependencies
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build re2c
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          else
            VCPKG_BIN="$(readlink -f "$(command -v vcpkg)")"
            echo "VCPKG_ROOT=$(dirname "$VCPKG_BIN")" >> "$GITHUB_ENV"
          fi

      - name: Setup Windows dependencies
        if: matrix.family == 'windows'
        shell: powershell
        run: choco install re2c -y --no-progress

      - name: Setup macOS dependencies
        if: matrix.family == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          brew install re2c
          if [ -n "${VCPKG_ROOT:-}" ] &&
             [ -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            true
          elif [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] &&
               [ -f "$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          elif [ -f "$(brew --prefix)/share/vcpkg/scripts/buildsystems/vcpkg.cmake" ]; then
            echo "VCPKG_ROOT=$(brew --prefix)/share/vcpkg" >> "$GITHUB_ENV"
          else
            echo "A valid VCPKG_ROOT is unavailable" >&2
            exit 1
          fi

      - name: Configure and build Linux Release benchmark
        if: matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset "${{ matrix.configure_preset }}" \
            -DBUILD_BENCHMARKS=ON \
            -DBUILD_TESTS=ON
          cmake --build --preset "${{ matrix.build_preset }}" \
            --target cflow_direct_benchmark cflow_parallel_reduce_benchmark \
              cflow_network_benchmark cflow_io_native_test
          ctest --test-dir "${{ matrix.build_dir }}" \
            -R '^cflow_io_native_test$' --output-on-failure

      - name: Configure and build Windows Release benchmark
        if: matrix.family == 'windows'
        shell: cmd
        run: |
          set "PROJECT_ROOT=%GITHUB_WORKSPACE%"
          if defined VCPKG_INSTALLATION_ROOT set "VCPKG_ROOT=%VCPKG_INSTALLATION_ROOT%"
          if not defined VCPKG_ROOT exit /b 1

          for /f "usebackq tokens=*" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1

          cmake --preset "${{ matrix.configure_preset }}" -DBUILD_BENCHMARKS=ON -DBUILD_TESTS=ON
          if errorlevel 1 exit /b 1
          cmake --build --preset "${{ matrix.build_preset }}" --target cflow_direct_benchmark cflow_parallel_reduce_benchmark cflow_network_benchmark cflow_io_native_test
          if errorlevel 1 exit /b 1
          ctest --test-dir "${{ matrix.build_dir }}" -R "^cflow_io_native_test$" --output-on-failure
          if errorlevel 1 exit /b 1

      - name: Configure and build macOS Release benchmark
        if: matrix.family == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset "${{ matrix.configure_preset }}" \
            -DBUILD_BENCHMARKS=ON \
            -DBUILD_TESTS=ON
          cmake --build --preset "${{ matrix.build_preset }}" \
            --target cflow_direct_benchmark cflow_parallel_reduce_benchmark \
              cflow_network_benchmark cflow_io_native_test
          ctest --test-dir "${{ matrix.build_dir }}" \
            -R '^cflow_io_native_test$' --output-on-failure

      - name: Capture environment and run benchmark
        shell: pwsh
        env:
          BENCHMARK_HOST: ${{ matrix.host }}
          BENCHMARK_PRESET: ${{ matrix.configure_preset }}
          BENCHMARK_BUILD_DIR: ${{ matrix.build_dir }}
          BENCHMARK_EXECUTABLE: ${{ matrix.executable }}
          PARALLEL_BENCHMARK_EXECUTABLE: ${{ matrix.parallel_executable }}
          NETWORK_BENCHMARK_EXECUTABLE: ${{ matrix.network_executable }}
          CFLOW_NETWORK_BACKEND: ${{ matrix.network_backend }}
          NETWORK_EXPECTED_BACKEND: ${{ matrix.network_backend }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "benchmark-results"
          $buildDir = Join-Path $env:GITHUB_WORKSPACE $env:BENCHMARK_BUILD_DIR
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:BENCHMARK_EXECUTABLE
          $parallelBenchmark = Join-Path $env:GITHUB_WORKSPACE $env:PARALLEL_BENCHMARK_EXECUTABLE
          $networkBenchmark = Join-Path $env:GITHUB_WORKSPACE $env:NETWORK_BENCHMARK_EXECUTABLE
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null

          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "Benchmark executable not found: $benchmark"
          }
          if (-not (Test-Path -LiteralPath $parallelBenchmark -PathType Leaf)) {
            throw "Benchmark executable not found: $parallelBenchmark"
          }
          if (-not (Test-Path -LiteralPath $networkBenchmark -PathType Leaf)) {
            throw "Benchmark executable not found: $networkBenchmark"
          }
          if ($env:BENCHMARK_RUNS -notmatch '^[1-9][0-9]*$') {
            throw "BENCHMARK_RUNS must be a positive integer"
          }

          @(
            "host=$env:BENCHMARK_HOST"
            "preset=$env:BENCHMARK_PRESET"
            "commit=$env:GITHUB_SHA"
            "runner_os=$env:RUNNER_OS"
            "runner_arch=$env:RUNNER_ARCH"
            "runner_name=$env:RUNNER_NAME"
            "image_os=$env:ImageOS"
            "image_version=$env:ImageVersion"
            "benchmark_runs=$env:BENCHMARK_RUNS"
          ) | Set-Content -LiteralPath (Join-Path $resultDir "metadata.txt")

          $networkDir = Join-Path $resultDir "network"
          New-Item -ItemType Directory -Force -Path $networkDir | Out-Null
          $networkJsonl = Join-Path $networkDir "network-results.jsonl"
          $networkSummary = Join-Path $networkDir "network-summary.md"
          "| Run | Protocol | Profile | Backend | Wait mode | P50 ns | P95 ns | P99 ns | MiB/s | CPU % | CPU cores | MiB/CPU-s | Peak RSS bytes |" |
            Set-Content -LiteralPath $networkSummary
          "| ---: | :--- | :--- | :--- | :--- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |" |
            Add-Content -LiteralPath $networkSummary
          $dualNativeDir = Join-Path $networkDir "dual-native"
          New-Item -ItemType Directory -Force -Path $dualNativeDir | Out-Null
          $dualNativeJsonl = Join-Path $dualNativeDir "dual-native-results.jsonl"
          $dualNativeSummary = Join-Path $dualNativeDir "dual-native-summary.md"
          $dualNativeMedianSummary = Join-Path $dualNativeDir "dual-native-medians.md"
          "| Run | Protocol | Backend | Wait mode | Payload bytes | Echo/s | MiB/s | P99 ns | CPU % | CPU cores | MiB/CPU-s | Peak RSS bytes |" |
            Set-Content -LiteralPath $dualNativeSummary
          "| ---: | :--- | :--- | :--- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |" |
            Add-Content -LiteralPath $dualNativeSummary
          $runSourceComparison = $env:BENCHMARK_HOST -eq "ubuntu-22.04-gcc"
          $sourceDir = Join-Path $networkDir "reactive-source"
          $sourceJsonl = Join-Path $sourceDir "reactive-source-results.jsonl"
          $sourceSummary = Join-Path $sourceDir "reactive-source-summary.md"
          $sourceMedianSummary = Join-Path $sourceDir "reactive-source-medians.md"
          if ($runSourceComparison) {
            New-Item -ItemType Directory -Force -Path $sourceDir | Out-Null
            "| Run | Driver | Wait mode | P50 ns | P99 ns | CPU % | IO operations | Admission mean ns | Completion/drive mean ns |" |
              Set-Content -LiteralPath $sourceSummary
            "| ---: | :--- | :--- | ---: | ---: | ---: | ---: | ---: | ---: |" |
              Add-Content -LiteralPath $sourceSummary
          }

          function Assert-NetworkMetricFields($report, $jsonText) {
            foreach ($field in @(
                "backend", "driver", "stage_timing", "wall_ns", "process_cpu_ns", "process_cpu_pct",
                "cpu_core_equivalents", "exchanges_per_second",
                "application_mib_per_second", "application_mib_per_cpu_second",
                "peak_rss_bytes", "p50_ns", "p95_ns", "p99_ns", "errors",
                "rejections", "stale_completions", "io_operations", "admission_ns",
                "completion_drive_ns", "admission_mean_ns", "completion_drive_mean_ns")) {
              if ($null -eq $report.$field) {
                throw "Missing network report field '$field': $jsonText"
              }
            }
            $cpuPct = [double]$report.process_cpu_pct
            $cpuCores = [double]$report.cpu_core_equivalents
            $throughput = [double]$report.application_mib_per_second
            $cpuEfficiency = [double]$report.application_mib_per_cpu_second
            $echoRate = [double]$report.exchanges_per_second
            if ($report.backend -ne $env:NETWORK_EXPECTED_BACKEND -or
                [int64]$report.wall_ns -le 0 -or
                [int64]$report.process_cpu_ns -lt 0 -or
                [int64]$report.peak_rss_bytes -le 0 -or
                [int64]$report.p50_ns -lt 0 -or
                [int64]$report.p95_ns -lt [int64]$report.p50_ns -or
                [int64]$report.p99_ns -lt [int64]$report.p95_ns -or
                [int64]$report.p99_ns -le 0 -or
                [double]::IsNaN($cpuPct) -or
                [double]::IsInfinity($cpuPct) -or
                $cpuPct -lt 0.0 -or
                [double]::IsNaN($cpuCores) -or
                [double]::IsInfinity($cpuCores) -or
                $cpuCores -lt 0.0 -or
                [double]::IsNaN($echoRate) -or
                [double]::IsInfinity($echoRate) -or
                $echoRate -le 0.0 -or
                [double]::IsNaN($throughput) -or
                [double]::IsInfinity($throughput) -or
                $throughput -le 0.0 -or
                [double]::IsNaN($cpuEfficiency) -or
                [double]::IsInfinity($cpuEfficiency) -or
                $cpuEfficiency -lt 0.0) {
              throw "Invalid network metric fields: $jsonText"
            }
          }

          git show --no-patch --format=fuller HEAD |
            Set-Content -LiteralPath (Join-Path $resultDir "commit.txt")
          Copy-Item -LiteralPath (Join-Path $buildDir "CMakeCache.txt") -Destination $resultDir
          $compilerConfig = Get-ChildItem -LiteralPath (Join-Path $buildDir "CMakeFiles") `
            -Filter "CMakeCCompiler.cmake" -File -Recurse | Select-Object -First 1
          if ($null -eq $compilerConfig) {
            throw "C compiler configuration was not generated under: $buildDir"
          }
          Copy-Item -LiteralPath $compilerConfig.FullName `
            -Destination (Join-Path $resultDir "CMakeCCompiler.cmake")

          if ($IsWindows) {
            Get-CimInstance Win32_OperatingSystem |
              Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List |
              Out-File -LiteralPath (Join-Path $resultDir "operating-system.txt")
            Get-CimInstance Win32_Processor |
              Select-Object Name, Manufacturer, NumberOfCores, NumberOfLogicalProcessors, `
                MaxClockSpeed | Format-List |
              Out-File -LiteralPath (Join-Path $resultDir "cpu.txt")
          } elseif ($IsMacOS) {
            uname -a | Out-File -LiteralPath (Join-Path $resultDir "operating-system.txt")
            sw_vers | Add-Content -LiteralPath (Join-Path $resultDir "operating-system.txt")
            sysctl -a | Out-File -LiteralPath (Join-Path $resultDir "cpu.txt")
          } else {
            uname -a | Out-File -LiteralPath (Join-Path $resultDir "operating-system.txt")
            Get-Content -LiteralPath "/etc/os-release" |
              Add-Content -LiteralPath (Join-Path $resultDir "operating-system.txt")
            lscpu | Out-File -LiteralPath (Join-Path $resultDir "cpu.txt")
          }

          $env:CFLOW_NETWORK_DRIVER = "actor"
          $env:CFLOW_NETWORK_STAGE_TIMING = "0"
          for ($run = 1; $run -le [int]$env:BENCHMARK_RUNS; ++$run) {
            $runFile = Join-Path $resultDir ("run-direct-{0:D2}.txt" -f $run)
            & $benchmark 2>&1 | Tee-Object -FilePath $runFile
            if ($LASTEXITCODE -ne 0) {
              throw "Direct benchmark run $run failed with exit code $LASTEXITCODE"
            }
            $parallelRunFile = Join-Path $resultDir ("run-parallel-reduce-{0:D2}.txt" -f $run)
            & $parallelBenchmark 2>&1 | Tee-Object -FilePath $parallelRunFile
            if ($LASTEXITCODE -ne 0) {
              throw "Parallel Reduce benchmark run $run failed with exit code $LASTEXITCODE"
            }
            $env:CFLOW_NETWORK_PEER = "raw"
            Remove-Item Env:CFLOW_NETWORK_PAYLOAD -ErrorAction SilentlyContinue
            foreach ($protocol in @("tcp", "udp")) {
              foreach ($profile in @("latency", "throughput")) {
                foreach ($waitMode in @("blocking", "busy")) {
                  $env:CFLOW_NETWORK_PROTOCOL = $protocol
                  $env:CFLOW_NETWORK_PROFILE = $profile
                  $env:CFLOW_NETWORK_WAIT_MODE = $waitMode
                  $networkRunFile = Join-Path $networkDir `
                    ("run-{0}-{1}-{2}-{3:D2}.txt" -f `
                      $protocol, $profile, $waitMode, $run)
                  & $networkBenchmark --no-color 2>&1 |
                    Tee-Object -FilePath $networkRunFile
                  if ($LASTEXITCODE -ne 0) {
                    throw "Network benchmark $protocol/$profile/$waitMode run $run failed with exit code $LASTEXITCODE"
                  }
                  $jsonLines = @(Get-Content -LiteralPath $networkRunFile |
                    Where-Object { $_ -match '^CFLOW_BENCHMARK_JSON ' })
                  if ($jsonLines.Count -ne 1) {
                    throw "Expected exactly one network JSON record, found $($jsonLines.Count): $networkRunFile"
                  }
                  $jsonText = $jsonLines[0].Substring("CFLOW_BENCHMARK_JSON ".Length)
                  $report = $jsonText | ConvertFrom-Json
                  Assert-NetworkMetricFields $report $jsonText
                  $cpuCores = [double]$report.cpu_core_equivalents
                  $throughput = [double]$report.application_mib_per_second
                  $cpuEfficiency = [double]$report.application_mib_per_cpu_second
                  if ($report.schema -ne "cflow-network-benchmark/v1" -or
                      $report.protocol -ne $protocol -or
                      $report.profile -ne $profile -or
                      $report.wait_mode -ne $waitMode -or
                      $report.peer_mode -ne "raw" -or
                      $report.driver -ne "actor" -or
                      [bool]$report.stage_timing -or
                      [int64]$report.io_operations -ne 0 -or
                      [int64]$report.admission_ns -ne 0 -or
                      [int64]$report.completion_drive_ns -ne 0 -or
                      [double]::IsNaN($cpuCores) -or
                      [double]::IsInfinity($cpuCores) -or
                      $cpuCores -lt 0.0 -or
                      [double]::IsNaN($throughput) -or
                      [double]::IsInfinity($throughput) -or
                      $throughput -lt 0.0 -or
                      [double]::IsNaN($cpuEfficiency) -or
                      [double]::IsInfinity($cpuEfficiency) -or
                      $cpuEfficiency -lt 0.0 -or
                      [int64]$report.errors -ne 0 -or
                      [int64]$report.rejections -ne 0 -or
                      [int64]$report.stale_completions -ne 0 -or
                      [int64]$report.attempted -le 0) {
                    throw "Invalid or unsuccessful network report: $jsonText"
                  }
                  Add-Content -LiteralPath $networkJsonl -Value $jsonText
                  Add-Content -LiteralPath $networkSummary -Value `
                    ("| {0} | {1} | {2} | {3} | {4} | {5} | {6} | {7} | {8:N3} | {9:N3} | {10:N3} | {11:N3} | {12} |" -f `
                      $run, $report.protocol, $report.profile, $report.backend,
                      $report.wait_mode, $report.p50_ns, $report.p95_ns,
                      $report.p99_ns, $throughput,
                      [double]$report.process_cpu_pct, $cpuCores,
                      $cpuEfficiency, $report.peak_rss_bytes)
                }
              }
            }
            if ($runSourceComparison) {
              $env:CFLOW_NETWORK_PROTOCOL = "tcp"
              $env:CFLOW_NETWORK_PROFILE = "latency"
              $env:CFLOW_NETWORK_PEER = "raw"
              $env:CFLOW_NETWORK_STAGE_TIMING = "1"
              Remove-Item Env:CFLOW_NETWORK_PAYLOAD -ErrorAction SilentlyContinue
              foreach ($waitMode in @("blocking", "busy")) {
                $env:CFLOW_NETWORK_WAIT_MODE = $waitMode
                foreach ($driver in @("actor", "source")) {
                  $env:CFLOW_NETWORK_DRIVER = $driver
                  $sourceRunFile = Join-Path $sourceDir `
                    ("run-tcp-latency-{0}-{1}-{2:D2}.txt" -f $driver, $waitMode, $run)
                  & $networkBenchmark --no-color 2>&1 |
                    Tee-Object -FilePath $sourceRunFile
                  if ($LASTEXITCODE -ne 0) {
                    throw "Diagnostic $driver TCP/latency/$waitMode run $run failed with exit code $LASTEXITCODE"
                  }
                  $jsonLines = @(Get-Content -LiteralPath $sourceRunFile |
                    Where-Object { $_ -match '^CFLOW_BENCHMARK_JSON ' })
                  if ($jsonLines.Count -ne 1) {
                    throw "Expected exactly one diagnostic JSON record, found $($jsonLines.Count): $sourceRunFile"
                  }
                  $jsonText = $jsonLines[0].Substring("CFLOW_BENCHMARK_JSON ".Length)
                  $report = $jsonText | ConvertFrom-Json
                  Assert-NetworkMetricFields $report $jsonText
                  $expectedAttempts =
                    [int64]$report.samples * [int64]$report.exchanges_per_sample
                  $admissionMean = [double]$report.admission_mean_ns
                  $completionDriveMean = [double]$report.completion_drive_mean_ns
                  if ($report.schema -ne "cflow-network-benchmark/v1" -or
                      $report.protocol -ne "tcp" -or
                      $report.profile -ne "latency" -or
                      $report.wait_mode -ne $waitMode -or
                      $report.peer_mode -ne "raw" -or
                      $report.driver -ne $driver -or
                      -not [bool]$report.stage_timing -or
                      [int64]$report.attempted -ne $expectedAttempts -or
                      [int64]$report.io_operations -lt (2 * $expectedAttempts) -or
                      [int64]$report.admission_ns -le 0 -or
                      [int64]$report.completion_drive_ns -le 0 -or
                      [double]::IsNaN($admissionMean) -or
                      [double]::IsInfinity($admissionMean) -or
                      $admissionMean -le 0.0 -or
                      [double]::IsNaN($completionDriveMean) -or
                      [double]::IsInfinity($completionDriveMean) -or
                      $completionDriveMean -le 0.0 -or
                      [int64]$report.errors -ne 0 -or
                      [int64]$report.rejections -ne 0 -or
                      [int64]$report.stale_completions -ne 0) {
                    throw "Invalid or unsuccessful diagnostic report: $jsonText"
                  }
                  Add-Content -LiteralPath $sourceJsonl -Value $jsonText
                  Add-Content -LiteralPath $sourceSummary -Value `
                    ("| {0} | {1} | {2} | {3} | {4} | {5:N3} | {6} | {7:N3} | {8:N3} |" -f `
                      $run, $report.driver, $report.wait_mode, $report.p50_ns, $report.p99_ns,
                      [double]$report.process_cpu_pct, $report.io_operations,
                      $admissionMean, $completionDriveMean)
                }
              }
              $env:CFLOW_NETWORK_DRIVER = "actor"
              $env:CFLOW_NETWORK_STAGE_TIMING = "0"
            }
            $nativePayloads = @{
              tcp = @(1024, 4096, 65536)
              udp = @(1024, 4096, 8192)
            }
            foreach ($protocol in @("tcp", "udp")) {
              foreach ($payloadBytes in $nativePayloads[$protocol]) {
                foreach ($waitMode in @("blocking", "busy")) {
                  $env:CFLOW_NETWORK_PROTOCOL = $protocol
                  $env:CFLOW_NETWORK_PROFILE = "throughput"
                  $env:CFLOW_NETWORK_WAIT_MODE = $waitMode
                  $env:CFLOW_NETWORK_PEER = "native"
                  $env:CFLOW_NETWORK_PAYLOAD = $payloadBytes.ToString()
                  $networkRunFile = Join-Path $dualNativeDir `
                    ("run-{0}-throughput-{1}-{2}-{3:D2}.txt" -f `
                      $protocol, $waitMode, $payloadBytes, $run)
                  & $networkBenchmark --no-color 2>&1 |
                    Tee-Object -FilePath $networkRunFile
                  if ($LASTEXITCODE -ne 0) {
                    throw "Dual-native $protocol benchmark $waitMode/$payloadBytes run $run failed with exit code $LASTEXITCODE"
                  }
                  $jsonLines = @(Get-Content -LiteralPath $networkRunFile |
                    Where-Object { $_ -match '^CFLOW_BENCHMARK_JSON ' })
                  if ($jsonLines.Count -ne 1) {
                    throw "Expected exactly one dual-native JSON record, found $($jsonLines.Count): $networkRunFile"
                  }
                  $jsonText = $jsonLines[0].Substring("CFLOW_BENCHMARK_JSON ".Length)
                  $report = $jsonText | ConvertFrom-Json
                  Assert-NetworkMetricFields $report $jsonText
                  $cpuCores = [double]$report.cpu_core_equivalents
                  $throughput = [double]$report.application_mib_per_second
                  $cpuEfficiency = [double]$report.application_mib_per_cpu_second
                  $echoRate = [double]$report.exchanges_per_second
                  $expectedAttempts =
                    [int64]$report.samples * [int64]$report.exchanges_per_sample
                  $expectedApplicationBytes =
                    $expectedAttempts * [int64]$payloadBytes
                  if ($report.schema -ne "cflow-network-benchmark/v1" -or
                      $report.protocol -ne $protocol -or
                      $report.profile -ne "throughput" -or
                      $report.wait_mode -ne $waitMode -or
                      $report.peer_mode -ne "dual-native" -or
                      $report.driver -ne "actor" -or
                      [bool]$report.stage_timing -or
                      [int64]$report.io_operations -ne 0 -or
                      [int64]$report.payload_bytes -ne $payloadBytes -or
                      [int64]$report.attempted -ne $expectedAttempts -or
                      [int64]$report.application_bytes -ne $expectedApplicationBytes -or
                      [int64]$report.wire_bytes -ne (2 * $expectedApplicationBytes) -or
                      [double]::IsNaN($echoRate) -or
                      [double]::IsInfinity($echoRate) -or
                      $echoRate -le 0.0 -or
                      [double]::IsNaN($cpuCores) -or
                      [double]::IsInfinity($cpuCores) -or
                      $cpuCores -lt 0.0 -or
                      [double]::IsNaN($throughput) -or
                      [double]::IsInfinity($throughput) -or
                      $throughput -le 0.0 -or
                      [double]::IsNaN($cpuEfficiency) -or
                      [double]::IsInfinity($cpuEfficiency) -or
                      $cpuEfficiency -lt 0.0 -or
                      [int64]$report.errors -ne 0 -or
                      [int64]$report.rejections -ne 0 -or
                      [int64]$report.stale_completions -ne 0 -or
                      $expectedAttempts -le 0) {
                    throw "Invalid or unsuccessful dual-native report: $jsonText"
                  }
                  Add-Content -LiteralPath $dualNativeJsonl -Value $jsonText
                  Add-Content -LiteralPath $dualNativeSummary -Value `
                    ("| {0} | {1} | {2} | {3} | {4} | {5:N3} | {6:N3} | {7} | {8:N3} | {9:N3} | {10:N3} | {11} |" -f `
                      $run, $report.protocol, $report.backend,
                      $report.wait_mode, $report.payload_bytes,
                      $echoRate, $throughput, $report.p99_ns,
                      [double]$report.process_cpu_pct, $cpuCores,
                      $cpuEfficiency, $report.peak_rss_bytes)
                }
              }
            }
          }

          Remove-Item Env:CFLOW_NETWORK_PAYLOAD -ErrorAction SilentlyContinue
          Remove-Item Env:CFLOW_NETWORK_PEER -ErrorAction SilentlyContinue
          Remove-Item Env:CFLOW_NETWORK_DRIVER -ErrorAction SilentlyContinue
          Remove-Item Env:CFLOW_NETWORK_STAGE_TIMING -ErrorAction SilentlyContinue

          function Get-Median([double[]]$values) {
            $ordered = @($values | Sort-Object)
            if ($ordered.Count -eq 0) {
              throw "Cannot calculate a median from an empty value set"
            }
            $middle = [int][math]::Floor($ordered.Count / 2)
            if (($ordered.Count % 2) -eq 1) {
              return $ordered[$middle]
            }
            return ($ordered[$middle - 1] + $ordered[$middle]) / 2.0
          }

          if ($runSourceComparison) {
            $diagnosticReports = @(Get-Content -LiteralPath $sourceJsonl |
              ForEach-Object { $_ | ConvertFrom-Json })
            $diagnosticGroups = @($diagnosticReports | Group-Object driver, wait_mode)
            if ($diagnosticGroups.Count -ne 4) {
              throw "Expected four driver/wait-mode diagnostic groups, found $($diagnosticGroups.Count)"
            }
            "| Wait mode | Runs | Actor median P50 ns | Source median P50 ns | P50 delta % | Actor median P99 ns | Source median P99 ns | P99 delta % | Actor median CPU % | Source median CPU % | Actor admission mean ns | Source admission mean ns | Actor completion/drive mean ns | Source completion/drive mean ns |" |
              Set-Content -LiteralPath $sourceMedianSummary
            "| :--- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |" |
              Add-Content -LiteralPath $sourceMedianSummary
            foreach ($waitMode in @("blocking", "busy")) {
              $matchingActor = @($diagnosticReports |
                Where-Object { $_.driver -eq "actor" -and $_.wait_mode -eq $waitMode })
              $matchingSource = @($diagnosticReports |
                Where-Object { $_.driver -eq "source" -and $_.wait_mode -eq $waitMode })
              if ($matchingActor.Count -ne [int]$env:BENCHMARK_RUNS -or
                  $matchingSource.Count -ne [int]$env:BENCHMARK_RUNS) {
                throw "Expected $env:BENCHMARK_RUNS Actor and Source reports for $waitMode, found $($matchingActor.Count) and $($matchingSource.Count)"
              }
              $actorP50 = Get-Median @($matchingActor.p50_ns)
              $sourceP50 = Get-Median @($matchingSource.p50_ns)
              $actorP99 = Get-Median @($matchingActor.p99_ns)
              $sourceP99 = Get-Median @($matchingSource.p99_ns)
              if ($actorP50 -le 0.0 -or $actorP99 -le 0.0) {
                throw "Actor diagnostic percentiles must be positive for $waitMode"
              }
              $p50Delta = 100.0 * ($sourceP50 - $actorP50) / $actorP50
              $p99Delta = 100.0 * ($sourceP99 - $actorP99) / $actorP99
              Add-Content -LiteralPath $sourceMedianSummary -Value `
                ("| {0} | {1} | {2:N0} | {3:N0} | {4:N3} | {5:N0} | {6:N0} | {7:N3} | {8:N3} | {9:N3} | {10:N3} | {11:N3} | {12:N3} | {13:N3} |" -f `
                  $waitMode, $matchingActor.Count, $actorP50, $sourceP50, $p50Delta,
                  $actorP99, $sourceP99, $p99Delta,
                  (Get-Median @($matchingActor.process_cpu_pct)),
                  (Get-Median @($matchingSource.process_cpu_pct)),
                  (Get-Median @($matchingActor.admission_mean_ns)),
                  (Get-Median @($matchingSource.admission_mean_ns)),
                  (Get-Median @($matchingActor.completion_drive_mean_ns)),
                  (Get-Median @($matchingSource.completion_drive_mean_ns)))
            }
          }

          $dualReports = @(Get-Content -LiteralPath $dualNativeJsonl |
            ForEach-Object { $_ | ConvertFrom-Json })
          $dualGroups = @($dualReports | Group-Object protocol, payload_bytes, wait_mode)
          if ($dualGroups.Count -ne 12) {
            throw "Expected twelve dual-native protocol/payload/wait groups, found $($dualGroups.Count)"
          }
          "| Backend | Protocol | Wait mode | Payload bytes | Runs | Median Echo/s | Median MiB/s | Median P99 ns | Median CPU % | Median CPU cores | Median MiB/CPU-s | Median peak RSS bytes |" |
            Set-Content -LiteralPath $dualNativeMedianSummary
          "| :--- | :--- | :--- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |" |
            Add-Content -LiteralPath $dualNativeMedianSummary
          foreach ($group in $dualGroups) {
            if ($group.Count -ne [int]$env:BENCHMARK_RUNS) {
              throw "Expected $env:BENCHMARK_RUNS reports for $($group.Name), found $($group.Count)"
            }
            $first = $group.Group[0]
            Add-Content -LiteralPath $dualNativeMedianSummary -Value `
              ("| {0} | {1} | {2} | {3} | {4} | {5:N3} | {6:N3} | {7:N0} | {8:N3} | {9:N3} | {10:N3} | {11:N0} |" -f `
                $first.backend, $first.protocol, $first.wait_mode,
                $first.payload_bytes, $group.Count,
                (Get-Median @($group.Group.exchanges_per_second)),
                (Get-Median @($group.Group.application_mib_per_second)),
                (Get-Median @($group.Group.p99_ns)),
                (Get-Median @($group.Group.process_cpu_pct)),
                (Get-Median @($group.Group.cpu_core_equivalents)),
                (Get-Median @($group.Group.application_mib_per_cpu_second)),
                (Get-Median @($group.Group.peak_rss_bytes)))
          }

          $summary = $env:GITHUB_STEP_SUMMARY
          Add-Content -LiteralPath $summary -Value "## CFlow Release benchmark: $env:BENCHMARK_HOST"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "$env:BENCHMARK_RUNS raw runs and host/compiler metadata are stored in the job artifact. Shared-runner throughput is evidence, not a cross-host performance gate."
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "<details><summary>Representative run</summary>"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value '```text'
          Get-Content -LiteralPath (Join-Path $resultDir "run-direct-01.txt") |
            Add-Content -LiteralPath $summary
          Get-Content -LiteralPath (Join-Path $resultDir "run-parallel-reduce-01.txt") |
            Add-Content -LiteralPath $summary
          Add-Content -LiteralPath $summary -Value '```'
          Add-Content -LiteralPath $summary -Value "</details>"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "### Native TCP/UDP loopback evidence"
          Add-Content -LiteralPath $summary -Value ""
          Get-Content -LiteralPath $networkSummary | Add-Content -LiteralPath $summary
          Add-Content -LiteralPath $summary -Value ""
          if ($runSourceComparison) {
            Add-Content -LiteralPath $summary -Value "### Actor versus Reactive Source TCP latency"
            Add-Content -LiteralPath $summary -Value ""
            Add-Content -LiteralPath $summary -Value "Both drivers use the same raw loopback echo peer, epoll backend, 64-byte payload, samples, exchanges, wait mode, and enabled stage timing."
            Add-Content -LiteralPath $summary -Value ""
            Get-Content -LiteralPath $sourceMedianSummary | Add-Content -LiteralPath $summary
            Add-Content -LiteralPath $summary -Value ""
            Add-Content -LiteralPath $summary -Value "<details><summary>All Reactive Source raw runs</summary>"
            Add-Content -LiteralPath $summary -Value ""
            Get-Content -LiteralPath $sourceSummary | Add-Content -LiteralPath $summary
            Add-Content -LiteralPath $summary -Value ""
            Add-Content -LiteralPath $summary -Value "</details>"
            Add-Content -LiteralPath $summary -Value ""
          }
          Add-Content -LiteralPath $summary -Value "### Dual-native TCP/UDP Echo evidence"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "Application throughput counts one echoed payload; estimated loopback wire bytes are twice that value."
          Add-Content -LiteralPath $summary -Value ""
          Get-Content -LiteralPath $dualNativeMedianSummary | Add-Content -LiteralPath $summary
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "<details><summary>All dual-native raw runs</summary>"
          Add-Content -LiteralPath $summary -Value ""
          Get-Content -LiteralPath $dualNativeSummary | Add-Content -LiteralPath $summary
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "</details>"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cflow-release-${{ matrix.host }}
          path: benchmark-results
          if-no-files-found: error
          retention-days: 30
