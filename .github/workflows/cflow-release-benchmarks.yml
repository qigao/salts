            throw "Expected $expectedBaselineGroups backend/payload/driver baseline groups, found $($baselineGroups.Count)"
          }
          foreach ($group in $baselineGroups) {
            if ($group.Count -ne [int]$env:BENCHMARK_RUNS) {
              throw "Expected $env:BENCHMARK_RUNS reports for $($group.Name), found $($group.Count)"
            }
          }
          "| Comparison backend | Payload bytes | Runs | Direct median Echo/s | Actor median Echo/s | Median Actor/direct Echo ratio | Direct median App MiB/s | Actor median App MiB/s | Median Actor/direct App MiB ratio | Direct median P99 ns | Actor median P99 ns | Median paired P99 delta ns |" |
            Set-Content -LiteralPath $baselineMedianSummary
          "| :--- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |" |
            Add-Content -LiteralPath $baselineMedianSummary
          foreach ($backend in $networkBackends) {
            foreach ($payloadText in $sourcePayloads) {
              $comparison = Get-CflowPairedDirectSummary `
                -Reports $baselineReports -Backend $backend `
                -PayloadBytes ([int64]$payloadText) `
                -ExpectedRuns ([int]$env:BENCHMARK_RUNS)
              Add-Content -LiteralPath $baselineMedianSummary -Value `
                ("| {0} | {1} | {2} | {3:N3} | {4:N3} | {5:N3} | {6:N3} | {7:N3} | {8:N3} | {9:N0} | {10:N0} | {11:N3} |" -f `
                  $comparison.backend, $comparison.payload_bytes, $comparison.runs,
                  $comparison.direct_median_echo_per_second,
                  $comparison.actor_median_echo_per_second,
                  $comparison.paired_actor_direct_echo_ratio,
                  $comparison.direct_median_application_mib_per_second,
                  $comparison.actor_median_application_mib_per_second,
                  $comparison.paired_actor_direct_application_mib_ratio,
                  $comparison.direct_median_p99_ns,
                  $comparison.actor_median_p99_ns,
                  $comparison.paired_p99_delta_ns)
            }
          }

          $diagnosticReports = @(Get-Content -LiteralPath $sourceJsonl |
            ForEach-Object { $_ | ConvertFrom-Json })
          $diagnosticGroups = @($diagnosticReports |
            Group-Object backend, payload_bytes, driver, wait_mode, `
              source_window_capacity)
          $expectedDiagnosticGroups = (1 + $sourceWindows.Count) * 2 * `
            $sourcePayloads.Count * $networkBackends.Count
          if ($diagnosticGroups.Count -ne $expectedDiagnosticGroups) {
            throw "Expected $expectedDiagnosticGroups backend/payload/driver/wait/window diagnostic groups, found $($diagnosticGroups.Count)"
          }
          foreach ($group in $diagnosticGroups) {
            if ($group.Count -ne [int]$env:BENCHMARK_RUNS) {
              throw "Expected $env:BENCHMARK_RUNS reports for $($group.Name), found $($group.Count)"
            }
          }
          "| Backend | Payload bytes | Wait mode | Source window | Runs | Actor median Echo/s | Source median Echo/s | Median Source/Actor Echo ratio | Actor median App MiB/s | Source median App MiB/s | Median Source/Actor App MiB ratio | Actor median P50 ns | Source median P50 ns | Paired P50 delta ns | Paired P50 delta % | Actor median P95 ns | Source median P95 ns | Paired P95 delta ns | Paired P95 delta % | Actor median P99 ns | Source median P99 ns | Paired P99 delta ns | Paired P99 delta % | Actor median CPU % | Source median CPU % | Source median peak occupied | Paired wall delta ns/exchange | Paired wall delta % | Paired CPU-time delta ns/exchange | Paired CPU-time delta % | Paired CPU-efficiency delta % | Actor median combined stage ns | Source median combined stage ns | Paired combined-stage delta ns | Paired combined-stage delta % |" |
            Set-Content -LiteralPath $sourceMedianSummary
          "| :--- | ---: | :--- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |" |
            Add-Content -LiteralPath $sourceMedianSummary
          foreach ($backend in $networkBackends) {
            foreach ($payloadText in $sourcePayloads) {
            foreach ($waitMode in @("blocking", "busy")) {
            foreach ($sourceWindow in $sourceWindows) {
              $comparison = Get-CflowPairedSourceSummary `
                -Reports $diagnosticReports -Backend $backend `
                -WaitMode $waitMode -PayloadBytes ([int64]$payloadText) `
                -SourceWindow $sourceWindow `
                -ExpectedRuns ([int]$env:BENCHMARK_RUNS)
              Add-Content -LiteralPath $sourceMedianSummary -Value `
                ("| {0} | {1} | {2} | {3} | {4} | {5:N3} | {6:N3} | {7:N3} | {8:N3} | {9:N3} | {10:N3} | {11:N0} | {12:N0} | {13:N3} | {14:N3} | {15:N0} | {16:N0} | {17:N3} | {18:N3} | {19:N0} | {20:N0} | {21:N3} | {22:N3} | {23:N3} | {24:N3} | {25:N3} | {26:N3} | {27:N3} | {28:N3} | {29:N3} | {30:N3} | {31:N3} | {32:N3} | {33:N3} | {34:N3} |" -f `
                  $comparison.backend, $comparison.payload_bytes,
                  $comparison.wait_mode, $comparison.source_window,
                  $comparison.runs,
                  $comparison.actor_median_echo_per_second,
                  $comparison.source_median_echo_per_second,
                  $comparison.paired_source_actor_echo_ratio,
                  $comparison.actor_median_application_mib_per_second,
                  $comparison.source_median_application_mib_per_second,
                  $comparison.paired_source_actor_application_mib_ratio,
                  $comparison.actor_median_p50_ns, $comparison.source_median_p50_ns,
                  $comparison.paired_p50_delta_ns, $comparison.paired_p50_delta_pct,
                  $comparison.actor_median_p95_ns, $comparison.source_median_p95_ns,
                  $comparison.paired_p95_delta_ns, $comparison.paired_p95_delta_pct,
                  $comparison.actor_median_p99_ns, $comparison.source_median_p99_ns,
                  $comparison.paired_p99_delta_ns, $comparison.paired_p99_delta_pct,
                  $comparison.actor_median_cpu_pct,
                  $comparison.source_median_cpu_pct,
                  $comparison.source_median_peak_occupied,
                  $comparison.paired_wall_delta_ns_per_exchange,
                  $comparison.paired_wall_delta_pct,
                  $comparison.paired_cpu_time_delta_ns_per_exchange,
                  $comparison.paired_cpu_time_delta_pct,
                  $comparison.paired_cpu_efficiency_delta_pct,
                  $comparison.actor_median_combined_stage_mean_ns,
                  $comparison.source_median_combined_stage_mean_ns,
                  $comparison.paired_combined_stage_delta_ns,
                  $comparison.paired_combined_stage_delta_pct)
            }
            }
            }
          }

          $pipelineReports = @(Get-Content -LiteralPath $pipelineJsonl |
            ForEach-Object { $_ | ConvertFrom-Json })
          $pipelineGroups = @($pipelineReports |
            Group-Object backend, payload_bytes, wait_mode, `
              source_window_capacity)
          $expectedPipelineGroups = $sourceWindows.Count * 2 * `
            $pipelinePayloads.Count * $networkBackends.Count
          if ($pipelineGroups.Count -ne $expectedPipelineGroups) {
            throw "Expected $expectedPipelineGroups backend/payload/wait/window pipeline groups, found $($pipelineGroups.Count)"
          }
          foreach ($group in $pipelineGroups) {
            if ($group.Count -ne [int]$env:BENCHMARK_RUNS) {
              throw "Expected $env:BENCHMARK_RUNS pipeline reports for $($group.Name), found $($group.Count)"
            }
          }
          "| Backend | Payload bytes | Wait mode | Baseline window | Target window | Runs | Baseline Echo/s | Target Echo/s | Paired Echo ratio | Baseline App MiB/s | Target App MiB/s | Paired App MiB ratio | Baseline P50 ns | Target P50 ns | Paired P50 delta % | Baseline P95 ns | Target P95 ns | Paired P95 delta % | Baseline P99 ns | Target P99 ns | Paired P99 delta % | Baseline CPU % | Target CPU % | Baseline peak | Target peak | Paired wall delta % | Paired CPU-time delta % | Paired CPU-efficiency delta % | Paired combined-stage delta % |" |
            Set-Content -LiteralPath $pipelineMedianSummary
          "| :--- | ---: | :--- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |" |
            Add-Content -LiteralPath $pipelineMedianSummary
          foreach ($backend in $networkBackends) {
            foreach ($payloadText in $pipelinePayloads) {
              foreach ($waitMode in @("blocking", "busy")) {
                foreach ($sourceWindow in @(
                    $sourceWindows | Where-Object { $_ -ne 1 })) {
                  $comparison = Get-CflowPairedSourceWindowSummary `
                    -Reports $pipelineReports -Backend $backend `
                    -WaitMode $waitMode `
                    -PayloadBytes ([int64]$payloadText) `
                    -BaselineWindow 1 -SourceWindow $sourceWindow `
                    -ExpectedRuns ([int]$env:BENCHMARK_RUNS)
                  Add-Content -LiteralPath $pipelineMedianSummary -Value `
                    ("| {0} | {1} | {2} | {3} | {4} | {5} | {6:N3} | {7:N3} | {8:N3} | {9:N3} | {10:N3} | {11:N3} | {12:N0} | {13:N0} | {14:N3} | {15:N0} | {16:N0} | {17:N3} | {18:N0} | {19:N0} | {20:N3} | {21:N3} | {22:N3} | {23:N3} | {24:N3} | {25:N3} | {26:N3} | {27:N3} | {28:N3} |" -f `
                      $comparison.backend, $comparison.payload_bytes,
                      $comparison.wait_mode, $comparison.baseline_window,
                      $comparison.source_window, $comparison.runs,
                      $comparison.baseline_median_echo_per_second,
                      $comparison.source_median_echo_per_second,
                      $comparison.paired_echo_ratio,
                      $comparison.baseline_median_application_mib_per_second,
                      $comparison.source_median_application_mib_per_second,
                      $comparison.paired_application_mib_ratio,
                      $comparison.baseline_median_p50_ns,
                      $comparison.source_median_p50_ns,
                      $comparison.paired_p50_delta_pct,
                      $comparison.baseline_median_p95_ns,
                      $comparison.source_median_p95_ns,
                      $comparison.paired_p95_delta_pct,
                      $comparison.baseline_median_p99_ns,
                      $comparison.source_median_p99_ns,
                      $comparison.paired_p99_delta_pct,
                      $comparison.baseline_median_cpu_pct,
                      $comparison.source_median_cpu_pct,
                      $comparison.baseline_median_peak_occupied,
                      $comparison.source_median_peak_occupied,
                      $comparison.paired_wall_delta_pct,
                      $comparison.paired_cpu_time_delta_pct,
                      $comparison.paired_cpu_efficiency_delta_pct,
                      $comparison.paired_combined_stage_delta_pct)
                }
              }
            }
          }

          $dualReports = @(Get-Content -LiteralPath $dualNativeJsonl |
            ForEach-Object { $_ | ConvertFrom-Json })
          $dualGroups = @($dualReports |
            Group-Object backend, protocol, payload_bytes, wait_mode)
          $expectedDualGroups = 12 * $networkBackends.Count
          if ($dualGroups.Count -ne $expectedDualGroups) {
            throw "Expected $expectedDualGroups backend/protocol/payload/wait dual-native groups, found $($dualGroups.Count)"
          }
          "| Backend | Protocol | Wait mode | Payload bytes | Runs | Median Echo/s | Median App MiB/s | Median P99 ns | Median CPU % | Median CPU cores | Median App MiB/CPU-s | Median peak RSS bytes |" |
            Set-Content -LiteralPath $dualNativeMedianSummary
          "| :--- | :--- | :--- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |" |
            Add-Content -LiteralPath $dualNativeMedianSummary
          foreach ($group in $dualGroups) {
            if ($group.Count -ne [int]$env:BENCHMARK_RUNS) {
              throw "Expected $env:BENCHMARK_RUNS reports for $($group.Name), found $($group.Count)"
            }
            $first = $group.Group[0]
            Add-Content -LiteralPath $dualNativeMedianSummary -Value `
              ("| {0} | {1} | {2} | {3} | {4} | {5:N3} | {6:N3} | {7:N0} | {8:N3} | {9:N3} | {10:N3} | {11:N0} |" -f `
                $first.backend, $first.protocol, $first.wait_mode,
                $first.payload_bytes, $group.Count,
                (Get-CflowMedian @($group.Group.exchanges_per_second)),
                (Get-CflowMedian @($group.Group.application_mib_per_second)),
                (Get-CflowMedian @($group.Group.p99_ns)),
                (Get-CflowMedian @($group.Group.process_cpu_pct)),
                (Get-CflowMedian @($group.Group.cpu_core_equivalents)),
                (Get-CflowMedian @($group.Group.application_mib_per_cpu_second)),
                (Get-CflowMedian @($group.Group.peak_rss_bytes)))
          }

          $summary = $env:GITHUB_STEP_SUMMARY
          Add-Content -LiteralPath $summary -Value "## CFlow Release benchmark: $env:BENCHMARK_HOST"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "$env:BENCHMARK_RUNS raw runs per backend and host/compiler metadata are stored in the job artifact. Requested backends: $($networkBackends -join ', '). Shared-runner throughput is evidence, not a cross-host performance gate."
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "<details><summary>Representative run</summary>"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value '```text'
          Get-Content -LiteralPath (Join-Path $resultDir "run-direct-01.txt") |
            Add-Content -LiteralPath $summary
          Get-Content -LiteralPath (Join-Path $resultDir "run-parallel-reduce-01.txt") |
            Add-Content -LiteralPath $summary
          Add-Content -LiteralPath $summary -Value '```'
          Add-Content -LiteralPath $summary -Value "</details>"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "### Windowed IO Source control path"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "Each run measures $sourceControlSamples timed samples of $sourceControlValues values at windows $($sourceControlWindows -join ', '). Window order rotates by run. Processed values and callback counts include each benchmark's single untimed warm-up sample; timed values and mean ns/value exclude it."
          Add-Content -LiteralPath $summary -Value ""
          Get-Content -LiteralPath $sourceControlMedianSummary |
            Add-Content -LiteralPath $summary
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "<details><summary>All IO Source control-path raw runs</summary>"
          Add-Content -LiteralPath $summary -Value ""
          Get-Content -LiteralPath $sourceControlSummary |
            Add-Content -LiteralPath $summary
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "</details>"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "### Native TCP/UDP loopback evidence"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "Echo/s is the primary rate metric. Application MiB/s counts one echoed payload; latency-profile MiB/s is therefore a small-payload rate derivative, not streaming socket bandwidth. Estimated loopback wire bytes are twice the application byte count."
          Add-Content -LiteralPath $summary -Value ""
          Get-Content -LiteralPath $networkSummary | Add-Content -LiteralPath $summary
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "### Direct socket versus Actor TCP evidence"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "Each pair uses the same blocking raw echo peer, throughput profile, payload, and fixed $sourceSamples x $sourceExchanges observation budget. Payload order rotates by run and driver order is counterbalanced. Ratios and P99 deltas are medians of same-run Actor-versus-direct pairs; the direct driver initializes no CFlow backend, Actor, Executor, or Source."
          Add-Content -LiteralPath $summary -Value ""
          Get-Content -LiteralPath $baselineMedianSummary | Add-Content -LiteralPath $summary
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "<details><summary>All direct baseline raw runs</summary>"
          Add-Content -LiteralPath $summary -Value ""
          Get-Content -LiteralPath $baselineSummary | Add-Content -LiteralPath $summary
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "</details>"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "### Actor versus Reactive Source TCP latency"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "Within each backend, both drivers use the same raw loopback echo peer, wait mode, enabled stage timing, and a fixed $sourceSamples x $sourceExchanges observation budget at 64 B, 1 KiB, and 64 KiB. Each run measures one Actor baseline and Source windows $($sourceWindows -join ', '); their combined execution order rotates by run, backend, payload and wait mode. Deltas and throughput ratios are medians of same-run Source-versus-Actor pairs."
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "Admission is API handoff: Actor through try_submit, Source through cflow_run_request; deferred Source Actor submission is included in completion/drive. Combined stage is the comparable external handoff-to-delivery total."
          Add-Content -LiteralPath $summary -Value "Absolute ns/exchange and combined-stage deltas are the payload-scaling evidence; percentages are contextual. The CFlow native operation stores the caller-owned payload pointer, so increasing payload does not add a framework payload copy by contract."
          Add-Content -LiteralPath $summary -Value "Source peak occupied is reported separately from configured window capacity. This echo workload issues one dependent operation at a time; a peak of one means the run measures capacity/control overhead, not pipelined concurrency."
          Add-Content -LiteralPath $summary -Value ""
          Get-Content -LiteralPath $sourceMedianSummary | Add-Content -LiteralPath $summary
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "<details><summary>All Reactive Source raw runs</summary>"
          Add-Content -LiteralPath $summary -Value ""
          Get-Content -LiteralPath $sourceSummary | Add-Content -LiteralPath $summary
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "</details>"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "### Reactive Source UDP pipeline scaling"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "This independent throughput workload submits bounded batches of UDP sends followed by matching independent receives through one Source. Every run requires actual peak occupancy to equal the configured window. Window 4 and 8 results are paired against the same-run window 1 baseline; Echo/s and App MiB/s ratios above one indicate higher throughput, while negative latency and CPU-time deltas indicate improvement."
          Add-Content -LiteralPath $summary -Value ""
          Get-Content -LiteralPath $pipelineMedianSummary |
            Add-Content -LiteralPath $summary
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "<details><summary>All Reactive Source pipeline raw runs</summary>"
          Add-Content -LiteralPath $summary -Value ""
          Get-Content -LiteralPath $pipelineSummary |
            Add-Content -LiteralPath $summary
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "</details>"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "### Dual-native TCP/UDP Echo evidence"
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "Application throughput counts one echoed payload; estimated loopback wire bytes are twice that value."
          Add-Content -LiteralPath $summary -Value ""
          Get-Content -LiteralPath $dualNativeMedianSummary | Add-Content -LiteralPath $summary
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "<details><summary>All dual-native raw runs</summary>"
          Add-Content -LiteralPath $summary -Value ""
          Get-Content -LiteralPath $dualNativeSummary | Add-Content -LiteralPath $summary
          Add-Content -LiteralPath $summary -Value ""
          Add-Content -LiteralPath $summary -Value "</details>"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cflow-release-${{ matrix.host }}
          path: benchmark-results
          if-no-files-found: error
          retention-days: 30
