name: Dev apply CNet direct-owner patch

# Branch-only edit helper; staged edits are fail-closed and this file is removed before final review.
# This comment-only commit intentionally triggers the Task 4 partial-resubmission RED on a user-authored head.
on:
  push:
    branches: [refactor/cnet-direct-owner-290]
    paths:
      - ".github/dev-apply.patch"
      - ".github/dev-edit.py"

permissions:
  contents: write

concurrency:
  group: dev-apply-cnet-direct-owner
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor/cnet-direct-owner-290
          fetch-depth: 0
      - name: Apply staged edit and amend commit
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .github/dev-edit.py ]; then
            python3 .github/dev-edit.py
            git rm .github/dev-edit.py
          elif [ -f .github/dev-apply.patch ]; then
            git apply --check .github/dev-apply.patch
            git apply .github/dev-apply.patch
            git rm .github/dev-apply.patch
          else
            echo "no staged edit found" >&2
            exit 1
          fi
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --amend --no-edit
          git push --force-with-lease origin HEAD:refactor/cnet-direct-owner-290
