name: Lean proofs

on:
  push:
    branches: [leanv4]
    paths:
      - "formal/**"
      - "cmeta/**"
      - "cflow/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "presets/**"
      - ".github/workflows/lean.yml"
  pull_request:
    paths:
      - "formal/**"
      - "cmeta/**"
      - "cflow/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "presets/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    name: Lean 4 / kernel check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify C header conformance snapshot
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror \
            -I cmeta/include -I cflow/include \
            formal/cmeta_conformance_gen.c \
            -o /tmp/cmeta_conformance_gen
          /tmp/cmeta_conformance_gen > /tmp/GeneratedC.lean
          diff -u formal/CMeta/GeneratedC.lean /tmp/GeneratedC.lean

      - name: Build real CFlow plan conformance witness
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset formal-linux
          cmake --build --preset build-formal-linux \
            --target cmeta_plan_conformance_gen

      - name: Verify plan compiler conformance snapshot
        shell: bash
        run: |
          set -euo pipefail
          build/formal-linux/bin/cmeta_plan_conformance_gen \
            > /tmp/PlanGeneratedC.lean
          diff -u formal/CMeta/PlanGeneratedC.lean /tmp/PlanGeneratedC.lean

      - name: Reject proof placeholders
        shell: bash
        run: |
          if grep -R -nE '^[[:space:]]*(axiom|constant)[[:space:]]|\b(sorry|admit)\b' \
              formal/CMeta.lean formal/CMeta/*.lean; then
            echo "Formal proof files must not contain axioms, constants, sorry, or admit."
            exit 1
          fi

      - name: Install elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL \
            https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(cat formal/lean-toolchain)"
          elan toolchain install "$toolchain"

      - name: Verify Lean and Lake
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake --version

      - name: Generate Lake manifest
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          lake update

      - name: Build and kernel-check Lean proofs
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          lake build --wfail
