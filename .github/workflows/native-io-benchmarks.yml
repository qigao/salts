name: NativeIO and CNet benchmarks

on:
  pull_request:
    paths:
      - ".github/workflows/native-io-benchmarks.yml"
      - "native-io/**"
      - "coroutine/**"
      - "cnet/**"
      - "cflow/include/cflow/io_cnet_adapter.h"
      - "cflow/cnet-adapter/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - ".github/actions/setup-re2c-tools/action.yml"
      - "cmake/ci/benchmark-policy.json"
      - "cmake/ci/verify-benchmark-policy.ps1"
      - "cmake/ci/render-benchmark-verdicts.ps1"
      - "cmake/ci/prune-benchmark-artifacts.ps1"
      - "cflow/include/cflow/io_native_sharded_adapter.h"
      - "cflow/src/io_native_sharded_adapter.c"
      - "cflow/include/cflow/io_actor.h"
      - "cflow/src/io_actor.c"
      - "cflow/include/cflow/io_publisher.h"
      - "cflow/src/io_publisher.c"
      - "cflow/tests/cflow_io_native_sharded_adapter_test.c"
      - "cflow/tests/cflow_io_native_adapter_test.c"
      - "cflow/include/cflow/cflow.h"
      - "cflow/tests/cflow_header_cpp_test.cpp"
      - "cflow/CMakeLists.txt"
      - "cflow/include/cflow/io_native.h"
      - "cflow/src/io_native.c"
      - "cflow/src/io_native_internal.h"
      - "cflow/src/io_native_iocp.c"
      - "cflow/src/io_native_io_uring.c"
      - "cflow/src/io_native_readiness.c"
      - "cflow/tests/cflow_io_native_test.c"
      - "cflow/tests/cflow_pipe_data_plane_contract_test.cmake"
      - "cflow/tests/CMakeLists.txt"
      - "cflow/include/cflow/plan.h"
      - "cflow/include/cflow/plan_internal.h"
      - "cflow/src/plan_exec.c"
      - "cflow/src/plan_compile.c"
      - "cflow/src/plan_parallel_reduce.c"
      - "cflow/src/adapters.c"
      - "cflow/include/cflow/adapters.h"
      - "cflow/tests/cflow_pipeline_test.c"
      - "cflow/tests/cflow_plan_managed_test.c"
      - "cflow/tests/cflow_parallel_reduce_test.c"
      - "cflow/benchmarks/**"
  push:
    branches: [master]
    paths:
      - ".github/workflows/native-io-benchmarks.yml"
      - "native-io/**"
      - "coroutine/**"
      - "cnet/**"
      - "cflow/include/cflow/io_cnet_adapter.h"
      - "cflow/cnet-adapter/**"
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "CMakeUserPresets.json"
      - ".github/actions/setup-re2c-tools/action.yml"
      - "cmake/ci/benchmark-policy.json"
      - "cmake/ci/verify-benchmark-policy.ps1"
      - "cmake/ci/render-benchmark-verdicts.ps1"
      - "cmake/ci/prune-benchmark-artifacts.ps1"
      - "cflow/include/cflow/io_native_sharded_adapter.h"
      - "cflow/src/io_native_sharded_adapter.c"
      - "cflow/include/cflow/io_actor.h"
      - "cflow/src/io_actor.c"
      - "cflow/include/cflow/io_publisher.h"
      - "cflow/src/io_publisher.c"
      - "cflow/tests/cflow_io_native_sharded_adapter_test.c"
      - "cflow/tests/cflow_io_native_adapter_test.c"
      - "cflow/include/cflow/cflow.h"
      - "cflow/tests/cflow_header_cpp_test.cpp"
      - "cflow/CMakeLists.txt"
      - "cflow/include/cflow/io_native.h"
      - "cflow/src/io_native.c"
      - "cflow/src/io_native_internal.h"
      - "cflow/src/io_native_iocp.c"
      - "cflow/src/io_native_io_uring.c"
      - "cflow/src/io_native_readiness.c"
      - "cflow/tests/cflow_io_native_test.c"
      - "cflow/tests/cflow_pipe_data_plane_contract_test.cmake"
      - "cflow/tests/CMakeLists.txt"
      - "cflow/include/cflow/plan.h"
      - "cflow/include/cflow/plan_internal.h"
      - "cflow/src/plan_exec.c"
      - "cflow/src/plan_compile.c"
      - "cflow/src/plan_parallel_reduce.c"
      - "cflow/src/adapters.c"
      - "cflow/include/cflow/adapters.h"
      - "cflow/tests/cflow_pipeline_test.c"
      - "cflow/tests/cflow_plan_managed_test.c"
      - "cflow/tests/cflow_parallel_reduce_test.c"
      - "cflow/benchmarks/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: native-io-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Benchmark scope / policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.scope.outputs.profile }}
      evidence: ${{ steps.scope.outputs.evidence }}
      work: ${{ steps.scope.outputs.work }}
      cnet_compare: ${{ steps.scope.outputs.cnet_compare }}
      native_owner: ${{ steps.scope.outputs.native_owner }}
      native_style: ${{ steps.scope.outputs.native_style }}
      cnet_owner: ${{ steps.scope.outputs.cnet_owner }}
      cnet_io: ${{ steps.scope.outputs.cnet_io }}
      cnet_sg: ${{ steps.scope.outputs.cnet_sg }}
      coroutine: ${{ steps.scope.outputs.coroutine }}
      cflow: ${{ steps.scope.outputs.cflow }}
      native_uring: ${{ steps.scope.outputs.native_uring }}
      forensic: ${{ steps.scope.outputs.forensic }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected benchmark layers
        id: scope
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runFull = "${{ github.event_name }}" -ne "pull_request"
          $benchmarkProfile = if ($runFull) { "full" } else { "pr" }
          if ($runFull) {
            $runCnetCompare = $true
            $runNativeOwner = $true
            $runNativeStyle = $true
            $runCnetOwner = $true
            $runCnetIo = $true
            $runCnetSg = $true
            $runCoroutine = $true
            $runCflow = $true
            $runNativeUring = $true
            $runForensic = $true
          } else {
            $base = "${{ github.event.pull_request.base.sha }}"
            if ([string]::IsNullOrWhiteSpace($base) -or $base -match "^0+$") {
              $runCnetCompare = $true
              $runNativeOwner = $true
              $runNativeStyle = $true
              $runCnetOwner = $true
              $runCnetIo = $true
              $runCnetSg = $true
              $runCoroutine = $true
              $runCflow = $true
              $runNativeUring = $true
              $runForensic = $true
            } else {
              $head = (git rev-parse HEAD).Trim()
              $changed = @(git diff --name-only $base $head)
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

              $verdictRendererChanged = @($changed | Where-Object {
                  $_ -eq "cmake/ci/render-benchmark-verdicts.ps1"
                }).Count -gt 0
              $buildChanged = @($changed | Where-Object {
                  (($_ -like "cmake/*.cmake" -or $_ -like "cmake/**/*.cmake") -and
                    $_ -notlike "cmake/ci/*") -or
                  $_ -eq "CMakeLists.txt" -or
                  $_ -eq "CMakePresets.json" -or
                  $_ -eq "CMakeUserPresets.json" -or
                  $_ -eq ".github/actions/setup-re2c-tools/action.yml"
                }).Count -gt 0
              $dependencyChanged = @($changed | Where-Object {
                  $_ -eq "vcpkg.json" -or $_ -eq "vcpkg-configuration.json"
                }).Count -gt 0

              $nativeRuntime = @($changed | Where-Object {
                  $_ -like "native-io/src/*" -or $_ -like "native-io/include/*" -or
                  $_ -eq "native-io/CMakeLists.txt"
                }).Count -gt 0
              $cnetRuntime = @($changed | Where-Object {
                  $_ -like "cnet/src/*" -or $_ -like "cnet/include/*" -or
                  $_ -eq "cnet/CMakeLists.txt"
                }).Count -gt 0
              $coroutineRuntime = @($changed | Where-Object {
                  $_ -like "coroutine/src/*" -or $_ -like "coroutine/include/*" -or
                  $_ -eq "coroutine/CMakeLists.txt"
                }).Count -gt 0
              $concurrencyRuntime = @($changed | Where-Object {
                  $_ -like "concurrency/src/*" -or $_ -like "concurrency/include/*"
                }).Count -gt 0
              $platformRuntime = @($changed | Where-Object {
                  $_ -like "platform/src/*" -or $_ -like "platform/include/*"
                }).Count -gt 0

              $nativeOwnerBench = @($changed | Where-Object {
                  $_ -like "native-io/benchmarks/*owner*" -or
                  $_ -like "native-io/benchmarks/*sharded*"
                }).Count -gt 0
              $nativeStyleBench = @($changed | Where-Object {
                  $_ -like "native-io/benchmarks/*styles*" -or
                  $_ -like "native-io/benchmarks/*vector*"
                }).Count -gt 0
              $nativeUringBench = @($changed | Where-Object {
                  $_ -like "native-io/benchmarks/*queue_depth*" -or
                  $_ -like "native-io/benchmarks/*queue-depth*" -or
                  $_ -like "native-io/benchmarks/*idle_observe*" -or
                  $_ -like "native-io/benchmarks/*idle-observe*"
                }).Count -gt 0
              $cnetOwnerBench = @($changed | Where-Object {
                  $_ -like "cnet/benchmarks/*owner_parallel*" -or
                  $_ -like "cnet/benchmarks/*shards_parallel*" -or
                  $_ -like "cnet/benchmarks/*external_owner*" -or
                  $_ -like "cnet/benchmarks/*central_callback*"
                }).Count -gt 0
              $cnetIoBench = @($changed | Where-Object {
                  $_ -like "cnet/benchmarks/cnet_io_benchmark*" -or
                  $_ -like "cnet/benchmarks/cnet_scaling*" -or
                  $_ -like "cnet/benchmarks/verify_io_benchmark.ps1" -or
                  $_ -like "cnet/benchmarks/verify_scaling_benchmark.ps1"
                }).Count -gt 0
              $cnetSgBench = @($changed | Where-Object {
                  $_ -like "cnet/benchmarks/*tls_sg*" -or
                  $_ -like "cnet/benchmarks/*tls_provider_parallel*" -or
                  $_ -like "cnet/benchmarks/*tls_public_owner*" -or
                  $_ -like "cnet/benchmarks/*sg_benchmark*" -or
                  $_ -like "cnet/benchmarks/verify_tls_sg_benchmark.ps1" -or
                  $_ -eq "cnet/benchmarks/cnet_io_benchmark.c"
                }).Count -gt 0
              $coroutineBench = @($changed | Where-Object {
                  $_ -like "coroutine/benchmarks/*"
                }).Count -gt 0
              $cflowChanged = @($changed | Where-Object {
                  $_ -like "cflow/*"
                }).Count -gt 0
              $forensicChanged = @($changed | Where-Object {
                  $_ -like "cnet/benchmarks/summarize_*" -or
                  $_ -like "native-io/benchmarks/summarize_*" -or
                  $_ -like "native-io/benchmarks/verify_*mechanism*"
                }).Count -gt 0

              $runNativeOwner = $nativeRuntime -or $nativeOwnerBench -or $concurrencyRuntime -or $platformRuntime -or $buildChanged -or $dependencyChanged
              $runNativeStyle = $nativeRuntime -or $nativeStyleBench -or $coroutineRuntime -or $buildChanged -or $dependencyChanged
              $runCnetOwner = $cnetRuntime -or $cnetOwnerBench -or $nativeRuntime -or $concurrencyRuntime -or $platformRuntime -or $buildChanged -or $dependencyChanged -or $verdictRendererChanged
              $runCnetIo = $cnetRuntime -or $cnetIoBench -or $nativeRuntime -or $coroutineRuntime -or $buildChanged -or $dependencyChanged -or $verdictRendererChanged
              $runCnetSg = $cnetRuntime -or $cnetSgBench -or $nativeRuntime -or $buildChanged -or $dependencyChanged
              $runCoroutine = $coroutineRuntime -or $coroutineBench -or $concurrencyRuntime -or $buildChanged -or $dependencyChanged
              $runCflow = $cflowChanged -or $cnetRuntime -or $nativeRuntime -or $buildChanged -or $dependencyChanged
              $runNativeUring = $nativeRuntime -or $nativeUringBench -or $buildChanged -or $dependencyChanged
              $runForensic = $forensicChanged

              # Only runtime/ABI/build inputs justify rebuilding a second
              # PR-base CNet tree on Windows.
              $runCnetCompare = $cnetRuntime -or $nativeRuntime -or
                $coroutineRuntime -or $concurrencyRuntime -or $platformRuntime -or
                $buildChanged -or $dependencyChanged

            }
          }

          $runEvidence = $runNativeOwner -or $runNativeStyle -or
            $runCnetOwner -or $runCnetIo -or $runCnetSg -or
            $runCoroutine -or $runCflow -or $runNativeUring -or $runForensic
          $runWork = $runEvidence

          "profile=$benchmarkProfile" >> $env:GITHUB_OUTPUT
          "evidence=$($runEvidence.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "work=$($runWork.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "cnet_compare=$($runCnetCompare.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "native_owner=$($runNativeOwner.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "native_style=$($runNativeStyle.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "cnet_owner=$($runCnetOwner.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "cnet_io=$($runCnetIo.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "cnet_sg=$($runCnetSg.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "coroutine=$($runCoroutine.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "cflow=$($runCflow.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "native_uring=$($runNativeUring.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "forensic=$($runForensic.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Report selected benchmark scopes
        shell: pwsh
        run: |
          $rows = @(
            @("native_owner", "${{ steps.scope.outputs.native_owner }}"),
            @("native_style", "${{ steps.scope.outputs.native_style }}"),
            @("cnet_owner", "${{ steps.scope.outputs.cnet_owner }}"),
            @("cnet_io", "${{ steps.scope.outputs.cnet_io }}"),
            @("cnet_sg", "${{ steps.scope.outputs.cnet_sg }}"),
            @("coroutine", "${{ steps.scope.outputs.coroutine }}"),
            @("cflow", "${{ steps.scope.outputs.cflow }}"),
            @("native_uring", "${{ steps.scope.outputs.native_uring }}"),
            @("forensic", "${{ steps.scope.outputs.forensic }}"),
            @("work", "${{ steps.scope.outputs.work }}"),
            @("cnet_compare", "${{ steps.scope.outputs.cnet_compare }}")
          )
          Write-Host "Selected benchmark scopes:"
          foreach ($row in $rows) { Write-Host ("  {0}={1}" -f $row[0], $row[1]) }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## Selected benchmark scopes"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "| Scope | Enabled |"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "|---|---|"
          foreach ($row in $rows) { Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ("| {0} | **{1}** |" -f $row[0], $row[1]) }

      - name: Validate benchmark decision policy
        shell: pwsh
        run: |
          ./cmake/ci/verify-benchmark-policy.ps1 -ProjectRoot . -WriteSummary

      - name: Validate CNet performance CI contract
        shell: pwsh
        run: |
          cmake -DPROJECT_SOURCE_DIR="$env:GITHUB_WORKSPACE" -P ./cnet/tests/cnet_performance_ci_contract_test.cmake

      - name: Validate PR artifact pruning contract
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "benchmark-prune-contract"
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Set-Content -LiteralPath (Join-Path $root "io.samples.csv") -Value "raw"
          Set-Content -LiteralPath (Join-Path $root "io.runs.csv") -Value "summary"
          Set-Content -LiteralPath (Join-Path $root "benchmark-verdicts.csv") -Value "verdict"
          foreach ($name in @("syscalls","stream-style-syscalls","queue-depth-syscalls")) {
            $dir = Join-Path $root $name
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Set-Content -LiteralPath (Join-Path $dir "evidence.trace") -Value "trace"
          }
          ./cmake/ci/prune-benchmark-artifacts.ps1 -EvidenceDir $root
          foreach ($removed in @("io.samples.csv","syscalls","stream-style-syscalls","queue-depth-syscalls")) {
            if (Test-Path -LiteralPath (Join-Path $root $removed)) { throw "forensic artifact was not pruned: $removed" }
          }
          foreach ($kept in @("io.runs.csv","benchmark-verdicts.csv")) {
            if (-not (Test-Path -LiteralPath (Join-Path $root $kept) -PathType Leaf)) { throw "summary artifact was pruned: $kept" }
          }
          Remove-Item -LiteralPath $root -Recurse -Force


  benchmark:
    needs: scope
    if: needs.scope.outputs.work == 'true'
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: epoll / Ubuntu 24.04 GCC
            runner: ubuntu-24.04
            family: linux
            backend: epoll
            artifact: linux-epoll
            configure_preset: linux-release-user
            build_preset: linux-release-user
            build_dir: build/linux-gcc-release
          - host: io_uring / Ubuntu 24.04 GCC
            runner: ubuntu-24.04
            family: linux
            backend: io_uring
            artifact: linux-io-uring
            configure_preset: linux-release-user
            build_preset: linux-release-user
            build_dir: build/linux-gcc-release
          - host: IOCP / Windows 2025 MSVC v145
            runner: windows-2025
            family: windows
            backend: iocp
            artifact: windows-iocp
            configure_preset: win-release-user
            build_preset: win-release-user
            build_dir: build/Msvc-Release
          - host: kqueue / macOS 15 AppleClang
            runner: macos-15
            family: mac
            backend: kqueue
            artifact: macos-kqueue
            configure_preset: mac-release-user
            build_preset: mac-release-user
            build_dir: build/mac-clang-release

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up shared build dependencies (host tools, re2c, vcpkg cache)
        if: needs.scope.outputs.work == 'true'
        id: shared_deps
        uses: ./.github/actions/setup-re2c-tools

      # PRs run only benchmark families touched by the change; master/manual
      # runs deliberately keep the exhaustive matrix for historical evidence.
      - name: Setup Linux dependencies
        if: needs.scope.outputs.work == 'true' && matrix.family == 'linux'
        id: linux-env
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes nasm ninja-build strace
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          test -n "${VCPKG_ROOT:-}"
          test -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          binary_cache="$GITHUB_WORKSPACE/build/vcpkg-binary-cache"
          mkdir -p "$binary_cache"
          echo "VCPKG_BINARY_CACHE=$binary_cache" >> "$GITHUB_ENV"
          echo "image=${ImageOS:-linux}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "triplet=x64-linux" >> "$GITHUB_OUTPUT"

      - name: Restore Linux vcpkg binary cache
        if: needs.scope.outputs.work == 'true' && matrix.family == 'linux'
        id: linux-vcpkg-cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.linux-env.outputs.image }}-${{ steps.linux-env.outputs.triplet }}-${{ steps.shared_deps.outputs.contract_version }}-${{ steps.shared_deps.outputs.cache_revision }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.linux-env.outputs.image }}-${{ steps.linux-env.outputs.triplet }}-${{ steps.shared_deps.outputs.contract_version }}-${{ steps.shared_deps.outputs.cache_revision }}-

      - name: Report Linux vcpkg cache state
        if: needs.scope.outputs.work == 'true' && matrix.family == 'linux'
        shell: bash
        run: echo "vcpkg cache hit=${{ steps.linux-vcpkg-cache.outputs.cache-hit }} contract=${{ steps.shared_deps.outputs.contract_version }} revision=${{ steps.shared_deps.outputs.cache_revision }}"

      - name: Setup Windows build environment
        if: needs.scope.outputs.work == 'true' && matrix.family == 'windows'
        id: windows-env
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vcpkgRoot = $env:VCPKG_ROOT
          if ([string]::IsNullOrWhiteSpace($vcpkgRoot)) {
            throw "VCPKG_ROOT is unavailable"
          }
          $vcpkgToolchain = Join-Path $vcpkgRoot "scripts\buildsystems\vcpkg.cmake"
          if (-not (Test-Path -LiteralPath $vcpkgToolchain -PathType Leaf)) {
            throw "vcpkg toolchain is unavailable: $vcpkgToolchain"
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere is unavailable: $vswhere"
          }
          $vsInstall = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if ($LASTEXITCODE -ne 0) {
            throw "vswhere failed with exit code $LASTEXITCODE"
          }
          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio with the x64 C++ toolchain was not found"
          }
          $vsDevCmd = Join-Path $vsInstall "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) {
            throw "VsDevCmd.bat is unavailable: $vsDevCmd"
          }
          if ([string]::IsNullOrWhiteSpace($env:ImageOS) -or
              [string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            throw "GitHub runner image identity is unavailable"
          }

          $binaryCache = Join-Path $env:GITHUB_WORKSPACE "build\vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $binaryCache | Out-Null
          "PROJECT_ROOT=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
          "VSINSTALL=$vsInstall" >> $env:GITHUB_ENV
          "VCPKG_BINARY_CACHE=$binaryCache" >> $env:GITHUB_ENV
          (Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\x64-windows\bin") >> $env:GITHUB_PATH
          "image=$env:ImageOS-$env:ImageVersion" >> $env:GITHUB_OUTPUT
          "triplet=x64-windows" >> $env:GITHUB_OUTPUT

      - name: Restore Windows vcpkg binary cache
        if: needs.scope.outputs.work == 'true' && matrix.family == 'windows'
        id: windows-vcpkg-cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.windows-env.outputs.image }}-${{ steps.windows-env.outputs.triplet }}-${{ steps.shared_deps.outputs.contract_version }}-${{ steps.shared_deps.outputs.cache_revision }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.windows-env.outputs.image }}-${{ steps.windows-env.outputs.triplet }}-${{ steps.shared_deps.outputs.contract_version }}-${{ steps.shared_deps.outputs.cache_revision }}-

      - name: Report Windows vcpkg cache state
        if: needs.scope.outputs.work == 'true' && matrix.family == 'windows'
        shell: pwsh
        run: Write-Host "vcpkg cache hit=${{ steps.windows-vcpkg-cache.outputs.cache-hit }} contract=${{ steps.shared_deps.outputs.contract_version }} revision=${{ steps.shared_deps.outputs.cache_revision }}"

      - name: Setup macOS dependencies
        if: needs.scope.outputs.work == 'true' && matrix.family == 'mac'
        id: macos-env
        shell: bash
        run: |
          set -euo pipefail
          brew install nasm
          test -n "${VCPKG_ROOT:-}"
          test -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          binary_cache="$GITHUB_WORKSPACE/build/vcpkg-binary-cache"
          mkdir -p "$binary_cache"
          echo "PROJECT_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_CACHE=$binary_cache" >> "$GITHUB_ENV"
          echo "image=${ImageOS:-macos}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "triplet=default-osx-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Restore macOS vcpkg binary cache
        if: needs.scope.outputs.work == 'true' && matrix.family == 'mac'
        id: macos-vcpkg-cache
        uses: actions/cache@v4
        with:
          path: build/vcpkg-binary-cache
          key: vcpkg-binary-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.macos-env.outputs.image }}-${{ steps.macos-env.outputs.triplet }}-${{ steps.shared_deps.outputs.contract_version }}-${{ steps.shared_deps.outputs.cache_revision }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.macos-env.outputs.image }}-${{ steps.macos-env.outputs.triplet }}-${{ steps.shared_deps.outputs.contract_version }}-${{ steps.shared_deps.outputs.cache_revision }}-

      - name: Report macOS vcpkg cache state
        if: needs.scope.outputs.work == 'true' && matrix.family == 'mac'
        shell: bash
        run: echo "vcpkg cache hit=${{ steps.macos-vcpkg-cache.outputs.cache-hit }} contract=${{ steps.shared_deps.outputs.contract_version }} revision=${{ steps.shared_deps.outputs.cache_revision }}"

      - name: Configure and build Linux benchmark targets
        if: needs.scope.outputs.work == 'true' && matrix.family == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset "${{ matrix.configure_preset }}" \
            -DBUILD_BENCHMARKS=ON -DBUILD_TESTS=OFF -DENABLE_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build --preset "${{ matrix.build_preset }}" --parallel 2

      - name: Configure and build Windows benchmark targets
        if: needs.scope.outputs.work == 'true' && matrix.family == 'windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          cmake --preset "${{ matrix.configure_preset }}" -DBUILD_BENCHMARKS=ON -DBUILD_TESTS=OFF -DENABLE_TESTS=OFF -DBUILD_EXAMPLES=OFF
          if errorlevel 1 exit /b 1
          cmake --build --preset "${{ matrix.build_preset }}" --parallel 2
          if errorlevel 1 exit /b 1

      - name: Configure and build macOS benchmark targets
        if: needs.scope.outputs.work == 'true' && matrix.family == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset "${{ matrix.configure_preset }}" \
            -DBUILD_BENCHMARKS=ON -DBUILD_TESTS=OFF -DENABLE_TESTS=OFF -DBUILD_EXAMPLES=OFF
          cmake --build --preset "${{ matrix.build_preset }}" --parallel 2

      - name: Build pre-slot-isolation CFlow benchmark / Windows
        if: needs.scope.outputs.cflow == 'true' && matrix.family == 'windows' && matrix.backend == 'iocp' && github.event_name == 'pull_request'
        shell: cmd
        env:
          CFLOW_SLOT_ISOLATION_BASE_SHA: 847857cdbd637030c3f3e893f68a6e1796831977
        run: |
          set "BASELINE_SOURCE=%RUNNER_TEMP%\salts-cflow-before-slot-isolation"
          if exist "%BASELINE_SOURCE%" rmdir /s /q "%BASELINE_SOURCE%"
          git worktree add --detach "%BASELINE_SOURCE%" "%CFLOW_SLOT_ISOLATION_BASE_SHA%"
          if errorlevel 1 exit /b 1
          cd /d "%BASELINE_SOURCE%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          rem Historical baseline 847857c couples BUILD_BENCHMARKS to BUILD_TESTS.
          rem Keep runtime tests disabled, but enable the old build gate so the
          rem benchmark target is actually generated.
          cmake --preset win-release-user -DBUILD_TESTS=ON -DENABLE_TESTS=OFF -DBUILD_BENCHMARKS=ON -DBUILD_EXAMPLES=OFF
          if errorlevel 1 exit /b 1
          cmake --build --preset win-release-user --parallel 2 --target cflow_parallel_reduce_benchmark
          if errorlevel 1 exit /b 1
          if not exist "build\Msvc-Release\bin\cflow_parallel_reduce_benchmark.exe" exit /b 1

      - name: Run pre-slot-isolation CFlow benchmark / Windows
        if: needs.scope.outputs.cflow == 'true' && matrix.family == 'windows' && matrix.backend == 'iocp' && github.event_name == 'pull_request'
        shell: pwsh
        env:
          CFLOW_SLOT_ISOLATION_BASE_SHA: 847857cdbd637030c3f3e893f68a6e1796831977
        run: |
          $ErrorActionPreference = "Stop"
          $baselineSource = Join-Path $env:RUNNER_TEMP "salts-cflow-before-slot-isolation"
          $benchmark = Join-Path $baselineSource "build/Msvc-Release/bin/cflow_parallel_reduce_benchmark.exe"
          try {
            if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
              throw "Baseline CFlow parallel reduce benchmark not found: $benchmark"
            }
            $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
            New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
            $result = Join-Path $resultDir "cflow-parallel-reduce-windows-before-slot-isolation.txt"
            $output = & $benchmark 2>&1 | Tee-Object -FilePath $result
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## CFlow managed reduce baseline: Windows / IOCP / pre-#817"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "baseline_sha=$env:CFLOW_SLOT_ISOLATION_BASE_SHA"
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '~~~text'
            $output | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '~~~'
          } finally {
            git worktree remove --force $baselineSource 2>$null
          }

      - name: Build CFlow ordered parallel reduce benchmark / Windows
        if: needs.scope.outputs.cflow == 'true' && matrix.family == 'windows' && matrix.backend == 'iocp'
        shell: cmd
        run: |
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          cmake --build --preset "${{ matrix.build_preset }}" --parallel 2 --target cflow_parallel_reduce_benchmark
          if errorlevel 1 exit /b 1

      - name: Run CFlow ordered parallel reduce benchmark / Windows
        if: needs.scope.outputs.cflow == 'true' && matrix.family == 'windows' && matrix.backend == 'iocp'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE "${{ matrix.build_dir }}/bin/cflow_parallel_reduce_benchmark.exe"
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "CFlow parallel reduce benchmark executable not found: $benchmark"
          }
          $result = Join-Path $resultDir "cflow-parallel-reduce-windows-after-slot-isolation.txt"
          $output = & $benchmark 2>&1 | Tee-Object -FilePath $result
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## CFlow ordered parallel reduce measurement: Windows / IOCP / candidate"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '~~~text'
          $output | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '~~~'

      - name: Build PR-base CNet comparison DSO
        if: matrix.family == 'windows' && needs.scope.outputs.cnet_compare == 'true' && github.event_name == 'pull_request'
        shell: cmd
        env:
          CNET_COMPARE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set "BASELINE_SOURCE=%RUNNER_TEMP%\salts-cnet-baseline"
          if exist "%BASELINE_SOURCE%" rmdir /s /q "%BASELINE_SOURCE%"
          git worktree add --detach "%BASELINE_SOURCE%" "%CNET_COMPARE_BASE_SHA%"
          if errorlevel 1 exit /b 1
          cd /d "%BASELINE_SOURCE%"
          set "PROJECT_ROOT=%BASELINE_SOURCE%"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 >nul
          if errorlevel 1 exit /b 1
          set "VCPKG_ROOT=%QIGAO_VCPKG_ROOT%"
          for /f "tokens=2 delims==" %%T in ('findstr /b /c:"VCPKG_TARGET_TRIPLET:STRING=" "%GITHUB_WORKSPACE%\${{ matrix.build_dir }}\CMakeCache.txt"') do set "BASELINE_TARGET_TRIPLET=%%T"
          if not defined BASELINE_TARGET_TRIPLET exit /b 1
          set "BASELINE_PKGCONF=%BASELINE_SOURCE%\vcpkg_installed\%QIGAO_VCPKG_WINDOWS_HOST_TRIPLET%\tools\pkgconf\pkgconf.exe"
          cmake -S . -B build\Msvc-Release -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_TOOLCHAIN_FILE="%QIGAO_VCPKG_TOOLCHAIN_FILE%" ^
            -DVCPKG_TARGET_TRIPLET=%BASELINE_TARGET_TRIPLET% ^
            -DVCPKG_HOST_TRIPLET=%QIGAO_VCPKG_WINDOWS_HOST_TRIPLET% ^
            -DVCPKG_MANIFEST_MODE=ON ^
            -DVCPKG_INSTALLED_DIR="%BASELINE_SOURCE%\vcpkg_installed" ^
            -DBUILD_TESTS=OFF -DBUILD_BENCHMARKS=OFF ^
            -DPKG_CONFIG_EXECUTABLE="%BASELINE_PKGCONF%"
          if errorlevel 1 exit /b 1
          cmake --build build\Msvc-Release --target cnet
          if errorlevel 1 exit /b 1
          if not exist "build\Msvc-Release\bin\cnet.dll" exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%BASELINE_SOURCE%\cmake\ci\stage-windows-cnet-runtime.ps1" -Prefix "%BASELINE_SOURCE%\build\Msvc-Release" -VcpkgInstalledDir "%BASELINE_SOURCE%\vcpkg_installed"
          if errorlevel 1 exit /b 1
          for /f "tokens=2 delims==" %%T in ('findstr /b /c:"VCPKG_TARGET_TRIPLET:STRING=" "build\Msvc-Release\CMakeCache.txt"') do set "BASELINE_TRIPLET=%%T"
          if not defined BASELINE_TRIPLET exit /b 1
          if exist "vcpkg_installed\%BASELINE_TRIPLET%\bin\*.dll" copy /y "vcpkg_installed\%BASELINE_TRIPLET%\bin\*.dll" "build\Msvc-Release\bin\" >nul
          dumpbin /dependents "build\Msvc-Release\bin\cnet.dll"
          if errorlevel 1 exit /b 1
          dir /b "build\Msvc-Release\bin\*.dll"
          echo CNET_COMPARE_BASELINE_DSO=%BASELINE_SOURCE%\build\Msvc-Release\bin\cnet.dll>>"%GITHUB_ENV%"
          echo CNET_COMPARE_CANDIDATE_DSO=%GITHUB_WORKSPACE%\${{ matrix.build_dir }}\bin\cnet.dll>>"%GITHUB_ENV%"
          echo CNET_COMPARE_EXECUTABLE=%GITHUB_WORKSPACE%\${{ matrix.build_dir }}\bin\cnet_owner_lifecycle_compare.exe>>"%GITHUB_ENV%"

      - name: Compare PR-base and candidate CNet owner
        if: matrix.family == 'windows' && needs.scope.outputs.cnet_compare == 'true' && github.event_name == 'pull_request'
        shell: pwsh
        env:
          CNET_IO_BENCHMARK_BACKEND: iocp
          CNET_COMPARE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CNET_COMPARE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          foreach ($path in @($env:CNET_COMPARE_BASELINE_DSO,
                              $env:CNET_COMPARE_CANDIDATE_DSO,
                              $env:CNET_COMPARE_EXECUTABLE)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "CNet owner comparison input not found: $path"
            }
          }
          $report = Join-Path $resultDir "cnet-owner-base-vs-direct.md"
          & $env:CNET_COMPARE_EXECUTABLE `
            $env:CNET_COMPARE_BASELINE_DSO `
            $env:CNET_COMPARE_CANDIDATE_DSO `
            $report
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @(
            "base_sha=$env:CNET_COMPARE_BASE_SHA"
            "candidate_sha=$env:CNET_COMPARE_HEAD_SHA"
            "baseline_dso=$env:CNET_COMPARE_BASELINE_DSO"
            "candidate_dso=$env:CNET_COMPARE_CANDIDATE_DSO"
          ) | Set-Content -LiteralPath (Join-Path $resultDir "cnet-owner-compare-metadata.txt")
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## CNet owner PR-base versus candidate: IOCP"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Get-Content -LiteralPath $report | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Run NativeIO Sharded same-owner versus cross-owner routing benchmark
        if: needs.scope.outputs.native_owner == 'true'
        shell: pwsh
        env:
          NATIVE_IO_SHARDED_BENCH_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_sharded_routing_benchmark
          NATIVE_IO_SHARDED_BENCH_BACKEND: ${{ matrix.backend }}
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:NATIVE_IO_SHARDED_BENCH_EXECUTABLE
          if ($env:RUNNER_OS -eq "Windows") { $benchmark += ".exe" }
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "NativeIO Sharded routing benchmark executable not found: $benchmark"
          }
          $env:NATIVE_IO_SHARDED_BENCH_OUTPUT = Join-Path $resultDir "native-io-sharded-routing"
          $output = & $benchmark 2>&1 |
            Tee-Object -FilePath (Join-Path $resultDir "native-io-sharded-routing.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./native-io/benchmarks/verify_sharded_routing_benchmark.ps1 `
            -Path "$env:NATIVE_IO_SHARDED_BENCH_OUTPUT.csv" `
            -Backend $env:NATIVE_IO_SHARDED_BENCH_BACKEND
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## NativeIO Sharded routing: $env:NATIVE_IO_SHARDED_BENCH_BACKEND"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
          $output | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Prepare Linux benchmark CPU topology
        if: matrix.family == 'linux' && (needs.scope.outputs.native_owner == 'true' || needs.scope.outputs.cnet_owner == 'true' || needs.scope.outputs.coroutine == 'true')
        shell: bash
        env:
          BENCHMARK_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          result_dir="$GITHUB_WORKSPACE/native-io-results"
          mkdir -p "$result_dir"
          allowed="$(taskset -pc "$BASHPID" | sed 's/.*: //')"
          topology="$result_dir/native-io-owner-handoff-topology.csv"
          lscpu -p=CPU,CORE,SOCKET > "$topology"

          expand_cpuset() {
            local spec="$1"
            local part start end cpu
            IFS=',' read -ra parts <<< "$spec"
            for part in "${parts[@]}"; do
              if [[ "$part" == *-* ]]; then
                start="${part%-*}"
                end="${part#*-}"
                for ((cpu = start; cpu <= end; ++cpu)); do echo "$cpu"; done
              else
                echo "$part"
              fi
            done
          }

          mapfile -t cpus < <(expand_cpuset "$allowed")
          if (( ${#cpus[@]} == 0 )); then
            echo "No CPUs found in allowed set: $allowed" >&2
            exit 1
          fi
          first="${cpus[0]}"
          first_key="$(awk -F, -v cpu="$first" '$1 == cpu {print $2 ":" $3; exit}' "$topology")"
          if [[ -z "$first_key" ]]; then
            echo "CPU topology is unavailable for CPU $first" >&2
            exit 1
          fi
          same_core=""
          distinct_core=""
          for cpu in "${cpus[@]:1}"; do
            key="$(awk -F, -v wanted="$cpu" '$1 == wanted {print $2 ":" $3; exit}' "$topology")"
            [[ -z "$key" ]] && continue
            if [[ "$key" == "$first_key" && -z "$same_core" ]]; then
              same_core="$cpu"
            elif [[ "$key" != "$first_key" && -z "$distinct_core" ]]; then
              distinct_core="$cpu"
            fi
          done

          {
            echo "backend=$BENCHMARK_BACKEND"
            echo "runner_allowed_cpu_set=$allowed"
            echo "one_cpu_set=$first"
            echo "two_cpu_same_core_set=$([[ -n "$same_core" ]] && echo "$first,$same_core" || echo unavailable)"
            echo "two_cpu_distinct_core_set=$([[ -n "$distinct_core" ]] && echo "$first,$distinct_core" || echo unavailable)"
          } > "$result_dir/native-io-owner-handoff-cpu-set.txt"

      - name: Run NativeIO owner-to-owner handoff CPU-set sweep
        if: matrix.family == 'linux' && needs.scope.outputs.native_owner == 'true'
        shell: bash
        env:
          SALTS_BENCH_PROFILE: ${{ needs.scope.outputs.profile }}
          NATIVE_IO_OWNER_HANDOFF_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_owner_handoff_benchmark
          NATIVE_IO_OWNER_HANDOFF_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          result_dir="$GITHUB_WORKSPACE/native-io-results"
          mkdir -p "$result_dir"
          benchmark="$GITHUB_WORKSPACE/$NATIVE_IO_OWNER_HANDOFF_EXECUTABLE"
          if [[ ! -x "$benchmark" ]]; then
            echo "NativeIO owner-handoff benchmark executable not found: $benchmark" >&2
            exit 1
          fi
          cpu_sets="$result_dir/native-io-owner-handoff-cpu-set.txt"
          if [[ ! -f "$cpu_sets" ]]; then
            echo "Benchmark CPU-set evidence not found: $cpu_sets" >&2
            exit 1
          fi
          source "$cpu_sets"

          run_case() {
            local label="$1"
            local cpuset="$2"
            local prefix="$result_dir/native-io-owner-handoff-$label"
            export NATIVE_IO_OWNER_HANDOFF_CPU_SET="$label"
            export NATIVE_IO_OWNER_HANDOFF_OUTPUT="$prefix"
            taskset -c "$cpuset" "$benchmark" 2>&1 | tee "$prefix.md"
            pwsh ./native-io/benchmarks/verify_owner_handoff_benchmark.ps1 \
              -Path "$prefix.csv" \
              -Backend "$NATIVE_IO_OWNER_HANDOFF_BACKEND" \
              -CpuSet "$label" \
              -Profile "$SALTS_BENCH_PROFILE"
            {
              echo ""
              echo "## NativeIO owner-to-owner handoff: $NATIVE_IO_OWNER_HANDOFF_BACKEND / $label ($cpuset)"
              echo ""
              cat "$prefix.md"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          run_case one_cpu "$one_cpu_set"
          if [[ "$two_cpu_same_core_set" != "unavailable" ]]; then
            run_case two_cpu_same_core "$two_cpu_same_core_set"
          else
            echo "No second logical CPU on the first physical core; SMT-pair case skipped." |
              tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$two_cpu_distinct_core_set" != "unavailable" ]]; then
            run_case two_cpu_distinct_core "$two_cpu_distinct_core_set"
          else
            echo "No CPU on a distinct physical core; distinct-core case skipped." |
              tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run NativeIO owner one-way mailbox CPU-set sweep
        if: matrix.family == 'linux' && needs.scope.outputs.native_owner == 'true'
        shell: bash
        env:
          SALTS_BENCH_PROFILE: ${{ needs.scope.outputs.profile }}
          NATIVE_IO_OWNER_MAILBOX_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_owner_mailbox_benchmark
          NATIVE_IO_OWNER_MAILBOX_BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          result_dir="$GITHUB_WORKSPACE/native-io-results"
          benchmark="$GITHUB_WORKSPACE/$NATIVE_IO_OWNER_MAILBOX_EXECUTABLE"
          cpu_sets="$result_dir/native-io-owner-handoff-cpu-set.txt"
          if [[ ! -x "$benchmark" ]]; then
            echo "NativeIO owner-mailbox benchmark executable not found: $benchmark" >&2
            exit 1
          fi
          if [[ ! -f "$cpu_sets" ]]; then
            echo "Owner-handoff CPU-set evidence not found: $cpu_sets" >&2
            exit 1
          fi
          source "$cpu_sets"

          run_case() {
            local label="$1"
            local cpuset="$2"
            [[ -z "$cpuset" || "$cpuset" == "unavailable" ]] && return 0
            local prefix="$result_dir/native-io-owner-mailbox-$label"
            export NATIVE_IO_OWNER_MAILBOX_CPU_SET="$label"
            export NATIVE_IO_OWNER_MAILBOX_OUTPUT="$prefix"
            taskset -c "$cpuset" "$benchmark" 2>&1 | tee "$prefix.md"
            pwsh ./native-io/benchmarks/verify_owner_mailbox_benchmark.ps1 \
              -Path "$prefix.csv" \
              -Backend "$NATIVE_IO_OWNER_MAILBOX_BACKEND" \
              -CpuSet "$label" \
              -Profile "$SALTS_BENCH_PROFILE"
            {
              echo ""
              echo "## NativeIO owner one-way mailbox: $NATIVE_IO_OWNER_MAILBOX_BACKEND / $label ($cpuset)"
              echo ""
              cat "$prefix.md"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          run_case one_cpu "$one_cpu_set"
          run_case two_cpu_same_core "$two_cpu_same_core_set"
          run_case two_cpu_distinct_core "$two_cpu_distinct_core_set"

      - name: Run NativeIO owner one-way mailbox default benchmark
        if: matrix.family != 'linux' && needs.scope.outputs.native_owner == 'true'
        shell: pwsh
        env:
          SALTS_BENCH_PROFILE: ${{ needs.scope.outputs.profile }}
          NATIVE_IO_OWNER_MAILBOX_EXECUTABLE: ${{ matrix.build_dir }}/bin/native_io_owner_mailbox_benchmark
          NATIVE_IO_OWNER_MAILBOX_BACKEND: ${{ matrix.backend }}
          NATIVE_IO_OWNER_MAILBOX_CPU_SET: default
        run: |
          $ErrorActionPreference = "Stop"
          $resultDir = Join-Path $env:GITHUB_WORKSPACE "native-io-results"
          New-Item -ItemType Directory -Force -Path $resultDir | Out-Null
          $benchmark = Join-Path $env:GITHUB_WORKSPACE $env:NATIVE_IO_OWNER_MAILBOX_EXECUTABLE
          if ($env:RUNNER_OS -eq "Windows") { $benchmark += ".exe" }
          if (-not (Test-Path -LiteralPath $benchmark -PathType Leaf)) {
            throw "NativeIO owner-mailbox benchmark executable not found: $benchmark"
          }
          $env:NATIVE_IO_OWNER_MAILBOX_OUTPUT = Join-Path $resultDir "native-io-owner-mailbox-default"
          $output = & $benchmark 2>&1 |
            Tee-Object -FilePath (Join-Path $resultDir "native-io-owner-mailbox-default.md")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./native-io/benchmarks/verify_owner_mailbox_benchmark.ps1 `
            -Path "$env:NATIVE_IO_OWNER_MAILBOX_OUTPUT.csv" `
            -Backend $env:NATIVE_IO_OWNER_MAILBOX_BACKEND `
            -CpuSet default `
            -Profile $env:SALTS_BENCH_PROFILE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value ""
