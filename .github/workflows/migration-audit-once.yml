name: migration-audit-once

on:
  push:
    branches: [migration/move-salts-capabilities]
    paths: [.github/workflows/migration-audit-once.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: migration/move-salts-capabilities
          fetch-depth: 0
      - name: Update CFlow ownership boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; p=Path("cflow/README.md"); s=p.read_text(); old="Subprocess standard-stream ownership is provided by the separate\n`Salts::CFlowProcess` adapter target. Message framing, asynchronous\npathname open, file metadata/directory operations, and devices remain separate\ncontracts."; new="Higher-level filesystem and subprocess adapters are owned by SaltsUtils as\n`Salts::FS` and `Salts::Process`. CFlow keeps the portable execution and native\nI/O primitives they consume; it does not export compatibility adapter targets."; assert old in s; p.write_text(s.replace(old,new,1))'
      - name: Audit removed ownership and install verification
        shell: bash
        run: |
          set -euo pipefail
          test ! -e crypto
          test ! -e cflow-fs
          test ! -e cflow-process
          test -z "$(find . -path './.git' -prune -o -path './docs/superpowers' -prune -o -iname '*install*consumer*' -print -quit)"
          test -z "$(find . -path './.git' -prune -o -path './docs/superpowers' -prune -o -iname 'VerifyInstalled*' -print -quit)"
          ! grep -RInE 'Salts::CFlowFS|Salts::CFlowProcess|verify_installed_package|VerifyInstalled|install_consumer|package_consumer' --exclude-dir=.git --exclude-dir=docs .
          ! grep -RInE 'add_subdirectory\((crypto|cflow-fs|cflow-process)\)|Salts::Crypto' CMakeLists.txt cmake tests cstl cflow platform concurrency coroutine native-io cnet cmeta cserde cbind utils parser 2>/dev/null
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/migration-audit-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'docs: finalize salts capability ownership cutover'
          git push origin HEAD:migration/move-salts-capabilities
