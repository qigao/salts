name: CNet dispatcher-bypass A/B benchmark edit

on:
  push:
    branches:
      - perf/cnet-dispatch-bypass-276
    paths:
      - .github/workflows/cnet-dispatch-ab-benchmark-edit.yml

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/cnet-dispatch-bypass-276
      - name: Apply A1 benchmark A/B patch
        run: |
          python3 .github/scripts/cnet_dispatch_ab_benchmark_edit.py
          git diff --check
          git diff -- cnet/benchmarks/cnet_io_benchmark.c
      - name: Commit A1 benchmark A/B patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cnet/benchmarks/cnet_io_benchmark.c
          git commit -m 'perf(cnet): add dispatcher-bypass A/B benchmark'
          git push origin HEAD:perf/cnet-dispatch-bypass-276
